.insight{padding:13px;border-left:4px solid var(--teal);border-radius:11px;background:var(--soft);font-size:.86rem}.insight+.insight{margin-top:9px}.insight.warn{border-left-color:var(--amber)}.insight.bad{border-left-color:var(--rose)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{padding:13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 72%,var(--panel)));box-shadow:var(--shadow)}.metric-label{color:var(--muted);font-size:.71rem;font-weight:760;letter-spacing:.04em;text-transform:uppercase}.metric-value{margin-top:4px;color:color-mix(in srgb,var(--text) 88%,var(--blue));font-size:1.16rem;font-weight:850;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

<body>
<div class="app">
<header><div class="brand"><div class="mark">SP</div><div><h1>Problema sequencial do planejador</h1><p class="subtitle">Formulação intertemporal, existência, unicidade e a divisão entre soluções sequenciais e recursivas</p></div></div><div class="header-actions"><button class="btn" id="themeBtn">◐ Tema</button><button class="btn" id="resetBtn">Reiniciar tópico</button></div></header>

<button class="topic-btn" data-mode="uniqueness"><strong>Unicidade</strong><span>Concavidade estrita e convexidade</span></button>

</div>
<script>
(()=>{"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const defaults={formulation:{beta:.95,A:1,alpha:.36,k0:.45,T:28,share:.32},existence:{beta:.95,A:1,alpha:.36,k0:.4,T:35,share:.28},uniqueness:{beta:.95,A:1,alpha:.36,k0:.5,T:18,s1:.18,s2:.62,lambda:.5},routes:{beta:.95,A:1,alpha:.36,k0:.55,horizon:3,grid:16}};
const state={mode:"formulation",formulation:{...defaults.formulation},existence:{...defaults.existence},uniqueness:{...defaults.uniqueness},routes:{...defaults.routes}};
const KOPT={throwOnError:false,strict:"ignore",trust:false};
const MATH_SYMBOLS=Object.freeze({
  beta:String.raw`\beta`,
  alpha:String.raw`\alpha`,
  lambda:String.raw`\lambda`
});
const pconfig={responsive:true,displaylogo:false,scrollZoom:true,toImageButtonOptions:{format:"png",filename:"planejador_sequencial",scale:2},modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d","toggleSpikelines"]};
function fmt(x,d=3){if(!Number.isFinite(x))return"—";if(Math.abs(x)>=1e5||(Math.abs(x)>0&&Math.abs(x)<1e-4))return x.toExponential(2).replace(".",",");return x.toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:0})}
function lin(a,b,n){return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1))}
function renderKatex(el,expression,display=true){
  if(!el)return;
  const source=String(expression??"");
  if(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(source)){
    console.error("Expressão KaTeX contém caractere de controle:",source);
    el.textContent=source;
    el.classList.add("math-render-error");
    return
  }
  const q=display?`\\displaystyle ${source}`:source;
  if(!window.katex){el.textContent=source;return}
  try{
    katex.render(q,el,{...KOPT,displayMode:display,errorColor:"#d95672"});
    el.classList.remove("math-render-error")
  }catch(error){
    console.error("Erro KaTeX:",source,error);
    el.textContent=source;
    el.classList.add("math-render-error")
  }
}
function tex(el,e,display=true){renderKatex(el,e,display)}
function math(root=document){
  if(!window.katex)return;
  $$('[data-tex]',root).forEach(el=>{
    const d=el.dataset.display!=="false";
    renderKatex(el,el.dataset.tex,d)
  })
}
function theme(){const d=document.body.classList.contains("dark");return{d,text:d?"#a9b5bf":"#68727e",strong:d?"#eef3f6":"#17212b",grid:d?"rgba(74,94,108,.32)":"rgba(190,193,188,.42)",axis:d?"#40515f":"#c8c9c2",panel:d?"#151e27":"#fffefa",blue:d?"#79a9ff":"#2563eb",teal:d?"#55d5c9":"#0f9f95",violet:d?"#b49aff":"#7c3aed",rose:d?"#ff8da4":"#d95672",amber:d?"#f1bb62":"#b66c0a",green:d?"#69d59d":"#18794e"}}
function rgba(h,a){const v=h.replace("#",""),f=v.length===3?v.split("").map(c=>c+c).join(""):v,n=parseInt(f,16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function layout(xt,yt,e={}){const t=theme(),ax={showline:true,linewidth:1,linecolor:t.axis,ticks:"outside",ticklen:5,tickcolor:t.axis,tickfont:{size:11,color:t.text},gridcolor:t.grid,griddash:"dot",zeroline:true,zerolinecolor:t.axis,automargin:true,title:{font:{size:12,color:t.text},standoff:12}};return{margin:{l:68,r:30,t:28,b:68},paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Inter, system-ui, sans-serif",color:t.text,size:12},colorway:[t.blue,t.violet,t.teal,t.rose,t.amber,t.green],xaxis:{...ax,title:{text:xt}},yaxis:{...ax,title:{text:yt}},hovermode:"x unified",hoverlabel:{bgcolor:t.panel,bordercolor:t.axis,font:{color:t.strong}},legend:{orientation:"h",y:-.25,x:0,font:{size:11,color:t.text}},transition:{duration:260,easing:"cubic-in-out"},dragmode:"pan",...e}}
function polish(tr){const t=theme(),cs=[t.blue,t.violet,t.teal,t.rose,t.amber,t.green];return tr.map((r,i)=>{const c=r.line?.color||r.marker?.color||cs[i%cs.length],o={...r},sc=(r.type||"scatter")==="scatter",m=r.mode||"lines";if(sc&&m.includes("lines"))o.line={width:i===0?3.3:2.4,shape:"spline",smoothing:.5,...r.line,color:c};if(sc&&m.includes("markers"))o.marker={size:r.marker?.size||5,color:c,line:{width:1.2,color:t.panel},...r.marker};if(r.fill)o.fillcolor=r.fillcolor||rgba(c,.1);o.hovertemplate=r.hovertemplate||`<b>${r.name||"Série"}</b><br>x: %{x:.4g}<br>y: %{y:.4g}<extra></extra>`;return o})}
function plot(id,tr,l){return Plotly.react(id,polish(tr),l,pconfig)}
function slider(id,label,v,min,max,step,help,sym=""){return String.raw`<div class="control"><div class="control-head"><span>${label}${sym?` <span data-tex="${sym}" data-display="false"></span>`:""}</span><output id="${id}Out">${fmt(v,3)}</output></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}"><small>${help}</small></div>`}
function metric(l,id){return`<div class="metric"><div class="metric-label">${l}</div><div class="metric-value" id="${id}">—</div></div>`}
function bind(id,obj,key,cb){const el=$("#"+id);if(!el)return;const run=()=>{obj[key]=Number(el.value);const out=$("#"+id+"Out");if(out)out.textContent=fmt(obj[key],["T","horizon","grid"].includes(key)?0:3);cb()};el.addEventListener("input",run);el.addEventListener("change",run)}
function F(k,A,a){return A*Math.pow(Math.max(0,k),a)}function khat(A,a){return Math.pow(A,1/(1-a))}
function plan(p){const k=[p.k0],c=[],y=[],viol=[];for(let t=0;t<p.T;t++){const out=F(k[t],p.A,p.alpha),kp=p.share*out,ct=(1-p.share)*out;y.push(out);c.push(ct);viol.push(Math.max(0,ct+kp-out));k.push(kp)}const yl=F(k[p.T],p.A,p.alpha);y.push(yl);c.push((1-p.share)*yl);return{k,c,y,viol}}
function setMode(m){state.mode=m;$$('.topic-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}
function render(){if(state.mode==='formulation')formulation();if(state.mode==='existence')existence();if(state.mode==='uniqueness')uniqueness();if(state.mode==='routes')routes()}

function formulation(){const s=state.formulation;$('#sidebar').innerHTML=String.raw`<h2 class="sidebar-title">Formulação sequencial</h2><p class="sidebar-subtitle">Gere um plano viável ilustrativo e leia cada objeto do problema infinito.</p>${slider('fBeta','Fator de desconto',s.beta,.5,.995,.005,'Pondera a utilidade de cada data.',MATH_SYMBOLS.beta)}${slider('fA','Produtividade',s.A,.4,2.2,.05,'Determina os recursos correntes.','A')}${slider('fAlpha','Elasticidade',s.alpha,.08,.92,.01,'Controla a curvatura da tecnologia.',MATH_SYMBOLS.alpha)}${slider('fK0','Capital inicial',s.k0,.02,6,.02,'Estado exógeno.','k_0')}${slider('fT','Horizonte exibido',s.T,8,60,1,'A formulação teórica permanece infinita.','T')}${slider('fShare','Fração ilustrativa poupada',s.share,.02,.95,.01,'Gera um plano viável, não uma solução ótima.','s')}<div class="control"><div class="control-head"><span>Presets</span></div><div class="preset-grid"><button class="preset" data-fp="base">Padrão</button><button class="preset" data-fp="consume">Mais consumo</button><button class="preset" data-fp="save">Mais capital</button><button class="preset" data-fp="patient">β elevado</button></div></div>`;
$('#content').innerHTML=String.raw`<section class="hero"><article class="card"><div class="eyebrow">Problema do planejador</div><h2>Escolha simultânea de uma sequência infinita</h2><div class="formula-box" data-tex="\begin{aligned}V^*(k_0):=\max_{\{c_t,k_{t+1}\}\in\Pi(k_0)}\;&\sum_{t=0}^{\infty}\beta^t\ln c_t\\ \text{sujeito a}\quad&c_t+k_{t+1}\leq Ak_t^\alpha,\quad c_t\geq0,\quad k_{t+1}\geq0.\end{aligned}"></div><p class="muted">O planejador escolhe uma trajetória completa, não uma decisão isolada.</p></article><article class="card"><div class="eyebrow">Leitura econômica</div><div class="insight"><strong>Estado:</strong> k₀ condiciona todo o conjunto de possibilidades.</div><div class="insight"><strong>Controles:</strong> cₜ e kₜ₊₁ estão ligados por uma restrição em cada data.</div><div class="insight warn"><strong>Benchmark:</strong> não há mercados nem preços nesta etapa.</div></article></section><section class="metrics">${metric('Utilidade truncada','fU')}${metric('Capital final','fK')}${metric('Consumo mínimo','fC')}${metric('Erro de viabilidade','fV')}</section><section class="chart-grid"><article class="card chart-card"><div class="eyebrow">Plano ilustrativo</div><h2>Capital e consumo</h2><div id="fPath" class="chart"></div><p class="chart-note">A fração constante gera apenas um exemplo viável.</p></article><article class="card chart-card"><div class="eyebrow">Objetivo</div><h2>Contribuições descontadas</h2><div id="fContrib" class="chart"></div><p class="chart-note">Cada barra é βᵗ ln cₜ.</p></article><article class="card chart-card"><div class="eyebrow">Restrição</div><h2>Produto e usos</h2><div id="fRes" class="chart"></div><p class="chart-note">Consumo e capital seguinte esgotam o produto no plano exibido.</p></article><article class="card"><div class="eyebrow">Uma escolha por período</div><h2>Eliminar c não muda o problema</h2><div class="formula-box" data-tex="\begin{aligned}c_t&=Ak_t^\alpha-k_{t+1},\\ V^*(k_0)&=\max_{\{k_{t+1}\}}\sum_{t=0}^{\infty}\be function problem(s){const km=Math.max(s.k0,khat(s.A,s.alpha))*1.18,g=lin(.002,km,Math.round(s.grid)),i0=near(g,s.k0),acts=[];for(let i=0;i<g.length;i++){const r=F(g[i],s.A,s.alpha),q=[];for(let j=0;j<g.length;j++){if(r-g[j]>1e-9)q.push(j)}acts.push(q)}return{g,i0,acts}}
function seq(s,p){let leaves=0,ops=0,best=-Infinity,path=[];function rec(stage,i,val,pa){const k=p.g[i];if(stage===s.horizon){const c=F(k,s.A,s.alpha);ops++;if(c<=0)return;const total=val+Math.pow(s.beta,stage)*Math.log(c);leaves++;if(total>best){best=total;path=[...pa,i]}return}for(const j of p.acts[i]){const c=F(k,s.A,s.alpha)-p.g[j];ops++;if(c>0)rec(stage+1,j,val+Math.pow(s.beta,stage)*Math.log(c),[...pa,i])}}rec(0,p.i0,0,[]);return{value:best,path,leaves,ops}}
function recsolve(s,p){const memo=new Map(),choice=new Map();let ops=0,subs=0;function solve(stage,i){const key=stage+'|'+i;if(memo.has(key))return memo.get(key);subs++;const k=p.g[i];if(stage===s.horizon){const c=F(k,s.A,s.alpha);ops++;const v=c>0?Math.pow(s.beta,stage)*Math.log(c):-Infinity;memo.set(key,v);return v}let best=-Infinity,bj=null;for(const j of p.acts[i]){const c=F(k,s.A,s.alpha)-p.g[j];ops++;if(c<=0)continue;const v=Math.pow(s.beta,stage)*Math.log(c)+solve(stage+1,j);if(v>best){best=v;bj=j}}memo.set(key,best);choice.set(key,bj);return best}const value=solve(0,p.i0),path=[];let cur=p.i0;for(let st=0;st<=s.horizon;st++){path.push(cur);if(st<s.horizon)cur=choice.get(st+'|'+cur)}return{value,path,ops,subs}}
function updateR(){const s=state.routes,p=problem(s),a=seq(s,p),b=recsolve(s,p),diff=Math.abs(a.value-b.value);$('#rSeq').textContent=fmt(a.value,5);$('#rRec').textContent=fmt(b.value,5);$('#rDiff').textContent=fmt(diff,9);$('#rFirst').textContent=b.path.length>1?fmt(p.g[b.path[1]],4):'—';$('#rLeaves').textContent=a.leaves.toLocaleString('pt-BR');$('#rSubs').textContent=b.subs.toLocaleString('pt-BR');$('#rSeqOps').textContent=a.ops.toLocaleString('pt-BR');$('#rRecOps').textContent=b.ops.toLocaleString('pt-BR');const k=b.path.map(i=>p.g[i]),c=[];for(let t=0;t<s.horizon;t++)c.push(F(k[t],s.A,s.alpha)-k[t+1]);c.push(F(k.at(-1),s.A,s.alpha));const tt=Array.from({length:s.horizon+1},(_,i)=>i),th=theme();plot('rPath',[{x:tt,y:k,type:'scatter',mode:'lines+markers',name:'Capital',marker:{size:7,color:th.blue},line:{color:th.blue}},{x:tt,y:c,type:'scatter',mode:'lines+markers',name:'Consumo',marker:{size:7,color:th.violet},line:{color:th.violet}}],layout('Data, t','Nível'));plot('rCost',[{x:['Sequencial','Recursiva'],y:[a.ops,b.ops],type:'bar',name:'Avaliações',marker:{color:[th.rose,th.teal]},text:[a.ops.toLocaleString('pt-BR'),b.ops.toLocaleString('pt-BR')],textposition:'outside',cliponaxis:false}],layout('Método','Avaliações',{hovermode:'closest',bargap:.48,yaxis:{...layout('','').yaxis,type:a.ops/Math.max(1,b.ops)>30?'log':'linear',title:{text:'Avaliações'}}}))}

function reset(){state[state.mode]={...defaults[state.mode]};render()}$$('.topic-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('#themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');render()});$('#resetBtn').addEventListener('click',reset);window.addEventListener('resize',()=>$$('.chart').forEach(el=>window.Plotly&&Plotly.Plots.resize(el)));document.addEventListener('DOMContentLoaded',render);window.addEventListener('load',render);
