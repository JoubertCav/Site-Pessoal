*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% -10%,color-mix(in srgb,var(--wine) 10%,transparent),transparent 34rem),var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}.shell{width:min(1260px,calc(100% - 32px));margin:auto;padding:24px 0 40px}.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.crumb{color:var(--wine);font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.crumb a{color:inherit;text-decoration:none}h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.025em}h1{font-size:clamp(2.5rem,6vw,5.3rem);line-height:.94;margin:.55rem 0 .8rem;max-width:900px}.sub{max-width:820px;color:var(--muted);font-size:1rem;margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}button,a.button{border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:9px 13px;font:inherit;font-size:.84rem;cursor:pointer;text-decoration:none}button:hover,a.button:hover{border-color:var(--wine)}button.primary{background:var(--wine);border-color:transparent;color:#fff}.progress{height:3px;background:var(--line);margin:25px 0 16px}.progress span{display:block;height:100%;width:11.11%;background:var(--wine);transition:width .25s}.stepnav{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:14px}.stepdot{border-radius:10px;padding:10px 6px;background:transparent;color:var(--muted);font-size:.72rem;text-align:center}.stepdot[aria-current="step"]{background:color-mix(in srgb,var(--wine) 12%,var(--paper));border-color:var(--wine);color:var(--ink)}.stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:18px;align-items:stretch}.visual,.notes{border:1px solid var(--line);border-radius:22px;background:var(--paper);box-shadow:var(--shadow)}.visual{padding:clamp(16px,3vw,28px);min-height:610px;display:flex;flex-direction:column}.notes{padding:23px;display:flex;flex-direction:column;gap:16px}.step-label{color:var(--wine);font:800 .74rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}.visual h2{font-size:clamp(1.8rem,3vw,2.75rem);line-height:1.03;margin:.55rem 0 .3rem}.visual .lead{color:var(--muted);margin:0 0 18px;max-width:720px}.canvas{flex:1;min-height:430px;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--ink) 4%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--ink) 4%,transparent) 1px,transparent 1px),color-mix(in srgb,var(--paper) 92%,var(--paper-2));background-size:42px 42px}.formula{font-family:var(--serif);font-size:1.18rem;line-height:1.65;background:var(--paper-2);border-radius:14px;padding:14px;overflow:auto}.takeaway{border-left:4px solid var(--teal);padding:4px 0 4px 14px}.takeaway strong,.aside-title{display:block;margin-bottom:4px}.notes ul{margin:0;padding-left:1.15rem;color:var(--muted)}.notes li+li{margin-top:.5rem}.control{margin-top:auto}.control label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.8rem;margin-bottom:7px}.control output{color:var(--ink);font-family:ui-monospace,monospace}.control input{width:100%;accent-color:var(--wine)}.pager{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.pager button{min-width:112px}.svg{width:100%;height:100%;display:block}.svg text{font-family:var(--sans);fill:var(--ink)}.svg .muted{fill:var(--muted)}.svg .serif{font-family:var(--serif)}.svg .box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}.svg .soft-wine{fill:color-mix(in srgb,var(--wine) 12%,var(--paper));stroke:var(--wine)}.svg .soft-teal{fill:color-mix(in srgb,var(--teal) 12%,var(--paper));stroke:var(--teal)}.svg .soft-blue{fill:color-mix(in srgb,var(--blue) 12%,var(--paper));stroke:var(--blue)}.svg .edge{fill:none;stroke:var(--muted);stroke-width:2}.svg .wine{stroke:var(--wine);fill:none}.svg .teal{stroke:var(--teal);fill:none}.svg .blue{stroke:var(--blue);fill:none}.svg .red{stroke:var(--red);fill:none}.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:28px;height:100%;align-content:center}.a-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--paper);min-height:118px}.a-card b{display:block;color:var(--wine);margin-bottom:5px}.a-card span{font-family:var(--serif);font-size:1.05rem}.a-card small{display:block;color:var(--muted);margin-top:8px}.ladder{padding:30px;display:flex;flex-direction:column-reverse;gap:12px;justify-content:center;height:100%}.rung{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--paper);position:relative}.rung:nth-child(2){margin-left:10%}.rung:nth-child(3){margin-left:20%}.rung:nth-child(4){margin-left:30%}.rung b{color:var(--wine)}.rung small{display:block;color:var(--muted);margin-top:4px}@media(max-width:980px){.stage{grid-template-columns:1fr}.visual{min-height:auto}.notes{min-height:360px}.stepnav{grid-template-columns:repeat(5,1fr)}}@media(max-width:620px){.shell{width:min(100% - 18px,1260px);padding-top:14px}.top{grid-template-columns:1fr}.actions{justify-content:flex-start}h1{font-size:2.65rem}.stepnav{grid-template-columns:repeat(3,1fr)}.stepdot{padding:8px 4px}.visual,.notes{border-radius:16px}.visual{padding:12px}.canvas{min-height:390px}.matrix{grid-template-columns:1fr;padding:14px}.a-card{min-height:auto}.rung:nth-child(n){margin-left:0}}

<div class="shell">
  <header class="top">
    <div><div class="crumb"><a href="index.html">Econometrics · Population regression</a></div><h1>From distribution to interpretation</h1><p class="sub">A nine-step visual argument: name the population object, identify it from F, and only then decide what a regression coefficient can mean.</p></div>

<script>
const steps=[
{id:'distribution',short:'F → objects',title:'One distribution, two population objects',lead:'Before imposing a model, the joint distribution already contains both the conditional mean and its best linear compression.',formula:'F(y,x) → m(x) = E[y | x] &nbsp;&nbsp; and &nbsp;&nbsp; β = Q<sub>xx</sub><sup>−1</sup>E[xy]',take:'The CEF and the linear projection are both features of F. Neither requires a sample regression or a causal story.',bullets:['m(x) keeps the full conditional-mean shape.','x′β restricts prediction to the linear class.','The two objects can exist and differ in the same population.'],draw:drawDistribution},
{id:'conditioning',short:'Conditioning',title:'Two rules do most of the work',lead:'The tower property moves between information sets; taking out what is known treats functions of x as constants after conditioning on x.',formula:'E[E[y | x]] = E[y]<br>E[h(x)y | x] = h(x)E[y | x]',take:'These identities turn conditional restrictions into unconditional moments, but not generally the other way around.',bullets:['Richer information can be averaged back down.','Anything determined by x is known inside E[· | x].','They imply E[h(x)ε] = 0 from E[ε | x] = 0.'],draw:drawConditioning},
{id:'cef',short:'CEF',title:'The CEF is the best predictor using x',lead:'Every predictor g(x) misses y by irreducible noise plus its own distance from the conditional mean.',formula:'E[(y − g(x))²] = E[ε²] + E[(m(x) − g(x))²]',take:'Choosing g = m eliminates approximation loss. Nothing measurable in x can predict the remaining CEF error ε.',bullets:['ε = y − m(x).','E[ε | x] = 0 and E[h(x)ε] = 0.','Optimality is over all measurable functions of x.'],draw:drawCef},
{id:'projection',short:'Projection',title:'The linear projection is the best line',lead:'Restrict the predictor class to x′b. The minimizing coefficient solves population normal equations.',formula:'β = arg min<sub>b</sub> E[(y − x′b)²]<br>Q<sub>xx</sub>β = E[xy], &nbsp; E[xe] = 0',take:'Projection orthogonality is automatic once β is defined. It is not, by itself, an exogeneity assumption.',bullets:['e = y − x′β.','The same β best approximates m(x) by a line.','With a constant, the projection error also has mean zero.'],draw:drawProjection},
{id:'coincidence',short:'Coincidence',title:'A best line need not be the CEF',lead:'Increase curvature to pull the conditional mean away from its best linear summary while the projection error remains orthogonal to x.',formula:'m(x) = x′β ⇔ e = ε ⇔ E[e | x] = 0',take:'Zero covariance E[xe] = 0 survives nonlinearity. Conditional mean zero does not.',bullets:['The curved path is the CEF.','The straight path is the linear projection.','Only at zero curvature do their errors coincide.'],draw:drawCoincidence,control:'curvature'},
{id:'assumptions',short:'A1–A6',title:'The assumptions are not a checklist',lead:'Each classical assumption buys a distinct layer of the regression argument.',formula:'Model → identification → CEF reading → efficiency → design → exact finite-sample law',take:'Losing an assumption costs its particular conclusion—not every conclusion at once.',bullets:['A2 is the identification hinge.','A3 upgrades projection to a CEF interpretation.','A4 and A6 govern variance efficiency and exact inference.'],draw:drawAssumptions},
{id:'identification',short:'Rank',title:'Rank turns moments into one coefficient vector',lead:'A positive-definite Qxx makes the moment map one-to-one. Exact collinearity leaves an entire line of observationally equivalent coefficients.',formula:'Q<sub>xx</sub> ≻ 0 ⇒ β = Q<sub>xx</sub><sup>−1</sup>E[xy] is unique<br>Q<sub>xx</sub>a = 0 ⇒ β and β + ca are equivalent',take:'A singular population matrix is an identification failure, not a numerical inconvenience.',bullets:['More observations cannot break an exact identity.','A pseudo-inverse chooses a representative; it does not identify it.','Repair the regressor set or reparameterize the target.'],draw:drawIdentification},
{id:'omitted',short:'Omitted x',title:'Omitted variables enter through the error',lead:'The short regression absorbs the omitted variable’s effect whenever that variable moves with the included regressor.',formula:'β<sub>short</sub> = γ<sub>educ</sub> + γ<sub>age</sub>δ, &nbsp; δ = Cov(educ,age)/Var(educ)',take:'The short-regression projection is still identified. What fails is its interpretation as the ceteris paribus schooling effect.',bullets:['Omitted age becomes part of ε.','A nonzero auxiliary-regression slope δ makes E[ε | educ] nonzero.','Bias needs both γage ≠ 0 and δ ≠ 0.'],draw:drawOmitted,control:'correlation'},
{id:'hierarchy',short:'Meaning',title:'Interpretation is a ladder of assumptions',lead:'The same reported slope can name three different objects. Each higher reading requires an additional claim.',formula:'projection coefficient ⊂ CEF slope ⊂ causal effect',take:'Always state which rung you mean and what justifies moving up to it.',bullets:['A2 identifies the projection coefficient.','A3 or linear CEF structure gives the conditional-mean slope.','A causal effect needs substantive potential-outcome assumptions.'],draw:drawHierarchy}
];
let active=0,curvature=1.2,correlation=-.55;
const $=id=>document.getElementById(id),canvas=$('canvas');
function svgEl(tag,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function svgBase(){canvas.innerHTML='';const s=svgEl('svg',{viewBox:'0 0 900 500',class:'svg',role:'img','aria-label':steps[active].title});const defs=svgEl('defs');const marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--muted)'}));defs.append(marker);s.append(defs);canvas.append(s);return s}
function add(s,tag,a={},text=''){const e=svgEl(tag,a);if(text)e.textContent=text;s.append(e);return e}
function box(s,x,y,w,h,title,sub,cls='box'){add(s,'rect',{x,y,width:w,height:h,rx:18,class:cls});add(s,'text',{x:x+w/2,y:y+31,'text-anchor':'middle','font-size':17,'font-weight':700},title);if(sub)add(s,'text',{x:x+w/2,y:y+58,'text-anchor':'middle','font-size':13,class:'muted'},sub);}
function arrow(s,x1,y1,x2,y2,label=''){add(s,'line',{x1,y1,x2,y2,class:'edge','marker-end':'url(#arrow)'});if(label)add(s,'text',{x:(x1+x2)/2,y:(y1+y2)/2-9,'text-anchor':'middle','font-size':12,class:'muted'},label)}
function drawDistribution(){const s=svgBase();box(s,325,38,250,82,'Joint distribution F','of observable (y, x)','soft-wine');arrow(s,390,120,230,205,'condition');arrow(s,510,120,665,205,'minimize MSE over lines');box(s,75,205,310,112,'Conditional expectation function','m(x) = E[y | x]','soft-teal');box(s,515,205,310,112,'Linear projection','L[y | x] = x′β','soft-blue');arrow(s,230,317,385,397,'full shape');arrow(s,670,317,515,397,'linear summary');box(s,315,397,270,72,'Coincide only if CEF is linear','m(x) = x′β','box')}
function drawConditioning(){const s=svgBase();box(s,80,55,230,78,'y','raw outcome','soft-wine');box(s,335,55,230,78,'E[y | x₁,x₂]','richer information','soft-blue');box(s,590,55,230,78,'E[y | x₁]','coarser information','soft-teal');arrow(s,310,94,335,94);arrow(s,565,94,590,94,'average out x₂');add(s,'path',{d:'M705 133 C705 195 450 190 450 250',class:'edge','marker-end':'url(#arrow)'});box(s,315,250,270,82,'E[E[y | x₁,x₂] | x₁]','equals E[y | x₁]','box');box(s,115,365,285,75,'h(x) is known given x','pull it outside','soft-teal');box(s,500,365,285,75,'E[h(x)y | x]','h(x) E[y | x]','soft-blue');arrow(s,400,402,500,402)}
function drawCef(){const s=svgBase();box(s,315,42,270,78,'Prediction error','y − g(x)','soft-wine');arrow(s,450,120,265,205);arrow(s,450,120,635,205);box(s,85,205,300,95,'Irreducible noise','ε = y − m(x)','soft-blue');box(s,515,205,300,95,'Approximation error','m(x) − g(x)','soft-teal');add(s,'text',{x:450,y:355,'text-anchor':'middle','font-size':24,class:'serif'},'orthogonality kills the cross term');add(s,'text',{x:450,y:395,'text-anchor':'middle','font-size':18,class:'muted'},'minimum at g(x) = m(x)');add(s,'path',{d:'M230 315 C315 450 585 450 670 315',class:'teal','stroke-width':4});add(s,'circle',{cx:450,cy:425,r:7,fill:'var(--teal)'})}
function drawProjection(){const s=svgBase();add(s,'line',{x1:85,y1:420,x2:835,y2:420,class:'edge'});add(s,'line',{x1:110,y1:445,x2:110,y2:45,class:'edge'});const pts=[[150,365],[210,330],[265,350],[330,270],[390,290],[455,225],[515,245],[580,175],[650,180],[735,105]];pts.forEach(([x,y],i)=>{add(s,'circle',{cx:x,cy:y,r:7,fill:i%2?'var(--blue)':'var(--teal)',opacity:.82});const ly=392-.39*x;add(s,'line',{x1:x,y1:y,x2:x,y2:ly,stroke:'var(--wine)','stroke-width':1.5,'stroke-dasharray':'4 4'});});add(s,'line',{x1:120,y1:345,x2:790,y2:84,class:'wine','stroke-width':4});add(s,'text',{x:615,y:93,'font-size':17,fill:'var(--wine)','font-weight':700},'x′β');box(s,560,345,260,65,'Normal equations','E[xe] = 0','soft-wine');add(s,'text',{x:128,y:64,'font-size':13,class:'muted'},'y');add(s,'text',{x:820,y:445,'font-size':13,class:'muted'},'x')}
function drawCoincidence(){const s=svgBase();add(s,'line',{x1:70,y1:420,x2:840,y2:420,class:'edge'});add(s,'line',{x1:100,y1:445,x2:100,y2:45,class:'edge'});const f=x=>280-0.18*(x-450)-curvature*.00125*(x-450)*(x-450);let d='';for(let x=115;x<=820;x+=8)d+=(x===115?'M':'L')+x+','+f(x)+' ';add(s,'path',{d,class:'teal','stroke-width':5});add(s,'line',{x1:115,y1:345,x2:820,y2:218,class:'wine','stroke-width':4});for(let x=145;x<800;x+=55){const y=f(x)+(Math.sin(x)*17);add(s,'circle',{cx:x,cy:y,r:5,fill:'var(--ink)',opacity:.38})}add(s,'text',{x:620,y:f(620)-18,'font-size':15,fill:'var(--teal)','font-weight':700},'CEF m(x)');add(s,'text',{x:655,y:228,'font-size':15,fill:'var(--wine)','font-weight':700},'projection x′β');box(s,125,65,255,70,'Always','E[xe] = 0','soft-blue');box(s,520,65,255,70,curvature<.05?'Also true':'Generally false','E[e | x] = 0',curvature<.05?'soft-teal':'soft-wine')}
function drawAssumptions(){canvas.innerHTML='<div class="matrix">'+[['A1','Functional form','y = Xβ + ε'],['A2','Identification','full rank / Qxx ≻ 0'],['A3','CEF reading','E[ε | X] = 0'],['A4','Efficiency & variance','Var(ε | X) = σ²I'],['A5','Sampling design','fixed X or condition on X'],['A6','Exact inference','ε | X is normal']].map(x=>`<div class="a-card"><b>${x[0]} · ${x[1]}</b><span>${x[2]}</span><small>${x[0]==='A2'?'without it, β is not unique':x[0]==='A3'?'without it, β remains a projection':x[0]==='A6'?'without it, asymptotics still work':'a distinct job in the model'}</small></div>`).join('')+'</div>'}
function drawIdentification(){const s=svgBase();add(s,'text',{x:225,y:45,'text-anchor':'middle','font-size':18,'font-weight':700},'Full rank');add(s,'ellipse',{cx:225,cy:255,rx:135,ry:175,fill:'color-mix(in srgb,var(--teal) 9%,transparent)',stroke:'var(--teal)','stroke-width':2});for(let r=35;r<150;r+=38)add(s,'ellipse',{cx:225,cy:255,rx:r*.72,ry:r,fill:'none',stroke:'var(--teal)','stroke-width':1,opacity:.5});add(s,'circle',{cx:225,cy:255,r:8,fill:'var(--wine)'});add(s,'text',{x:245,y:260,'font-size':14},'unique β');add(s,'line',{x1:450,y1:40,x2:450,y2:460,stroke:'var(--line)','stroke-width':2});add(s,'text',{x:675,y:45,'text-anchor':'middle','font-size':18,'font-weight':700},'Rank failure');add(s,'ellipse',{cx:675,cy:255,rx:40,ry:180,fill:'color-mix(in srgb,var(--red) 9%,transparent)',stroke:'var(--red)','stroke-width':2,transform:'rotate(58 675 255)'});add(s,'line',{x1:540,y1:365,x2:810,y2:145,class:'red','stroke-width':5});for(let t=0;t<5;t++)add(s,'circle',{cx:570+t*57,cy:341-t*46,r:7,fill:'var(--wine)'});add(s,'text',{x:675,y:420,'text-anchor':'middle','font-size':14,class:'muted'},'β + ca gives the same x′β for every c')}
function drawOmitted(){const s=svgBase();box(s,80,170,205,85,'Education','included x','soft-blue');box(s,350,55,205,85,'Age / ability','omitted z','soft-wine');box(s,620,170,205,85,'Income','outcome y','soft-teal');arrow(s,285,205,620,205,'γeduc');arrow(s,555,105,690,170,'γage');const sw=Math.max(1,Math.abs(correlation)*8);add(s,'path',{d:correlation<0?'M350 100 C255 80 225 150 230 170':'M350 100 C305 120 285 145 275 175',fill:'none',stroke:'var(--gold)','stroke-width':sw,'marker-end':'url(#arrow)'});add(s,'text',{x:265,y:92,'text-anchor':'middle','font-size':13,fill:'var(--gold)','font-weight':700},`auxiliary slope δ = ${correlation.toFixed(2)}`);box(s,265,335,370,80,'Short-regression coefficient',`γeduc + γage × ${correlation.toFixed(2)}`,'box');arrow(s,452,140,450,335,'z enters ε when omitted')}
function drawHierarchy(){canvas.innerHTML='<div class="ladder"><div class="rung"><b>1 · Identified projection</b><small>A2: β is a unique functional of F.</small></div><div class="rung"><b>2 · CEF slope</b><small>A3 or a linear CEF: m(x) = x′β.</small></div><div class="rung"><b>3 · Causal effect</b><small>Ignorability, randomization, valid instruments, or another substantive design.</small></div><div class="rung"><b>4 · Efficient / exact inference</b><small>A4–A6 add variance and finite-sample distribution theory.</small></div></div>'}
function buildControl(step){const c=$('control');c.innerHTML='';if(step.control==='curvature'){c.innerHTML=`<label for="curvature">CEF curvature <output>${curvature.toFixed(2)}</output></label><input id="curvature" type="range" min="0" max="2.4" step="0.05" value="${curvature}">`;c.querySelector('input').oninput=e=>{curvature=+e.target.value;c.querySelector('output').textContent=curvature.toFixed(2);drawCoincidence()}}else if(step.control==='correlation'){c.innerHTML=`<label for="correlation">Auxiliary slope δ = Cov(educ, z) / Var(educ) <output>${correlation.toFixed(2)}</output></label><input id="correlation" type="range" min="-1" max="1" step="0.05" value="${correlation}">`;c.querySelector('input').oninput=e=>{correlation=+e.target.value;c.querySelector('output').textContent=correlation.toFixed(2);drawOmitted()}}}
function render(){const s=steps[active];$('stepLabel').textContent=`Diagram ${String(active+1).padStart(2,'0')} of ${steps.length}`;$('title').textContent=s.title;$('lead').textContent=s.lead;$('formula').innerHTML=s.formula;$('takeaway').textContent=s.take;$('bullets').innerHTML=s.bullets.map(b=>`<li>${b}</li>`).join('');$('progressBar').style.width=`${(active+1)/steps.length*100}%`;document.querySelectorAll('.stepdot').forEach((b,i)=>b.toggleAttribute('aria-current',i===active));$('prevBtn').disabled=active===0;$('nextBtn').textContent=active===steps.length-1?'Restart ↺':'Next →';buildControl(s);s.draw();history.replaceState(null,'','#'+s.id)}
function go(i){active=(i+steps.length)%steps.length;render()}
$('stepNav').innerHTML=steps.map((s,i)=>`<button class="stepdot" data-i="${i}" title="${s.title}">${String(i+1).padStart(2,'0')}<br>${s.short}</button>`).join('');$('stepNav').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};$('prevBtn').onclick=()=>go(active-1);$('nextBtn').onclick=()=>go(active===steps.length-1?0:active+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(active===steps.length-1?0:active+1);if(e.key==='ArrowLeft'&&active>0)go(active-1)});
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('econometrics-diagram-theme',t);$('themeBtn').textContent=t==='dark'?'Light mode':'Dark mode'}$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme(localStorage.getItem('econometrics-diagram-theme')||'light');const hash=location.hash.slice(1);const found=steps.findIndex(s=>s.id===hash);active=found>=0?found:0;render();
</script>
