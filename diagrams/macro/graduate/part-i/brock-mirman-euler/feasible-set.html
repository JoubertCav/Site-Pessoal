<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conjunto factível — Brock–Mirman</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

  <style>
    :root{
      --bg:#f3f2ed;
      --panel:#fffefa;
      --soft:#f7f6f1;
      --text:#17212b;
      --muted:#68727e;
      --line:#deded6;
      --blue:#2563eb;
      --teal:#0f9f95;
      --violet:#7c3aed;
      --rose:#d95672;
      --amber:#b66c0a;
      --green:#18794e;
      --shadow:0 12px 32px rgba(25,32,42,.07);
      --radius:18px;
      --sidebar:318px;
    }

    body.dark{
      --bg:#0e151b;
      --panel:#151e27;
      --soft:#1a2630;
      --text:#eef3f6;
      --muted:#a9b5bf;
      --line:#30404c;
      --blue:#79a9ff;
      --teal:#55d5c9;
      --violet:#b49aff;
      --rose:#ff8da4;
      --amber:#f1bb62;
      --green:#69d59d;
      --shadow:0 16px 38px rgba(0,0,0,.27);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.47;
      transition:background .2s,color .2s;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}

    .app{
      max-width:1520px;
      margin:auto;
      padding:18px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:45px;
      height:45px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:14px;
      color:#fff;
      font-weight:900;
      background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    h1{
      margin:0;
      font-size:clamp(1.25rem,2vw,1.95rem);
      line-height:1.08;
    }

    .subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.91rem;
    }

    .header-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:1px solid var(--line);
      border-radius:11px;
      padding:8px 11px;
      background:var(--soft);
      color:var(--text);
      font-weight:740;
    }

    .btn:hover{border-color:var(--blue)}
    .btn.primary{
      border-color:transparent;
      background:var(--blue);
      color:#fff;
    }

    .topic-nav{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:9px;
      margin:14px 0 16px;
    }

    .topic-btn{
      min-height:70px;
      padding:10px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      color:var(--text);
      text-align:left;
      box-shadow:var(--shadow);
      transition:transform .16s,border-color .16s,background .16s;
    }

    .topic-btn:hover{
      transform:translateY(-1px);
      border-color:var(--blue);
    }

    .topic-btn.active{
      color:#fff;
      border-color:transparent;
      background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    .topic-btn strong{
      display:block;
      font-size:.89rem;
    }

    .topic-btn span{
      display:block;
      margin-top:2px;
      font-size:.72rem;
      opacity:.8;
    }

    .layout{
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    aside{
      position:sticky;
      top:18px;
      max-height:calc(100vh - 36px);
      overflow:auto;
      padding:16px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .sidebar-title{
      margin:0 0 3px;
      font-size:1rem;
    }

    .sidebar-subtitle{
      margin:0 0 14px;
      color:var(--muted);
      font-size:.81rem;
    }

    .control{
      padding:0 0 13px;
      margin:0 0 13px;
      border-bottom:1px solid var(--line);
    }

    .control:last-child{
      margin-bottom:0;
      border-bottom:0;
    }

    .control-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:baseline;
      font-size:.87rem;
      font-weight:760;
    }

    .control output{
      color:var(--blue);
      font-variant-numeric:tabular-nums;
    }

    .control small{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:.75rem;
    }

    .control-head [data-tex]{
      display:inline-flex;
      align-items:baseline;
      min-width:.75em;
      vertical-align:baseline;
    }

    .control-head [data-tex] .katex{
      color:var(--blue);
      font-size:1.03em;
    }

    input[type=range]{
      width:100%;
      margin-top:9px;
      accent-color:var(--blue);
    }

    select{
      width:100%;
      margin-top:8px;
      padding:9px 10px;
      color:var(--text);
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:10px;
    }

    .preset-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:8px;
    }

    .preset{
      padding:7px 8px;
      border:1px solid var(--line);
      border-radius:9px;
      color:var(--text);
      background:var(--soft);
      font-size:.75rem;
      font-weight:700;
    }

    .preset:hover{
      color:var(--teal);
      border-color:var(--teal);
    }

    main{
      display:grid;
      gap:16px;
      min-width:0;
    }

    .card{
      min-width:0;
      padding:18px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .eyebrow{
      margin-bottom:4px;
      color:var(--teal);
      font-size:.69rem;
      font-weight:850;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h2{
      margin:0;
      font-size:1.1rem;
    }

    h3{
      margin:0;
      font-size:.96rem;
    }

    p{margin:9px 0}
    .muted{color:var(--muted)}

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1.28fr) minmax(280px,.72fr);
      gap:16px;
    }

    .formula-box,
    .math-line,
    .equation{
      position:relative;
      isolation:isolate;
      overflow:auto;
      border:1px solid color-mix(in srgb,var(--line) 72%,var(--blue));
      background:
        radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--blue) 8%,transparent),transparent 42%),
        linear-gradient(145deg,var(--soft),color-mix(in srgb,var(--panel) 82%,var(--soft)));
      box-shadow:
        inset 0 1px 0 color-mix(in srgb,#fff 55%,transparent),
        0 8px 24px rgba(24,33,43,.035);
    }

    .formula-box::before,
    .math-line::before{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:0;
      height:2px;
      border-radius:0 0 999px 999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--teal),transparent);
      opacity:.65;
    }

    .formula-box{
      display:grid;
      place-items:center;
      min-height:132px;
      margin-top:13px;
      padding:22px 20px;
      border-radius:14px;
      font-size:clamp(.96rem,1.65vw,1.3rem);
    }

    .math-line{
      margin:10px 0;
      padding:16px 18px;
      border-radius:11px;
      color:var(--text);
    }

    .equation{
      min-height:72px;
      display:grid;
      place-items:center;
      padding:14px;
      border-radius:12px;
      text-align:center;
    }

    .formula-box .katex-display,
    .math-line .katex-display,
    .equation .katex-display{
      width:100%;
      margin:0;
      overflow-x:auto;
      overflow-y:hidden;
      padding:2px 0;
    }

    .formula-box .katex{font-size:1.12em}
    .math-line .katex{font-size:1.02em}
    .equation .katex{font-size:1em}

    [data-display="false"] .katex{
      color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1em;
    }

    .math-render-error{
      color:var(--rose);
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:.9rem;
      white-space:pre-wrap;
    }

    .insight{
      padding:13px;
      border-left:4px solid var(--teal);
      border-radius:11px;
      background:var(--soft);
      font-size:.86rem;
    }

    .insight + .insight{margin-top:9px}
    .insight.warn{border-left-color:var(--amber)}
    .insight.bad{border-left-color:var(--rose)}

    .metrics{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .metric{
      padding:13px;
      border:1px solid var(--line);
      border-radius:13px;
      background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 72%,var(--panel)));
      box-shadow:var(--shadow);
    }

    .metric-label{
      color:var(--muted);
      font-size:.71rem;
      font-weight:760;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .metric-value{
      margin-top:4px;
      color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1.16rem;
      font-weight:850;
      font-variant-numeric:tabular-nums;
      overflow-wrap:anywhere;
    }

    .chart-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .chart-card{
      overflow:hidden;
      padding-bottom:12px;
    }

    .chart{
      width:100%;
      height:360px;
      overflow:hidden;
      border:1px solid color-mix(in srgb,var(--line) 82%,var(--blue));
      border-radius:15px;
      background:
        radial-gradient(circle at 12% 4%,color-mix(in srgb,var(--blue) 7%,transparent),transparent 36%),
        linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,var(--soft)),var(--panel));
    }

    .chart.tall{height:420px}

    .chart-note{
      display:flex;
      align-items:flex-start;
      gap:7px;
      margin:8px 0 0;
      padding:0 2px;
      color:var(--muted);
      font-size:.76rem;
      line-height:1.42;
    }

    .chart-note::before{
      content:"";
      width:7px;
      height:7px;
      flex:0 0 auto;
      margin-top:.37em;
      border-radius:50%;
      background:var(--teal);
    }

    .topic-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:13px;
    }

    .topic-box{
      padding:13px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--soft);
    }

    .topic-box strong{
      display:block;
      color:var(--blue);
      font-size:.82rem;
    }

    .topic-box p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:.8rem;
    }

    .equation-strip{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
      margin-top:13px;
    }

    details{
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--soft);
    }

    details + details{margin-top:9px}

    details[open]{
      border-color:color-mix(in srgb,var(--line) 65%,var(--blue));
      box-shadow:0 8px 20px rgba(25,32,42,.035);
    }

    summary{
      padding:12px 14px;
      cursor:pointer;
      font-weight:780;
    }

    summary::marker{color:var(--blue)}

    .details-body{
      padding:0 14px 14px;
      color:var(--muted);
      font-size:.87rem;
    }

    .compare-table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      font-size:.82rem;
    }

    .compare-table th,
    .compare-table td{
      padding:9px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
    }

    .compare-table th{
      color:var(--muted);
      font-size:.71rem;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .status{
      display:flex;
      align-items:center;
      gap:9px;
      margin-top:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--soft);
      font-size:.82rem;
      font-weight:730;
    }

    .status-dot{
      width:10px;
      height:10px;
      flex:0 0 auto;
      border-radius:50%;
      background:var(--green);
    }

    .status.bad .status-dot{background:var(--rose)}

    .hidden{display:none!important}

    footer{
      padding:8px 4px 2px;
      color:var(--muted);
      text-align:center;
      font-size:.8rem;
    }

    @media(max-width:1180px){
      .topic-nav{grid-template-columns:repeat(3,1fr)}
      .layout{grid-template-columns:280px minmax(0,1fr)}
      .hero,.chart-grid{grid-template-columns:1fr}
      .topic-grid,.equation-strip{grid-template-columns:1fr}
      .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(max-width:800px){
      .app{padding:10px}
      header{
        align-items:flex-start;
        flex-direction:column;
      }
      .topic-nav{grid-template-columns:1fr 1fr}
      .layout{grid-template-columns:1fr}
      aside{
        position:static;
        max-height:none;
      }
    }

    @media(max-width:500px){
      .topic-nav,.metrics{grid-template-columns:1fr}
      .preset-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">Γ</div>
      <div>
        <h1>Conjunto factível</h1>
        <p class="subtitle">Como recursos, consumo e capital futuro delimitam as escolhas do planejador</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="themeBtn">◐ Tema</button>
      <button class="btn" id="resetBtn">Reiniciar tópico</button>
    </div>
  </header>

  <nav class="topic-nav" aria-label="Escolha do laboratório">
    <button class="topic-btn active" data-mode="geometry">
      <strong>Geometria de um período</strong>
      <span>Triângulo factível, interceptos e ponto escolhido</span>
    </button>

    <button class="topic-btn" data-mode="resources">
      <strong>Deslocamento dos recursos</strong>
      <span>Efeito de k, A, α e δ sobre o conjunto</span>
    </button>

    <button class="topic-btn" data-mode="slack">
      <strong>Folga e fronteira</strong>
      <span>Por que a definição usa ≤ e a solução pode usar =</span>
    </button>

    <button class="topic-btn" data-mode="correspondence">
      <strong>Correspondência factível</strong>
      <span>De cada estado k para o intervalo possível de k′</span>
    </button>

    <button class="topic-btn" data-mode="plans">
      <strong>Planos viáveis</strong>
      <span>Sequências em Π(k₀), envelope e cota uniforme</span>
    </button>
  </nav>

  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $=(selector,root=document)=>root.querySelector(selector);
  const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];

  const defaults={
    geometry:{A:1,alpha:.36,delta:1,k:2,cShare:.55,wasteShare:0},
    resources:{A:1,alpha:.36,delta:1,k:2,kMax:8},
    slack:{A:1,alpha:.36,delta:1,k:2,cShare:.4,kShare:.35,monotone:true},
    correspondence:{A:1,alpha:.36,delta:1,k:2,kMax:8},
    plans:{A:1,alpha:.36,k0:.45,T:24,paths:10,minShare:.08,maxShare:.9,seed:7}
  };

  const state={
    mode:"geometry",
    geometry:{...defaults.geometry},
    resources:{...defaults.resources},
    slack:{...defaults.slack},
    correspondence:{...defaults.correspondence},
    plans:{...defaults.plans}
  };

  const KATEX_OPTIONS={
    throwOnError:false,
    strict:"ignore",
    trust:false
  };

  const MATH=Object.freeze({
    A:String.raw`A`,
    alpha:String.raw`\alpha`,
    delta:String.raw`\delta`,
    k:String.raw`k_t`,
    c:String.raw`c_t`,
    kp:String.raw`k_{t+1}`,
    k0:String.raw`k_0`,
    T:String.raw`T`,
    lambda:String.raw`\lambda`
  });

  const plotConfig={
    responsive:true,
    displaylogo:false,
    scrollZoom:true,
    toImageButtonOptions:{format:"png",filename:"conjunto_factível",scale:2},
    modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d","toggleSpikelines"]
  };

  function fmt(value,digits=3){
    if(!Number.isFinite(value)) return "—";
    if(Math.abs(value)>=1e5 || (Math.abs(value)>0 && Math.abs(value)<1e-4)){
      return value.toExponential(2).replace(".",",");
    }
    return value.toLocaleString("pt-BR",{
      maximumFractionDigits:digits,
      minimumFractionDigits:0
    });
  }

  function linspace(a,b,n){
    return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  }

  function renderKatex(element,expression,display=true){
    if(!element) return;

    const source=String(expression??"");

    if(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(source)){
      console.error("Expressão KaTeX contém caractere de controle:",source);
      element.textContent=source;
      element.classList.add("math-render-error");
      return;
    }

    const prepared=display?String.raw`\displaystyle ${source}`:source;

    if(!window.katex){
      element.textContent=source;
      return;
    }

    try{
      katex.render(prepared,element,{
        ...KATEX_OPTIONS,
        displayMode:display,
        errorColor:"#d95672"
      });
      element.classList.remove("math-render-error");
    }catch(error){
      console.error("Erro KaTeX:",source,error);
      element.textContent=source;
      element.classList.add("math-render-error");
    }
  }

  function tex(element,expression,display=true){
    renderKatex(element,expression,display);
  }

  function renderAllMath(root=document){
    if(!window.katex) return;

    $$("[data-tex]",root).forEach(element=>{
      renderKatex(
        element,
        element.dataset.tex,
        element.dataset.display!=="false"
      );
    });
  }

  function chartTheme(){
    const dark=document.body.classList.contains("dark");

    return {
      dark,
      text:dark?"#a9b5bf":"#68727e",
      strong:dark?"#eef3f6":"#17212b",
      grid:dark?"rgba(74,94,108,.32)":"rgba(190,193,188,.42)",
      axis:dark?"#40515f":"#c8c9c2",
      panel:dark?"#151e27":"#fffefa",
      blue:dark?"#79a9ff":"#2563eb",
      teal:dark?"#55d5c9":"#0f9f95",
      violet:dark?"#b49aff":"#7c3aed",
      rose:dark?"#ff8da4":"#d95672",
      amber:dark?"#f1bb62":"#b66c0a",
      green:dark?"#69d59d":"#18794e"
    };
  }

  function rgba(hex,alpha){
    const value=hex.replace("#","");
    const full=value.length===3
      ?value.split("").map(character=>character+character).join("")
      :value;
    const number=parseInt(full,16);

    return `rgba(${(number>>16)&255},${(number>>8)&255},${number&255},${alpha})`;
  }

  function plotLayout(xTitle,yTitle,extra={}){
    const theme=chartTheme();

    const axis={
      showline:true,
      linewidth:1,
      linecolor:theme.axis,
      ticks:"outside",
      ticklen:5,
      tickcolor:theme.axis,
      tickfont:{size:11,color:theme.text},
      gridcolor:theme.grid,
      griddash:"dot",
      zeroline:true,
      zerolinecolor:theme.axis,
      automargin:true,
      title:{font:{size:12,color:theme.text},standoff:12}
    };

    return {
      margin:{l:68,r:30,t:28,b:68},
      paper_bgcolor:"rgba(0,0,0,0)",
      plot_bgcolor:"rgba(0,0,0,0)",
      font:{family:"Inter, system-ui, sans-serif",color:theme.text,size:12},
      colorway:[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green],
      xaxis:{...axis,title:{text:xTitle,font:{size:12,color:theme.text},standoff:12}},
      yaxis:{...axis,title:{text:yTitle,font:{size:12,color:theme.text},standoff:12}},
      hovermode:"x unified",
      hoverlabel:{
        bgcolor:theme.panel,
        bordercolor:theme.axis,
        font:{family:"Inter, system-ui, sans-serif",size:12,color:theme.strong}
      },
      legend:{
        orientation:"h",
        y:-.25,
        x:0,
        xanchor:"left",
        font:{size:11,color:theme.text},
        bgcolor:"rgba(0,0,0,0)"
      },
      transition:{duration:280,easing:"cubic-in-out"},
      dragmode:"pan",
      ...extra
    };
  }

  function polishTraces(traces){
    const theme=chartTheme();
    const colors=[
      theme.blue,
      theme.violet,
      theme.teal,
      theme.rose,
      theme.amber,
      theme.green
    ];

    return traces.map((trace,index)=>{
      const color=trace.line?.color||trace.marker?.color||colors[index%colors.length];
      const polished={...trace};
      const isScatter=(trace.type||"scatter")==="scatter";
      const mode=trace.mode||"lines";

      if(isScatter&&mode.includes("lines")){
        polished.line={
          width:index===0?3.3:2.4,
          shape:"spline",
          smoothing:.5,
          ...trace.line,
          color
        };
      }

      if(isScatter&&mode.includes("markers")){
        polished.marker={
          size:trace.marker?.size||5,
          color,
          line:{width:1.3,color:theme.panel},
          ...trace.marker
        };
      }

      if(trace.fill){
        polished.fillcolor=trace.fillcolor||rgba(color,.10);
      }

      polished.hovertemplate=trace.hovertemplate||
        `<b>${trace.name||"Série"}</b><br>x: %{x:.4g}<br>y: %{y:.4g}<extra></extra>`;

      return polished;
    });
  }

  function prettyPlot(id,traces,layout){
    return Plotly.react(id,polishTraces(traces),layout,plotConfig);
  }

  function slider(id,label,value,min,max,step,help,symbol=""){
    return String.raw`

        <div class="control-head">

          step="${step}"
          value="${value}"

  function metric(label,id){
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value" id="${id}">—</div></div>`;
  }

  function bindRange(id,object,key,callback){
    const input=$("#"+id);
    if(!input) return;

    const run=()=>{
      object[key]=Number(input.value);
      const output=$("#"+id+"Out");

      if(output){
        const integerKeys=["T","paths","seed"];
        output.textContent=fmt(object[key],integerKeys.includes(key)?0:3);
      }

      callback();
    };

    input.addEventListener("input",run);
    input.addEventListener("change",run);
  }

  function production(k,A,alpha){
    return A*Math.pow(Math.max(0,k),alpha);
  }

  function totalResources(k,A,alpha,delta){
    return production(k,A,alpha)+(1-delta)*k;
  }

  function sustainableCapital(A,alpha){
    return Math.pow(A,1/(1-alpha));
  }

  function geometryChoice(s){
    const resources=totalResources(s.k,s.A,s.alpha,s.delta);
    const waste=Math.min(resources,s.wasteShare*resources);
    const usable=resources-waste;
    const consumption=s.cShare*usable;
    const nextK=(1-s.cShare)*usable;
    const slack=resources-consumption-nextK;

    return {resources,waste,usable,consumption,nextK,slack};
  }

  function updateSlack(){
    const s=state.slack;
    const resources=totalResources(s.k,s.A,s.alpha,s.delta);
    const consumption=s.cShare*resources;
    const nextK=s.kShare*resources;
    const use=consumption+nextK;
    const slack=resources-use;
    const distance=Math.abs(slack)/Math.sqrt(2);

    $("#slackResources").textContent=fmt(resources,4);
    $("#slackUse").textContent=fmt(use,4);
    $("#slackValue").textContent=fmt(slack,4);
    $("#slackDistance").textContent=fmt(distance,4);

    const feasible=slack>=-1e-10;
    const boundary=Math.abs(slack)<=1e-6;

    $("#slackStatus").classList.toggle("bad",!feasible);

    $("#slackStatusText").textContent=!feasible
      ?"O ponto está fora do conjunto factível."
      :boundary
        ?"O ponto está sobre a fronteira de recursos."
        :"O ponto está no interior do conjunto e possui folga.";

    tex(
      $("#slackPreferenceFormula"),
      s.monotone
        ?String.raw`u'(c)>0\quad\Longrightarrow\quad \xi_t=0\ \text{em um ótimo}`
        :String.raw`u(c)=-(c-\bar c)^2\quad\Longrightarrow\quad \xi_t>0\ \text{pode ocorrer}`
    );

    const theme=chartTheme();
    const R=resources;
    const boundaryConsumption=Math.max(0,R-nextK);

    const traces=[
      {
        x:[0,R,0,0],
        y:[0,0,R,0],
        type:"scatter",
        mode:"lines",
        name:"Conjunto factível",
        fill:"toself",
        fillcolor:rgba(theme.blue,.12),
        line:{color:theme.blue}
      },
      {
        x:[0,R],
        y:[R,0],
        type:"scatter",
        mode:"lines",
        name:"Fronteira",
        line:{color:theme.teal,width:3}
      },
      {
        x:[nextK],
        y:[consumption],
        type:"scatter",
        mode:"markers",
        name:"Ponto escolhido",
        marker:{size:13,color:feasible?theme.rose:theme.amber}
      }
    ];

    if(feasible&&!boundary){
      traces.push({
        x:[nextK,nextK],
        y:[consumption,boundaryConsumption],
        type:"scatter",
        mode:"lines+markers",
        name:"Preencher a folga",
        line:{color:theme.rose,dash:"dot"},
        marker:{size:7,color:theme.rose}
      });
    }

    prettyPlot("slackSetChart",traces,plotLayout("Capital futuro, kₜ₊₁","Consumo, cₜ",{
      hovermode:"closest",
      xaxis:{...plotLayout("","").xaxis,range:[0,Math.max(R,nextK)*1.1]},
      yaxis:{...plotLayout("","").yaxis,range:[0,Math.max(R,consumption)*1.1]}
    }));

    const cMin=Math.max(.02,Math.min(consumption,boundaryConsumption)*.7);
    const cMax=Math.max(cMin+.1,Math.max(consumption,boundaryConsumption)*1.15);
    const cGrid=linspace(cMin,cMax,220);

    let utility;
    let saturation=null;

    if(s.monotone){
      utility=cGrid.map(c=>Math.log(c));
    }else{
      saturation=.65*resources;
      utility=cGrid.map(c=>-Math.pow(c-saturation,2));
    }

    prettyPlot("slackUtilityChart",[
      {
        x:cGrid,
        y:utility,
        type:"scatter",
        mode:"lines",
        name:s.monotone?"ln c":"Utilidade com saciedade",
        fill:"tozeroy",
        fillcolor:rgba(theme.violet,.07),
        line:{color:theme.violet}
      },
      {
        x:[consumption],
        y:[s.monotone?Math.log(Math.max(consumption,1e-8)):-Math.pow(consumption-saturation,2)],
        type:"scatter",
        mode:"markers",
        name:"Consumo atual",
        marker:{size:11,color:theme.rose}
      },
      ...(feasible&&!boundary?[{
        x:[boundaryConsumption],
        y:[s.monotone?Math.log(Math.max(boundaryConsumption,1e-8)):-Math.pow(boundaryConsumption-saturation,2)],
        type:"scatter",
        mode:"markers",
        name:"Consumo na fronteira",
        marker:{size:11,color:theme.teal}
      }]:[])
    ],plotLayout("Consumo, c","Utilidade corrente",{
      hovermode:"closest"
    }));
  }

  function updateCorrespondence(){
    const s=state.correspondence;
    const upper=totalResources(s.k,s.A,s.alpha,s.delta);
    const kHat=s.delta===1?sustainableCapital(s.A,s.alpha):NaN;

    tex(
      $("#corrFormula"),
      s.delta===1
        ?String.raw`\Gamma(k)=\left[0,Ak^\alpha\right]`
        :String.raw`\Gamma(k)=\left[0,Ak^\alpha+(1-\delta)k\right]`
    );

    $("#corrLower").textContent="0";
    $("#corrUpper").textContent=fmt(upper,4);
    $("#corrLength").textContent=fmt(upper,4);
    $("#corrKHat").textContent=Number.isFinite(kHat)?fmt(kHat,4):"—";

    const theme=chartTheme();
    const kGrid=linspace(0,s.kMax,300);
    const upperGrid=kGrid.map(k=>totalResources(k,s.A,s.alpha,s.delta));
    const zeros=kGrid.map(()=>0);

    prettyPlot("corrGraphChart",[
      {
        x:kGrid,
        y:upperGrid,
        type:"scatter",
        mode:"lines",
        name:"Limite superior R(k)",
        fill:"tozeroy",
        fillcolor:rgba(theme.blue,.13),
        line:{color:theme.blue}
      },
      {
        x:kGrid,
        y:zeros,
        type:"scatter",
        mode:"lines",
        name:"Limite inferior",
        line:{color:theme.teal,dash:"dot"}
      },
      {
        x:[s.k,s.k],
        y:[0,upper],
        type:"scatter",
        mode:"lines+markers",
        name:"Γ(k atual)",
        line:{color:theme.rose,width:4},
        marker:{size:8,color:theme.rose}
      }
    ],plotLayout("Estado atual, k","Capital futuro, k′",{
      hovermode:"closest"
    }));

    prettyPlot("corrSliceChart",[
      {
        x:[0,upper],
        y:[1,1],
        type:"scatter",
        mode:"lines+markers",
        name:"Γ(k)",
        line:{color:theme.blue,width:12},
        marker:{size:12,color:theme.blue},

      xaxis:{...plotLayout("","").xaxis,range:[0,upper*1.08]},

        {x:0,y:1,text:"0",showarrow:false,yshift:22,font:{color:theme.teal,size:12}},

      ]
    }));

    const kpGrid=linspace(0,upper,240);

    prettyPlot("corrConsumptionChart",[
      {
        x:kpGrid,
        y:cGrid,
        type:"scatter",
        mode:"lines",
        name:"c = R(k) − k′",
        fill:"tozeroy",
        fillcolor:rgba(theme.teal,.08),
        line:{color:theme.teal}
      }
    ],plotLayout("Capital futuro, k′","Consumo implícito, c"));

            <div class="topic-box"><strong>Limitada</strong><p>Consumo e capital futuro não superam F(k).</p></div>
          </div>
          <div class="insight bad" style="margin-top:12px"><strong>Nuance:</strong> compacidade em cada estágio não implica automaticamente compacidade do espaço infinito de sequências sem especificar uma topologia adequada.</div>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Cota uniforme</div>
        <h2>Por que toda trajetória permanece limitada</h2>
        <div class="formula-box" data-tex="\widehat{k}=A^{1/(1-\alpha)},\qquad k_t\leq\bar{k}:=\max\{k_0,\widehat{k}\}"></div>
        <details open>
          <summary>Quando k₀ ≤ k̂</summary>
          <div class="details-body">Se kₜ ≤ k̂, então kₜ₊₁ ≤ F(kₜ) ≤ F(k̂) = k̂.</div>
        </details>
        <details>
          <summary>Quando k₀ &gt; k̂</summary>
          <div class="details-body">Para k &gt; k̂, vale F(k) &lt; k; mesmo o investimento total não consegue elevar o estado acima de k₀.</div>
        </details>
      </section>

      <footer>Os planos são amostras viáveis; nenhum deles é identificado como ótimo.</footer>`;

    renderAllMath();

    bindRange("plansA",s,"A",updatePlans);
    bindRange("plansAlpha",s,"alpha",updatePlans);
    bindRange("plansK0",s,"k0",updatePlans);
    bindRange("plansT",s,"T",updatePlans);
    bindRange("plansCount",s,"paths",updatePlans);
    bindRange("plansMin",s,"minShare",()=>{
      s.minShare=Math.min(s.minShare,s.maxShare-.01);
      updatePlans();
    });
    bindRange("plansMax",s,"maxShare",()=>{
      s.maxShare=Math.max(s.maxShare,s.minShare+.01);
      updatePlans();
    });
    bindRange("plansSeed",s,"seed",updatePlans);

    $$("[data-plans-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.plansPreset;
        const kHat=sustainableCapital(s.A,s.alpha);

        if(preset==="below"){
          Object.assign(s,{k0:.25*kHat,minShare:.08,maxShare:.9,seed:7});
        }

        if(preset==="above"){
          Object.assign(s,{k0:2.2*kHat,minShare:.08,maxShare:.9,seed:7});
        }

        if(preset==="wide"){
          Object.assign(s,{minShare:.01,maxShare:.98,seed:17});
        }

        if(preset==="narrow"){
          Object.assign(s,{minShare:.42,maxShare:.58,seed:23});
        }

        renderPlans();
      });
    });

    updatePlans();
  }

  function seededRandom(seed){
    let value=Math.round(seed)%2147483647;
    if(value<=0) value+=2147483646;

    return ()=>{
      value=value*16807%2147483647;
      return (value-1)/2147483646;
    };
  }

  function generatePlans(){
    const s=state.plans;
    const random=seededRandom(s.seed);
    const plans=[];

    for(let index=0;index<Math.round(s.paths);index++){
      const capital=[s.k0];
      const consumption=[];
      const shares=[];

      for(let t=0;t<s.T;t++){
        const raw=s.minShare+(s.maxShare-s.minShare)*random();
        const share=t===0?raw:.62*shares.at(-1)+.38*raw;
        const resources=production(capital[t],s.A,s.alpha);
        const nextK=share*resources;
        const c=(1-share)*resources;

        shares.push(share);
        consumption.push(c);
        capital.push(nextK);
      }

      const finalResources=production(capital.at(-1),s.A,s.alpha);
      consumption.push((1-.5*(s.minShare+s.maxShare))*finalResources);

      plans.push({capital,consumption,shares});
    }

    return plans;
  }

  function updatePlans(){
    const s=state.plans;
    const plans=generatePlans();
    const periods=Array.from({length:s.T+1},(_,i)=>i);
    const kHat=sustainableCapital(s.A,s.alpha);
    const bound=Math.max(s.k0,kHat);

    let maximumCapital=0;
    let maximumViolation=0;

    plans.forEach(plan=>{
      maximumCapital=Math.max(maximumCapital,...plan.capital);

      for(let t=0;t<s.T;t++){
        const resources=production(plan.capital[t],s.A,s.alpha);
        const violation=plan.capital[t+1]+plan.consumption[t]-resources;
        maximumViolation=Math.max(maximumViolation,violation);
      }
    });

    $("#plansKHat").textContent=fmt(kHat,4);
    $("#plansBound").textContent=fmt(bound,4);
    $("#plansMaxK").textContent=fmt(maximumCapital,4);
    $("#plansViolation").textContent=fmt(maximumViolation,8);

    const theme=chartTheme();

    const capitalTraces=plans.map((plan,index)=>({
      x:periods,
      y:plan.capital,
      type:"scatter",
      mode:"lines",
      name:`Plano ${index+1}`,
      showlegend:index===0,
      line:{
        width:index===0?3:1.6,
        color:index===0?theme.blue:rgba(theme.blue,.24)
      },
      hovertemplate:`<b>Plano ${index+1}</b><br>t = %{x}<br>kₜ = %{y:.4g}<extra></extra>`
    }));

    capitalTraces.push({
      x:[0,s.T],
      y:[bound,bound],
      type:"scatter",
      mode:"lines",
      name:"Cota uniforme",
      line:{color:theme.rose,dash:"dash",width:2.3}
    });

    prettyPlot("plansCapitalChart",capitalTraces,plotLayout("Data, t","Capital, kₜ",{
      annotations:[{
        x:s.T,
        y:bound,
        text:"k̄",
        showarrow:false,
        xanchor:"right",
        yshift:10,
        font:{color:theme.rose,size:12}
      }]
    }));

    const consumptionTraces=plans.map((plan,index)=>({
      x:periods,
      y:plan.consumption,
      type:"scatter",
      mode:"lines",
      name:`Plano ${index+1}`,
      showlegend:index===0,
      line:{
        width:index===0?3:1.6,
        color:index===0?theme.violet:rgba(theme.violet,.22)
      },
      hovertemplate:`<b>Plano ${index+1}</b><br>t = %{x}<br>cₜ = %{y:.4g}<extra></extra>`
    }));

    prettyPlot("plansConsumptionChart",consumptionTraces,plotLayout("Data, t","Consumo, cₜ"));

    const envelope=[s.k0];

    for(let t=0;t<s.T;t++){
      envelope.push(production(envelope[t],s.A,s.alpha));
    }

    const largestPlan=plans.reduce((best,plan)=>{
      return Math.max(...plan.capital)>Math.max(...best.capital)?plan:best;
    },plans[0]);

    prettyPlot("plansEnvelopeChart",[
      {
        x:periods,
        y:envelope,
        type:"scatter",
        mode:"lines+markers",
        name:"Investimento total",
        fill:"tozeroy",
        fillcolor:rgba(theme.teal,.07),
        marker:{size:4,color:theme.teal},
        line:{color:theme.teal}
      },
      {
        x:periods,
        y:largestPlan.capital,
        type:"scatter",
        mode:"lines+markers",
        name:"Maior plano amostrado",
        marker:{size:4,color:theme.blue},
        line:{color:theme.blue}
      },
      {
        x:[0,s.T],
        y:[kHat,kHat],
        type:"scatter",
        mode:"lines",
        name:"k̂",
        line:{color:theme.violet,dash:"dot"}
      }
    ],plotLayout("Data, t","Capital"));
  }

  function resetCurrent(){
    state[state.mode]={...defaults[state.mode]};
    renderMode();
  }

  $$(".topic-btn").forEach(button=>{
    button.addEventListener("click",()=>setMode(button.dataset.mode));
  });

  $("#themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    renderMode();
  });

  $("#resetBtn").addEventListener("click",resetCurrent);

  window.addEventListener("resize",()=>{
    $$(".chart").forEach(element=>{
      if(window.Plotly) Plotly.Plots.resize(element);
    });
  });

  document.addEventListener("DOMContentLoaded",renderMode);
  window.addEventListener("load",renderMode);
})();
</script>
</body>
</html>
