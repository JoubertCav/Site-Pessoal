<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caso geral e depreciação parcial — Equação de Euler</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

  <style>
    :root{
      --bg:#f3f2ed;--panel:#fffefa;--soft:#f7f6f1;--text:#17212b;--muted:#68727e;
      --line:#deded6;--blue:#2563eb;--teal:#0f9f95;--violet:#7c3aed;--rose:#d95672;
      --amber:#b66c0a;--green:#18794e;--shadow:0 12px 32px rgba(25,32,42,.07);
      --radius:18px;--sidebar:320px;
    }

    body.dark{
      --bg:#0e151b;--panel:#151e27;--soft:#1a2630;--text:#eef3f6;--muted:#a9b5bf;
      --line:#30404c;--blue:#79a9ff;--teal:#55d5c9;--violet:#b49aff;--rose:#ff8da4;
      --amber:#f1bb62;--green:#69d59d;--shadow:0 16px 38px rgba(0,0,0,.27);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.47;transition:background .2s,color .2s;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:1520px;margin:auto;padding:18px}

    header{
      display:flex;justify-content:space-between;align-items:center;gap:16px;
      padding:16px 18px;border:1px solid var(--line);border-radius:20px;
      background:var(--panel);box-shadow:var(--shadow);
    }

    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{
      width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto;border-radius:14px;
      color:#fff;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    h1{margin:0;font-size:clamp(1.25rem,2vw,1.95rem);line-height:1.08}
    .subtitle{margin:4px 0 0;color:var(--muted);font-size:.91rem}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}

    .btn{
      border:1px solid var(--line);border-radius:11px;padding:8px 11px;
      background:var(--soft);color:var(--text);font-weight:740;
    }
    .btn:hover{border-color:var(--blue)}
    .btn.primary{border-color:transparent;background:var(--blue);color:#fff}

    .topic-nav{
      display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0 16px;
    }

    .topic-btn{
      min-height:72px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;
      background:var(--panel);color:var(--text);text-align:left;box-shadow:var(--shadow);
      transition:transform .16s,border-color .16s,background .16s;
    }

    .topic-btn:hover{transform:translateY(-1px);border-color:var(--blue)}
    .topic-btn.active{
      color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--teal));
    }
    .topic-btn strong{display:block;font-size:.88rem}
    .topic-btn span{display:block;margin-top:2px;font-size:.71rem;opacity:.8}

    .layout{
      display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);gap:16px;align-items:start;
    }

    aside{
      position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;
      padding:16px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);box-shadow:var(--shadow);
    }

    .sidebar-title{margin:0 0 3px;font-size:1rem}
    .sidebar-subtitle{margin:0 0 14px;color:var(--muted);font-size:.81rem}

    .control{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--line)}
    .control:last-child{margin-bottom:0;border-bottom:0}

    .control-head{
      display:flex;justify-content:space-between;gap:10px;align-items:baseline;
      font-size:.87rem;font-weight:760;
    }
    .control output{color:var(--blue);font-variant-numeric:tabular-nums}
    .control small{display:block;margin-top:4px;color:var(--muted);font-size:.75rem}
    .control-head [data-tex]{display:inline-flex;align-items:baseline;min-width:.75em;vertical-align:baseline}
    .control-head [data-tex] .katex{color:var(--blue);font-size:1.03em}
    input[type=range]{width:100%;margin-top:9px;accent-color:var(--blue)}

    select{
      width:100%;margin-top:8px;padding:9px 10px;color:var(--text);
      background:var(--soft);border:1px solid var(--line);border-radius:10px;
    }

    .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
    .preset{
      padding:7px 8px;border:1px solid var(--line);border-radius:9px;
      color:var(--text);background:var(--soft);font-size:.75rem;font-weight:700;
    }
    .preset:hover{color:var(--teal);border-color:var(--teal)}

    main{display:grid;gap:16px;min-width:0}

    .card{
      min-width:0;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);box-shadow:var(--shadow);
    }

    .eyebrow{
      margin-bottom:4px;color:var(--teal);font-size:.69rem;font-weight:850;
      letter-spacing:.12em;text-transform:uppercase;
    }

    h2{margin:0;font-size:1.1rem}
    h3{margin:0;font-size:.96rem}
    p{margin:9px 0}
    .muted{color:var(--muted)}

    .hero{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(280px,.72fr);gap:16px}

    .formula-box,.math-line,.equation{
      position:relative;isolation:isolate;overflow:auto;
      border:1px solid color-mix(in srgb,var(--line) 72%,var(--blue));
      background:
        radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--blue) 8%,transparent),transparent 42%),
        linear-gradient(145deg,var(--soft),color-mix(in srgb,var(--panel) 82%,var(--soft)));
      box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 55%,transparent),0 8px 24px rgba(24,33,43,.035);
    }

    .formula-box::before,.math-line::before{
      content:"";position:absolute;left:18px;right:18px;top:0;height:2px;
      border-radius:0 0 999px 999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--teal),transparent);opacity:.65;
    }

    .formula-box{
      display:grid;place-items:center;min-height:138px;margin-top:13px;padding:22px 20px;
      border-radius:14px;font-size:clamp(.94rem,1.62vw,1.28rem);
    }

    .math-line{margin:10px 0;padding:16px 18px;border-radius:11px;color:var(--text)}
    .equation{
      min-height:72px;display:grid;place-items:center;padding:14px;border-radius:12px;text-align:center;
    }

    .formula-box .katex-display,.math-line .katex-display,.equation .katex-display{
      width:100%;margin:0;overflow-x:auto;overflow-y:hidden;padding:2px 0;
    }
    .formula-box .katex{font-size:1.09em}
    .math-line .katex{font-size:1.02em}
    .equation .katex{font-size:1em}
    [data-display="false"] .katex{
      color:color-mix(in srgb,var(--text) 88%,var(--blue));font-size:1em;
    }

    .math-render-error{
      color:var(--rose);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:.9rem;white-space:pre-wrap;
    }

    .insight{
      padding:13px;border-left:4px solid var(--teal);border-radius:11px;
      background:var(--soft);font-size:.86rem;
    }
    .insight + .insight{margin-top:9px}
    .insight.warn{border-left-color:var(--amber)}
    .insight.bad{border-left-color:var(--rose)}

    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .metric{
      padding:13px;border:1px solid var(--line);border-radius:13px;
      background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 72%,var(--panel)));
      box-shadow:var(--shadow);
    }
    .metric-label{
      color:var(--muted);font-size:.71rem;font-weight:760;letter-spacing:.04em;text-transform:uppercase;
    }
    .metric-value{
      margin-top:4px;color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1.16rem;font-weight:850;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
    }

    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .chart-card{overflow:hidden;padding-bottom:12px}
    .chart{
      width:100%;height:360px;overflow:hidden;
      border:1px solid color-mix(in srgb,var(--line) 82%,var(--blue));border-radius:15px;
      background:
        radial-gradient(circle at 12% 4%,color-mix(in srgb,var(--blue) 7%,transparent),transparent 36%),
        linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,var(--soft)),var(--panel));
    }
    .chart.tall{height:420px}

    .chart-note{
      display:flex;align-items:flex-start;gap:7px;margin:8px 0 0;padding:0 2px;
      color:var(--muted);font-size:.76rem;line-height:1.42;
    }
    .chart-note::before{
      content:"";width:7px;height:7px;flex:0 0 auto;margin-top:.37em;
      border-radius:50%;background:var(--teal);
    }

    .topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}
    .topic-box{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--soft)}
    .topic-box strong{display:block;color:var(--blue);font-size:.82rem}
    .topic-box p{margin:6px 0 0;color:var(--muted);font-size:.8rem}

    .equation-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}

    .derivation{
      display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-top:14px;
      overflow:auto;padding-bottom:6px;
    }

    .step-card{
      min-height:170px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--soft);
    }
    .step-number{
      width:28px;height:28px;display:grid;place-items:center;border-radius:9px;
      background:var(--blue);color:#fff;font-size:.75rem;font-weight:900;
    }
    .step-card strong{display:block;margin-top:10px;color:var(--blue);font-size:.8rem}
    .step-card p{color:var(--muted);font-size:.76rem}

    .return-stack{
      display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;margin-top:14px;
    }

    .return-block{
      min-height:155px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);
      text-align:center;display:grid;align-content:center;
    }
    .return-block strong{display:block;color:var(--blue);font-size:.8rem}
    .return-block .big{font-size:1.7rem;font-weight:900;margin:10px 0 4px}
    .return-op{font-size:1.8rem;font-weight:900;color:var(--muted);text-align:center}

    .compare-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.82rem}
    .compare-table th,.compare-table td{
      padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;
    }
    .compare-table th{
      color:var(--muted);font-size:.71rem;text-transform:uppercase;letter-spacing:.05em;
    }

    .status{
      display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 12px;
      border:1px solid var(--line);border-radius:12px;background:var(--soft);
      font-size:.82rem;font-weight:730;
    }
    .status-dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:var(--green)}
    .status.bad .status-dot{background:var(--rose)}

    .hidden{display:none!important}
    footer{padding:8px 4px 2px;color:var(--muted);text-align:center;font-size:.8rem}

    @media(max-width:1180px){
      .topic-nav{grid-template-columns:repeat(3,1fr)}
      .layout{grid-template-columns:280px minmax(0,1fr)}
      .hero,.chart-grid{grid-template-columns:1fr}
      .topic-grid,.equation-strip{grid-template-columns:1fr}
      .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(max-width:800px){
      .app{padding:10px}
      header{align-items:flex-start;flex-direction:column}
      .topic-nav{grid-template-columns:1fr 1fr}
      .layout{grid-template-columns:1fr}
      aside{position:static;max-height:none}
      .return-stack{grid-template-columns:1fr}
      .return-op{transform:rotate(90deg)}
    }

    @media(max-width:500px){
      .topic-nav,.metrics{grid-template-columns:1fr}
      .preset-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">δ</div>
      <div>
        <h1>Caso geral e depreciação parcial</h1>
        <p class="subtitle">A equação de Euler quando utilidade, tecnologia e acumulação deixam de ser simplificadas</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="themeBtn">◐ Tema</button>
      <button class="btn" id="resetBtn">Reiniciar tópico</button>
    </div>
  </header>

  <nav class="topic-nav" aria-label="Escolha do laboratório">
    <button class="topic-btn active" data-mode="environment">
      <strong>Ambiente geral</strong>
      <span>u, F, δ e a nova restrição de recursos</span>
    </button>
    <button class="topic-btn" data-mode="derivation">
      <strong>Derivação da Euler geral</strong>
      <span>Lagrangeano, CPOs e eliminação de λ</span>
    </button>
    <button class="topic-btn" data-mode="return">
      <strong>Retorno bruto e depreciação</strong>
      <span>Produto marginal mais capital sobrevivente</span>
    </button>
    <button class="topic-btn" data-mode="curvature">
      <strong>Curvatura e suavização</strong>
      <span>CRRA, EIS e crescimento do consumo</span>
    </button>
    <button class="topic-btn" data-mode="steady">
      <strong>Estado estacionário e casos</strong>
      <span>Comparações e retorno ao Brock–Mirman</span>
    </button>
  </nav>

  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $=(selector,root=document)=>root.querySelector(selector);
  const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];

  const defaults={
    environment:{beta:.95,A:1,alpha:.36,sigma:1,delta:.1,k:1.2,kp:.55,ct:.9,ctp1:1.02},
    derivation:{beta:.95,A:1,alpha:.36,sigma:1,delta:.1,ct:.9,ctp1:1.02,kp:.55},
    return:{A:1,alpha:.36,delta:.1,kp:.55,kMax:3},
    curvature:{beta:.95,A:1,alpha:.36,sigma:1.5,delta:.1,kp:.55,ct:.9},
    steady:{beta:.95,A:1,alpha:.36,sigma:1,delta:.1,kMax:3}
  };

  const state={
    mode:"environment",
    environment:{...defaults.environment},
    derivation:{...defaults.derivation},
    return:{...defaults.return},
    curvature:{...defaults.curvature},
    steady:{...defaults.steady}
  };

  const KOPT={throwOnError:false,strict:"ignore",trust:false};

  const MATH=Object.freeze({
    beta:String.raw`\beta`,
    A:String.raw`A`,
    alpha:String.raw`\alpha`,
    sigma:String.raw`\sigma`,
    delta:String.raw`\delta`,
    k:String.raw`k_t`,
    kp:String.raw`k_{t+1}`,
    ct:String.raw`c_t`,
    ctp1:String.raw`c_{t+1}`
  });

  const plotConfig={
    responsive:true,displaylogo:false,scrollZoom:true,
    toImageButtonOptions:{format:"png",filename:"caso_geral_depreciacao_parcial",scale:2},
    modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d","toggleSpikelines"]
  };

  function fmt(value,digits=3){
    if(!Number.isFinite(value)) return "—";
    if(Math.abs(value)>=1e5 || (Math.abs(value)>0 && Math.abs(value)<1e-4)){
      return value.toExponential(2).replace(".",",");
    }
    return value.toLocaleString("pt-BR",{maximumFractionDigits:digits,minimumFractionDigits:0});
  }

  function linspace(a,b,n){
    return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  }

  function renderKatex(element,expression,display=true){
    if(!element) return;
    const source=String(expression??"");

    if(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(source)){
      console.error("Expressão KaTeX contém caractere de controle:",source);
      element.textContent=source;
      element.classList.add("math-render-error");
      return;
    }

    const prepared=display?String.raw`\displaystyle ${source}`:source;

    if(!window.katex){
      element.textContent=source;
      return;
    }

    try{
      katex.render(prepared,element,{...KOPT,displayMode:display,errorColor:"#d95672"});
      element.classList.remove("math-render-error");
    }catch(error){
      console.error("Erro KaTeX:",source,error);
      element.textContent=source;
      element.classList.add("math-render-error");
    }
  }

  function tex(element,expression,display=true){
    renderKatex(element,expression,display);
  }

  function renderAllMath(root=document){
    if(!window.katex) return;
    $$("[data-tex]",root).forEach(element=>{
      renderKatex(element,element.dataset.tex,element.dataset.display!=="false");
    });
  }

  function chartTheme(){
    const dark=document.body.classList.contains("dark");
    return {
      dark,
      text:dark?"#a9b5bf":"#68727e",
      strong:dark?"#eef3f6":"#17212b",
      grid:dark?"rgba(74,94,108,.32)":"rgba(190,193,188,.42)",
      axis:dark?"#40515f":"#c8c9c2",
      panel:dark?"#151e27":"#fffefa",
      blue:dark?"#79a9ff":"#2563eb",
      teal:dark?"#55d5c9":"#0f9f95",
      violet:dark?"#b49aff":"#7c3aed",
      rose:dark?"#ff8da4":"#d95672",
      amber:dark?"#f1bb62":"#b66c0a",
      green:dark?"#69d59d":"#18794e"
    };
  }

  function rgba(hex,alpha){
    const value=hex.replace("#","");
    const full=value.length===3?value.split("").map(char=>char+char).join(""):value;
    const number=parseInt(full,16);
    return `rgba(${(number>>16)&255},${(number>>8)&255},${number&255},${alpha})`;
  }

  function plotLayout(xTitle,yTitle,extra={}){
    const theme=chartTheme();
    const axis={
      showline:true,linewidth:1,linecolor:theme.axis,ticks:"outside",ticklen:5,tickcolor:theme.axis,
      tickfont:{size:11,color:theme.text},gridcolor:theme.grid,griddash:"dot",zeroline:true,
      zerolinecolor:theme.axis,automargin:true,title:{font:{size:12,color:theme.text},standoff:12}
    };

    return {
      margin:{l:68,r:30,t:28,b:68},
      paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",
      font:{family:"Inter, system-ui, sans-serif",color:theme.text,size:12},
      colorway:[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green],
      xaxis:{...axis,title:{text:xTitle,font:{size:12,color:theme.text},standoff:12}},
      yaxis:{...axis,title:{text:yTitle,font:{size:12,color:theme.text},standoff:12}},
      hovermode:"x unified",
      hoverlabel:{bgcolor:theme.panel,bordercolor:theme.axis,font:{family:"Inter, system-ui, sans-serif",size:12,color:theme.strong}},
      legend:{orientation:"h",y:-.25,x:0,xanchor:"left",font:{size:11,color:theme.text},bgcolor:"rgba(0,0,0,0)"},
      transition:{duration:280,easing:"cubic-in-out"},dragmode:"pan",
      ...extra
    };
  }

  function polishTraces(traces){
    const theme=chartTheme();
    const colors=[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green];

    return traces.map((trace,index)=>{
      const color=trace.line?.color||trace.marker?.color||colors[index%colors.length];
      const polished={...trace};
      const isScatter=(trace.type||"scatter")==="scatter";
      const mode=trace.mode||"lines";

      if(isScatter&&mode.includes("lines")){
        polished.line={width:index===0?3.3:2.4,shape:"spline",smoothing:.5,...trace.line,color};
      }

      if(isScatter&&mode.includes("markers")){
        polished.marker={size:trace.marker?.size||5,color,line:{width:1.3,color:theme.panel},...trace.marker};
      }

      if(trace.fill){
        polished.fillcolor=trace.fillcolor||rgba(color,.10);
      }

      polished.hovertemplate=trace.hovertemplate||
        `<b>${trace.name||"Série"}</b><br>x: %{x:.4g}<br>y: %{y:.4g}<extra></extra>`;

      return polished;
    });
  }

  function prettyPlot(id,traces,layout){
    return Plotly.react(id,polishTraces(traces),layout,plotConfig);
  }

  function slider(id,label,value,min,max,step,help,symbol=""){
    return String.raw`
      <div class="control">
        <div class="control-head">
          <span>${label}${symbol?` <span data-tex="${symbol}" data-display="false"></span>`:""}</span>
          <output id="${id}Out">${fmt(value,3)}</output>
        </div>
        <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}">
        <small>${help}</small>
      </div>`;
  }

  function metric(label,id){
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value" id="${id}">—</div></div>`;
  }

  function bindRange(id,object,key,callback){
    const input=$("#"+id);
    if(!input) return;

    const run=()=>{
      object[key]=Number(input.value);
      const output=$("#"+id+"Out");
      if(output) output.textContent=fmt(object[key],3);
      callback();
    };

    input.addEventListener("input",run);
    input.addEventListener("change",run);
  }

  function utility(c,sigma=1){
    const safe=Math.max(c,1e-10);
    return Math.abs(sigma-1)<1e-9
      ?Math.log(safe)
      :(Math.pow(safe,1-sigma)-1)/(1-sigma);
  }

  function marginalUtility(c,sigma=1){
    return Math.pow(Math.max(c,1e-10),-sigma);
  }

  function production(k,A,alpha){
    return A*Math.pow(Math.max(k,0),alpha);
  }

  function mpk(k,A,alpha){
    return alpha*A*Math.pow(Math.max(k,1e-10),alpha-1);
  }

  function grossReturn(k,A,alpha,delta){
    return mpk(k,A,alpha)+1-delta;
  }

  function steadyCapital(beta,A,alpha,delta){
    const denominator=1/beta-1+delta;
    if(denominator<=0) return Infinity;
    return Math.pow(alpha*A/denominator,1/(1-alpha));
  }

  function steadyConsumption(k,A,alpha,delta){
    return production(k,A,alpha)-delta*k;
  }

  function updateEnvironment(){
    const s=state.environment;
    const output=production(s.k,s.A,s.alpha);
    const surviving=(1-s.delta)*s.k;
    const resources=output+surviving;
    const use=s.ct+s.kp;

    const lhs=marginalUtility(s.ct,s.sigma);
    const rhs=s.beta*marginalUtility(s.ctp1,s.sigma)*grossReturn(s.kp,s.A,s.alpha,s.delta);
    const residual=lhs-rhs;
    const tolerance=.015*Math.max(1,Math.abs(lhs),Math.abs(rhs));

    $("#envOutput").textContent=fmt(output,4);
    $("#envSurvival").textContent=fmt(surviving,4);
    $("#envResources").textContent=fmt(resources,4);
    $("#envResidual").textContent=fmt(residual,6);

    tex(
      $("#envSpecificFormula"),
      Math.abs(s.sigma-1)<1e-9
        ?String.raw`\frac{1}{c_t}=\beta\,\frac{1}{c_{t+1}}\left[\alpha Ak_{t+1}^{\alpha-1}+1-\delta\right]`
        :String.raw`c_t^{-\sigma}=\beta\,c_{t+1}^{-\sigma}\left[\alpha Ak_{t+1}^{\alpha-1}+1-\delta\right]`
    );

    $("#envStatus").classList.toggle("bad",Math.abs(residual)>tolerance);
    $("#envStatusText").textContent=Math.abs(residual)<=tolerance
      ?"A configuração satisfaz aproximadamente a Euler."
      :residual>0
        ?"O custo marginal presente excede o benefício futuro."
        :"O benefício marginal futuro excede o custo presente.";

    const theme=chartTheme();

    prettyPlot("envResourceChart",[
      {
        x:["Origem","Usos"],
        y:[output,s.ct],
        type:"bar",
        name:"Produto / consumo",
        marker:{color:theme.blue}

      {
        x:["Origem","Usos"],
        y:[surviving,s.kp],
        type:"bar",
        name:"Capital sobrevivente / capital futuro",
        marker:{color:theme.teal}
      }
    ],plotLayout("Decomposição","Quantidade",{
      barmode:"stack",hovermode:"closest",bargap:.42
    }));

    const kGrid=linspace(.02,3,280);
    const mpkGrid=kGrid.map(k=>mpk(k,s.A,s.alpha));

    prettyPlot("envReturnChart",[

        x:kGrid,y:grossGrid,type:"scatter",mode:"lines",name:"Retorno bruto",
        fill:"tozeroy",fillcolor:rgba(theme.blue,.06),line:{color:theme.blue}
      },
      {
        x:kGrid,y:mpkGrid,type:"scatter",mode:"lines",name:"F′(k)",
        line:{color:theme.teal}
      },
      {
        x:kGrid,y:kGrid.map(()=>1-s.delta),type:"scatter",mode:"lines",name:"1−δ",
        line:{color:theme.amber,dash:"dash"}

      {
        x:[s.kp],y:[grossReturn(s.kp,s.A,s.alpha,s.delta)],
        type:"scatter",mode:"markers",name:"kₜ₊₁",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Capital futuro, kₜ₊₁","Retorno"));
  }

  function updateDerivation(){
    const s=state.derivation;
    const lambdaT=marginalUtility(s.ct,s.sigma);
    const lambdaP=marginalUtility(s.ctp1,s.sigma);
    const R=grossReturn(s.kp,s.A,s.alpha,s.delta);
    const cost=lambdaT;
    const benefit=s.beta*lambdaP*R;
    const residual=cost-benefit;

    $("#derLambdaT").textContent=fmt(lambdaT,5);
    $("#derLambdaP").textContent=fmt(lambdaP,5);
    $("#derReturn").textContent=fmt(R,5);
    $("#derResidual").textContent=fmt(residual,6);

    const theme=chartTheme();

    prettyPlot("derMarginsChart",[
      {
        x:["Custo presente","Benefício futuro"],

        type:"bar",
        name:"Margens",
        marker:{color:[theme.rose,theme.teal]},
        text:[fmt(cost,3),fmt(benefit,3)],
        textposition:"outside",
        cliponaxis:false
      },
      {
        x:["Custo presente","Benefício futuro"],
        y:[0,s.beta*lambdaP*(1-s.delta)],

        marker:{color:theme.amber},
        opacity:.75
      }
    ],plotLayout("Margem","Valor marginal",{

    const deltaGrid=linspace(0,1,260);
    const residualGrid=deltaGrid.map(delta=>{
      const returnAtDelta=grossReturn(s.kp,s.A,s.alpha,delta);
      return lambdaT-s.beta*lambdaP*returnAtDelta;

    prettyPlot("derDeltaChart",[
      {
        x:deltaGrid,y:residualGrid,type:"scatter",mode:"lines",name:"Residual",
        fill:"tozeroy",fillcolor:rgba(theme.violet,.06),line:{color:theme.violet}

        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Depreciação, δ","Residual LHS − RHS"));
  }

            <span data-tex="1-\delta" data-display="false"></span>
          </div>
          <div class="return-op">=</div>
          <div class="return-block">
            <strong>Retorno bruto</strong>
            <div class="big" id="retGrossBig">—</div>
            <span data-tex="R_{t+1}^{k}" data-display="false"></span>
          </div>
        </div>
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Por nível de capital</div>
          <h2>Retorno produtivo e retorno bruto</h2>
          <div id="retCurvesChart" class="chart tall"></div>
          <p class="chart-note">A depreciação desloca verticalmente o retorno bruto sem alterar F′.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Por taxa de depreciação</div>
          <h2>Retorno bruto no capital selecionado</h2>
          <div id="retDeltaChart" class="chart tall"></div>
          <p class="chart-note">Mantendo k fixo, o retorno bruto cai linearmente com δ.</p>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Retorno líquido e bruto</div>
        <h2>Não confunda os conceitos</h2>
        <table class="compare-table">
          <thead><tr><th>Objeto</th><th>Expressão</th><th>Uso</th></tr></thead>
          <tbody>
            <tr><td>Produto marginal</td><td><span data-tex="F'(k_{t+1})" data-display="false"></span></td><td>Fluxo adicional de produto.</td></tr>
            <tr><td>Retorno líquido do capital</td><td><span data-tex="F'(k_{t+1})-\delta" data-display="false"></span></td><td>Ganho líquido em relação à unidade inicial.</td></tr>
            <tr><td>Retorno bruto</td><td><span data-tex="F'(k_{t+1})+1-\delta" data-display="false"></span></td><td>Fator que aparece na Euler.</td></tr>
          </tbody>
        </table>
        <div class="insight bad" style="margin-top:12px"><strong>Armadilha:</strong> inserir F′−δ diretamente na Euler omite a unidade de principal devolvida pelo ativo.</div>
      </section>

      <footer>A Euler utiliza o retorno bruto porque compara uma unidade sacrificada hoje com todos os recursos recebidos amanhã.</footer>`;

    renderAllMath();

    bindRange("retA",s,"A",updateReturn);
    bindRange("retAlpha",s,"alpha",updateReturn);
    bindRange("retDelta",s,"delta",()=>{
      if(s.delta>.995){
        s.delta=1;
        $("#retDelta").value="1";
        $("#retDeltaOut").textContent="1";
      }
      updateReturn();
    });
    bindRange("retKp",s,"kp",updateReturn);
    bindRange("retKMax",s,"kMax",updateReturn);

    $$("[data-ret-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.retPreset;
        if(preset==="low") s.delta=.05;
        if(preset==="medium") s.delta=.5;
        if(preset==="full") s.delta=1;
        if(preset==="nodep") s.delta=0;
        renderReturn();
      });
    });

    updateReturn();
  }

  function updateReturn(){
    const s=state.return;
    const productMarginal=mpk(s.kp,s.A,s.alpha);
    const survival=1-s.delta;
    const gross=productMarginal+survival;
    const loss=s.delta;

    $("#retMPK").textContent=fmt(productMarginal,5);
    $("#retSurvival").textContent=fmt(survival,5);
    $("#retGross").textContent=fmt(gross,5);
    $("#retLoss").textContent=fmt(loss,5);

    $("#retMPKBig").textContent=fmt(productMarginal,4);
    $("#retSurvivalBig").textContent=fmt(survival,4);
    $("#retGrossBig").textContent=fmt(gross,4);

    const theme=chartTheme();
    const kGrid=linspace(.02,s.kMax,300);
    const mpkGrid=kGrid.map(k=>mpk(k,s.A,s.alpha));
    const grossGrid=kGrid.map(k=>grossReturn(k,s.A,s.alpha,s.delta));

    prettyPlot("retCurvesChart",[
      {
        x:kGrid,y:grossGrid,type:"scatter",mode:"lines",name:"Retorno bruto",
        fill:"tozeroy",fillcolor:rgba(theme.blue,.06),line:{color:theme.blue}
      },
      {
        x:kGrid,y:mpkGrid,type:"scatter",mode:"lines",name:"Produto marginal",
        line:{color:theme.teal}
      },
      {
        x:kGrid,y:kGrid.map(()=>survival),type:"scatter",mode:"lines",name:"1−δ",
        line:{color:theme.amber,dash:"dash"}
      },
      {
        x:[s.kp],y:[gross],type:"scatter",mode:"markers",name:"kₜ₊₁ atual",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Capital futuro, kₜ₊₁","Retorno"));

    const deltaGrid=linspace(0,1,260);
    const grossByDelta=deltaGrid.map(delta=>productMarginal+1-delta);

    prettyPlot("retDeltaChart",[
      {
        x:deltaGrid,y:grossByDelta,type:"scatter",mode:"lines",name:"R bruto",
        fill:"tozeroy",fillcolor:rgba(theme.violet,.07),line:{color:theme.violet}
      },
      {
        x:[s.delta],y:[gross],type:"scatter",mode:"markers",name:"δ atual",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Depreciação, δ","Retorno bruto"));
  }

  /* ============================================================
     4. CURVATURA
  ============================================================ */

  function renderCurvature(){
    const s=state.curvature;

    $("#sidebar").innerHTML=String.raw`
      <h2 class="sidebar-title">Curvatura e suavização</h2>
      <p class="sidebar-subtitle">Veja como a forma de u altera a resposta do consumo ao retorno bruto.</p>

      ${slider("curBeta","Fator de desconto",s.beta,.5,.995,.005,"Eleva o peso do futuro.",MATH.beta)}
      ${slider("curA","Produtividade",s.A,.4,2.2,.05,"Afeta o retorno bruto.",MATH.A)}
      ${slider("curAlpha","Elasticidade",s.alpha,.08,.92,.01,"Afeta F′.",MATH.alpha)}
      ${slider("curSigma","Curvatura CRRA",s.sigma,.4,3,.05,"A EIS é 1/σ.",MATH.sigma)}
      ${slider("curDelta","Depreciação",s.delta,0,1,.01,"Afeta o retorno bruto.",MATH.delta)}
      ${slider("curKp","Capital futuro",s.kp,.02,3,.02,"Ponto de avaliação do retorno.",MATH.kp)}
      ${slider("curCt","Consumo atual",s.ct,.08,3,.02,"Base do consumo futuro implícito.",MATH.ct)}

      <div class="control">
        <div class="control-head"><span>Presets</span></div>
        <div class="preset-grid">
          <button class="preset" data-cur-preset="log">Log</button>
          <button class="preset" data-cur-preset="elastic">EIS alta</button>
          <button class="preset" data-cur-preset="smooth">EIS baixa</button>
          <button class="preset" data-cur-preset="full">δ = 1</button>
        </div>
      </div>`;

    $("#content").innerHTML=String.raw`
      <section class="hero">
        <article class="card">
          <div class="eyebrow">Preferências CRRA</div>
          <h2>O caso log é apenas σ = 1</h2>
          <div class="formula-box" data-tex="u(c)=\begin{cases}\dfrac{c^{1-\sigma}-1}{1-\sigma},&\sigma\neq1,\\[6pt]\ln c,&\sigma=1.\end{cases}\qquad u'(c)=c^{-\sigma}"></div>
          <p class="muted">A curvatura controla quanto o consumo reage a uma diferença de retorno entre datas.</p>
        </article>

        <article class="card">
          <div class="eyebrow">Elasticidade intertemporal</div>
          <div class="insight"><strong>σ pequeno:</strong> o consumo reage intensamente ao retorno.</div>
          <div class="insight"><strong>σ grande:</strong> o agente prefere uma trajetória mais suave.</div>
          <div class="insight warn"><strong>σ = 1:</strong> crescimento do consumo é linear em βR.</div>
        </article>
      </section>

      <section class="metrics">
        ${metric("Retorno bruto","curReturn")}
        ${metric("Retorno descontado","curDiscounted")}
        ${metric("EIS = 1/σ","curEIS")}
        ${metric("Crescimento do consumo","curGrowth")}
      </section>

      <section class="card">
        <div class="eyebrow">Euler em taxa de crescimento</div>
        <h2>Forma fechada para CRRA</h2>
        <div class="formula-box" data-tex="\frac{c_{t+1}}{c_t}=\left\{\beta\left[F'(k_{t+1})+1-\delta\right]\right\}^{1/\sigma}"></div>
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Curvas de resposta</div>
          <h2>Crescimento versus retorno descontado</h2>
          <div id="curGrowthChart" class="chart tall"></div>
          <p class="chart-note">A linha unitária separa crescimento de queda do consumo.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Utilidade marginal</div>
          <h2>Como σ altera a inclinação</h2>
          <div id="curMUChart" class="chart tall"></div>
          <p class="chart-note">Quanto maior σ, mais rapidamente a utilidade marginal cai com o consumo.</p>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Suavização correta</div>
        <h2>A Euler equaliza margens ajustadas, não níveis</h2>
        <table class="compare-table">
          <thead><tr><th>Condição</th><th>Resultado</th><th>Leitura</th></tr></thead>
          <tbody>
            <tr><td><span data-tex="\beta R_{t+1}>1" data-display="false"></span></td><td><span data-tex="c_{t+1}>c_t" data-display="false"></span></td><td>O futuro é relativamente atraente.</td></tr>
            <tr><td><span data-tex="\beta R_{t+1}=1" data-display="false"></span></td><td><span data-tex="c_{t+1}=c_t" data-display="false"></span></td><td>Consumo constante.</td></tr>
            <tr><td><span data-tex="\beta R_{t+1}<1" data-display="false"></span></td><td><span data-tex="c_{t+1}<c_t" data-display="false"></span></td><td>O presente é relativamente mais valioso.</td></tr>
          </tbody>
        </table>
        <div class="insight bad" style="margin-top:12px"><strong>Armadilha:</strong> depreciação maior reduz Rₜ₊₁ e, tudo o mais constante, reduz o crescimento ótimo do consumo.</div>
      </section>

      <footer>A forma da utilidade transforma o mesmo retorno bruto em respostas distintas de consumo.</footer>`;

    renderAllMath();

    bindRange("curBeta",s,"beta",updateCurvature);
    bindRange("curA",s,"A",updateCurvature);
    bindRange("curAlpha",s,"alpha",updateCurvature);
    bindRange("curSigma",s,"sigma",()=>{
      if(Math.abs(s.sigma-1)<.026){
        s.sigma=1;
        $("#curSigma").value="1";
        $("#curSigmaOut").textContent="1";
      }
      updateCurvature();
    });
    bindRange("curDelta",s,"delta",()=>{
      if(s.delta>.995){
        s.delta=1;
        $("#curDelta").value="1";
        $("#curDeltaOut").textContent="1";
      }
      updateCurvature();
    });
    bindRange("curKp",s,"kp",updateCurvature);
    bindRange("curCt",s,"ct",updateCurvature);

    $$("[data-cur-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.curPreset;
        if(preset==="log") s.sigma=1;
        if(preset==="elastic") s.sigma=.55;
        if(preset==="smooth") s.sigma=2.5;
        if(preset==="full") s.delta=1;
        renderCurvature();
      });
    });

    updateCurvature();
  }

  function updateCurvature(){
    const s=state.curvature;
    const R=grossReturn(s.kp,s.A,s.alpha,s.delta);
    const discounted=s.beta*R;
    const growth=Math.pow(Math.max(discounted,1e-12),1/s.sigma);
    const eis=1/s.sigma;

    $("#curReturn").textContent=fmt(R,5);
    $("#curDiscounted").textContent=fmt(discounted,5);
    $("#curEIS").textContent=fmt(eis,5);
    $("#curGrowth").textContent=fmt(growth,5);

    const theme=chartTheme();
    const xGrid=linspace(.45,1.75,280);
    const sigmas=[.55,1,2.5];
    const colors=[theme.teal,theme.blue,theme.violet];

    const traces=sigmas.map((sigma,index)=>({
      x:xGrid,
      y:xGrid.map(x=>Math.pow(x,1/sigma)),
      type:"scatter",
      mode:"lines",
      name:`σ = ${fmt(sigma,2)}`,
      line:{color:colors[index]}
    }));

    traces.push({
      x:[discounted],y:[growth],type:"scatter",mode:"markers",name:"Configuração atual",
      marker:{size:11,color:theme.rose}
    });

    prettyPlot("curGrowthChart",traces,plotLayout("Retorno descontado, βR","cₜ₊₁/cₜ",{
      shapes:[
        {type:"line",x0:.45,x1:1.75,y0:1,y1:1,line:{color:rgba(theme.rose,.45),dash:"dot"}},
        {type:"line",x0:1,x1:1,y0:0,y1:2.5,line:{color:rgba(theme.rose,.45),dash:"dot"}}
      ]
    }));

    const cGrid=linspace(.08,3,280);
    const muTraces=sigmas.map((sigma,index)=>({
      x:cGrid,
      y:cGrid.map(c=>marginalUtility(c,sigma)),
      type:"scatter",
      mode:"lines",
      name:`σ = ${fmt(sigma,2)}`,
      line:{color:colors[index]}
    }));

    prettyPlot("curMUChart",muTraces,plotLayout("Consumo, c","Utilidade marginal",{
      yaxis:{...plotLayout("","").yaxis,type:"log",title:{text:"u′(c) — escala log"}}
    }));
  }

  /* ============================================================
     5. ESTADO ESTACIONÁRIO
  ============================================================ */

  function renderSteady(){
    const s=state.steady;

    $("#sidebar").innerHTML=String.raw`
      <h2 class="sidebar-title">Estado estacionário e casos</h2>
      <p class="sidebar-subtitle">Compare a regra modificada de Ouro sob diferentes níveis de depreciação.</p>

      ${slider("ssBeta","Fator de desconto",s.beta,.5,.995,.005,"Maior β eleva o capital estacionário.",MATH.beta)}
      ${slider("ssA","Produtividade",s.A,.4,2.2,.05,"Maior A eleva kˢˢ.",MATH.A)}
      ${slider("ssAlpha","Elasticidade",s.alpha,.08,.92,.01,"Controla a resposta de kˢˢ.",MATH.alpha)}
      ${slider("ssSigma","Curvatura CRRA",s.sigma,.4,3,.05,"Não altera kˢˢ determinístico com consumo constante.",MATH.sigma)}
      ${slider("ssDelta","Depreciação",s.delta,0,1,.01,"Maior δ reduz kˢˢ.",MATH.delta)}
      ${slider("ssKMax","Capital máximo exibido",s.kMax,.6,6,.05,"Define a janela do gráfico.","k_{\max}")}

      <div class="control">
        <div class="control-head"><span>Presets</span></div>
        <div class="preset-grid">
          <button class="preset" data-ss-preset="partial">δ parcial</button>
          <button class="preset" data-ss-preset="full">δ = 1</button>
          <button class="preset" data-ss-preset="patient">β elevado</button>
          <button class="preset" data-ss-preset="productive">A elevado</button>
        </div>
      </div>`;

    $("#content").innerHTML=String.raw`
      <section class="hero">
        <article class="card">
          <div class="eyebrow">Regra modificada de Ouro</div>
          <h2>No estado estacionário, o retorno descontado é um</h2>
          <div class="formula-box" data-tex="1=\beta\left[F'(k^{ss})+1-\delta\right]"></div>
          <p class="muted">Com consumo constante, u′(c^{ss}) cancela dos dois lados da Euler.</p>
        </article>

        <article class="card">
          <div class="eyebrow">Consequências</div>
          <div class="insight"><strong>β ↑:</strong> o agente tolera mais acumulação antes de parar.</div>
          <div class="insight"><strong>δ ↑:</strong> mais investimento é necessário apenas para repor capital.</div>
          <div class="insight warn"><strong>σ:</strong> altera a transição, mas não o kˢˢ desta economia determinística simples.</div>
        </article>
      </section>

      <section class="metrics">
        ${metric("Capital estacionário","ssK")}
        ${metric("Consumo estacionário","ssC")}
        ${metric("Produto marginal em ss","ssMPK")}
        ${metric("Retorno bruto em ss","ssReturn")}
      </section>

      <section class="card">
        <div class="eyebrow">Cobb–Douglas</div>
        <h2>Solução fechada com depreciação parcial</h2>
        <div class="formula-box" data-tex="k^{ss}=\left(\frac{\alpha A}{\beta^{-1}-1+\delta}\right)^{1/(1-\alpha)}=\left(\frac{\beta\alpha A}{1-\beta(1-\delta)}\right)^{1/(1-\alpha)}"></div>
        <div class="equation-strip">
          <div class="equation" data-tex="c^{ss}=A(k^{ss})^\alpha-\delta k^{ss}"></div>
          <div class="equation" data-tex="F'(k^{ss})=\beta^{-1}-1+\delta"></div>
          <div class="equation" data-tex="R^{ss}=\beta^{-1}"></div>
        </div>
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Regra de Ouro modificada</div>
          <h2>βR(k) e a linha unitária</h2>
          <div id="ssReturnChart" class="chart tall"></div>
          <p class="chart-note">A interseção determina o capital estacionário.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Comparativa estática</div>
          <h2>Capital estacionário ao variar δ</h2>
          <div id="ssDeltaChart" class="chart tall"></div>
          <p class="chart-note">Maior depreciação reduz o estoque estacionário de capital.</p>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Casos especiais</div>
        <h2>Como o modelo simplificado reaparece</h2>
        <table class="compare-table">
          <thead><tr><th>Hipóteses</th><th>Euler</th><th>O que desaparece</th></tr></thead>
          <tbody>
            <tr>
              <td>u geral, F geral, δ parcial</td>
              <td><span data-tex="u'(c_t)=\beta u'(c_{t+1})[F'(k_{t+1})+1-\delta]" data-display="false"></span></td>
              <td>Nada.</td>
            </tr>
            <tr>
              <td>u = ln, F geral, δ parcial</td>
              <td><span data-tex="\frac1{c_t}=\beta\frac1{c_{t+1}}[F'(k_{t+1})+1-\delta]" data-display="false"></span></td>
              <td>A utilidade marginal geral.</td>
            </tr>
            <tr>
              <td>u = ln, F = Ak^α, δ parcial</td>
              <td><span data-tex="\frac{c_{t+1}}{c_t}=\beta[\alpha Ak_{t+1}^{\alpha-1}+1-\delta]" data-display="false"></span></td>
              <td>F′ abstrata.</td>
            </tr>
            <tr>
              <td>Brock–Mirman: u = ln, F = Ak^α, δ = 1</td>
              <td><span data-tex="\frac{c_{t+1}}{c_t}=\beta\alpha Ak_{t+1}^{\alpha-1}" data-display="false"></span></td>
              <td>O termo de capital sobrevivente.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <div class="eyebrow">Mensagem estrutural</div>
        <h2>O caso simplificado não é outro modelo</h2>
        <div class="topic-grid">
          <div class="topic-box"><strong>Utilidade log</strong><p>Transforma u′(c) em 1/c.</p></div>
          <div class="topic-box"><strong>Cobb–Douglas</strong><p>Transforma F′(k) em αAk^{α−1}.</p></div>
          <div class="topic-box"><strong>δ = 1</strong><p>Remove o retorno do capital sobrevivente.</p></div>
        </div>
      </section>

      <footer>O Brock–Mirman é o caso em que cada bloco da Euler geral assume sua forma mais simples.</footer>`;

    renderAllMath();

    bindRange("ssBeta",s,"beta",updateSteady);
    bindRange("ssA",s,"A",updateSteady);
    bindRange("ssAlpha",s,"alpha",updateSteady);
    bindRange("ssSigma",s,"sigma",updateSteady);
    bindRange("ssDelta",s,"delta",()=>{
      if(s.delta>.995){
        s.delta=1;
        $("#ssDelta").value="1";
        $("#ssDeltaOut").textContent="1";
      }
      updateSteady();
    });
    bindRange("ssKMax",s,"kMax",updateSteady);

    $$("[data-ss-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.ssPreset;
        if(preset==="partial") s.delta=.1;
        if(preset==="full") s.delta=1;
        if(preset==="patient") s.beta=.99;
        if(preset==="productive") s.A=1.7;
        renderSteady();
      });
    });

    updateSteady();
  }

  function updateSteady(){
    const s=state.steady;
    const kss=steadyCapital(s.beta,s.A,s.alpha,s.delta);
    const css=steadyConsumption(kss,s.A,s.alpha,s.delta);
    const productMarginal=mpk(kss,s.A,s.alpha);
    const R=grossReturn(kss,s.A,s.alpha,s.delta);

    $("#ssK").textContent=fmt(kss,5);
    $("#ssC").textContent=fmt(css,5);
    $("#ssMPK").textContent=fmt(productMarginal,5);
    $("#ssReturn").textContent=fmt(R,5);

    const theme=chartTheme();
    const maxK=Math.max(s.kMax,kss*1.35);
    const kGrid=linspace(.02,maxK,300);
    const discountedReturn=kGrid.map(k=>s.beta*grossReturn(k,s.A,s.alpha,s.delta));

    prettyPlot("ssReturnChart",[
      {
        x:kGrid,y:discountedReturn,type:"scatter",mode:"lines",name:"βR(k)",
        fill:"tozeroy",fillcolor:rgba(theme.blue,.06),line:{color:theme.blue}
      },
      {
        x:[.02,maxK],y:[1,1],type:"scatter",mode:"lines",name:"Unidade",
        line:{color:theme.teal,dash:"dash"}
      },
      {
        x:[kss],y:[1],type:"scatter",mode:"markers",name:"kˢˢ",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Capital, k","Retorno descontado",{
      annotations:[{
        x:kss,y:1,text:"kˢˢ",showarrow:true,ax:28,ay:-28,
        arrowcolor:theme.rose,font:{color:theme.rose,size:12}
      }]
    }));

    const deltaGrid=linspace(0,1,260);
    const kssGrid=deltaGrid.map(delta=>steadyCapital(s.beta,s.A,s.alpha,delta));

    prettyPlot("ssDeltaChart",[
      {
        x:deltaGrid,y:kssGrid,type:"scatter",mode:"lines",name:"kˢˢ(δ)",
        fill:"tozeroy",fillcolor:rgba(theme.violet,.07),line:{color:theme.violet}
      },
      {
        x:[s.delta],y:[kss],type:"scatter",mode:"markers",name:"δ atual",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Depreciação, δ","Capital estacionário"));
  }

  function resetCurrent(){
    state[state.mode]={...defaults[state.mode]};
    renderMode();
  }

  $$(".topic-btn").forEach(button=>{
    button.addEventListener("click",()=>setMode(button.dataset.mode));
  });

  $("#themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    renderMode();
  });

  $("#resetBtn").addEventListener("click",resetCurrent);

  window.addEventListener("resize",()=>{
    $$(".chart").forEach(element=>{
      if(window.Plotly) Plotly.Plots.resize(element);
    });
  });

  document.addEventListener("DOMContentLoaded",renderMode);
  window.addEventListener("load",renderMode);
})();
</script>
</body>
</html>
