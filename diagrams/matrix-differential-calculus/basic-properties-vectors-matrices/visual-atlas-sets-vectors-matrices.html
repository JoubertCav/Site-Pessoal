<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Highly interactive graphical atlas of sets, vectors, and matrix operations." />
  <title>Visual Atlas — Sets, Vectors & Matrices</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1e8;
      --panel: #fffdf8;
      --panel-2: rgba(255,255,255,.78);
      --panel-3: rgba(255,255,255,.52);
      --ink: #17242c;
      --muted: #6d7a80;
      --line: rgba(23,36,44,.13);
      --grid: rgba(23,36,44,.065);
      --teal: #0d827e;
      --teal-2: #52bdb6;
      --teal-soft: #dcf2ef;
      --violet: #6b58aa;
      --violet-2: #9a89d4;
      --violet-soft: #eee9fb;
      --gold: #b1842a;
      --gold-2: #d9b35f;
      --gold-soft: #f8edcc;
      --red: #ba6267;
      --red-soft: #f8e3e4;
      --slate: #536873;
      --shadow: 0 22px 70px rgba(25,38,45,.11);
      --shadow-soft: 0 10px 28px rgba(25,38,45,.08);
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d151a;
      --panel: #151f25;
      --panel-2: rgba(21,31,37,.88);
      --panel-3: rgba(21,31,37,.60);
      --ink: #edf3f4;
      --muted: #9caeb4;
      --line: rgba(237,243,244,.115);
      --grid: rgba(237,243,244,.055);
      --teal: #5acdc6;
      --teal-2: #2e9792;
      --teal-soft: #173b3a;
      --violet: #b9a8f1;
      --violet-2: #7568aa;
      --violet-soft: #2e2943;
      --gold: #e2b65d;
      --gold-2: #8f723b;
      --gold-soft: #45391f;
      --red: #ed9095;
      --red-soft: #472a2d;
      --slate: #a1b4bb;
      --shadow: 0 25px 75px rgba(0,0,0,.38);
      --shadow-soft: 0 12px 30px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--teal-soft) 70%, transparent), transparent 27%),
        radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--violet-soft) 48%, transparent), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 420px) auto;
      align-items: center;
      gap: 18px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      backdrop-filter: blur(22px);
    }

    .brand { min-width: 0; }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 820;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 600;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      height: 39px;
      padding: 0 38px 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: var(--panel-2);
      color: var(--ink);
      transition: .16s ease;
    }

    .search-wrap input:focus {
      border-color: color-mix(in srgb, var(--teal) 48%, var(--line));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal-soft) 48%, transparent);
    }

    .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-btn {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      transition: .16s ease;
    }

    .icon-btn:hover {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--teal) 44%, var(--line));
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 68px;
      align-self: start;
      height: calc(100vh - 68px);
      padding: 16px 14px 28px;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel-3) 70%, transparent);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .group-title {
      margin: 18px 8px 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 820;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .group-title:first-child { margin-top: 2px; }

    .nav-btn {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 13px;
      padding: 9px 10px;
      background: transparent;
      color: var(--muted);
      display: grid;
      grid-template-columns: 29px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      transition: .16s ease;
    }

    .nav-btn + .nav-btn { margin-top: 3px; }

    .nav-btn:hover {
      color: var(--ink);
      background: color-mix(in srgb, var(--panel) 66%, transparent);
      transform: translateX(2px);
    }

    .nav-btn.active {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--teal) 40%, var(--line));
      background: linear-gradient(135deg, var(--teal-soft), color-mix(in srgb, var(--panel) 78%, var(--teal-soft)));
      box-shadow: inset 3px 0 0 var(--teal);
    }

    .nav-btn.hidden { display: none; }

    .nav-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: color-mix(in srgb, var(--panel) 72%, transparent);
      font-family: var(--serif);
      font-size: 12px;
      font-weight: 700;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-arrow {
      font-size: 12px;
      opacity: 0;
      transform: translateX(-4px);
      transition: .16s ease;
    }

    .nav-btn.active .nav-arrow,
    .nav-btn:hover .nav-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .main {
      min-width: 0;
      padding: 22px;
      display: grid;
      grid-template-rows: auto auto minmax(510px, 1fr) auto;
      gap: 13px;
    }

    .concept-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
    }

    .concept-kicker {
      margin: 0 0 4px;
      color: var(--teal);
      font-size: 10px;
      font-weight: 840;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .concept-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(27px, 4vw, 46px);
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .concept-formula {
      min-height: 42px;
      max-width: 540px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-2);
      overflow-x: auto;
      color: var(--ink);
      box-shadow: var(--shadow-soft);
    }

    .concept-formula .katex { font-size: 1.03em; }

    .microcopy {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .microcopy::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--teal);
    }

    .stage-card {
      position: relative;
      min-height: 510px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--panel) 82%, transparent), transparent 66%),
        var(--panel-3);
      background-size: 28px 28px, 28px 28px, auto, auto;
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }

    .stage-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, color-mix(in srgb, var(--panel) 18%, transparent), transparent 20%),
        radial-gradient(circle at center, transparent 50%, color-mix(in srgb, var(--bg) 13%, transparent));
      z-index: 0;
    }

    #stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 510px;
      display: block;
      touch-action: none;
    }

    .stage-badge,
    .step-indicator {
      position: absolute;
      top: 14px;
      z-index: 4;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      color: var(--muted);
      font-size: 9px;
      font-weight: 770;
      letter-spacing: .05em;
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .stage-badge { left: 14px; }
    .step-indicator { right: 14px; }

    .hover-note {
      position: absolute;
      z-index: 8;
      max-width: 255px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      font-size: 11px;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(5px) scale(.98);
      pointer-events: none;
      transition: .12s ease;
    }

    .hover-note.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .controlbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel-2);
      box-shadow: var(--shadow-soft);
    }

    .control-left,
    .control-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-btn,
    .seg-btn {
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 74%, transparent);
      color: var(--muted);
      cursor: pointer;
      transition: .15s ease;
    }

    .control-btn {
      min-height: 34px;
      border-radius: 11px;
      padding: 8px 11px;
      font-size: 11px;
      font-weight: 730;
    }

    .control-btn.primary {
      color: #fff;
      background: var(--teal);
      border-color: var(--teal);
    }

    html[data-theme="dark"] .control-btn.primary {
      color: #102126;
    }

    .control-btn:hover,
    .seg-btn:hover {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--teal) 44%, var(--line));
      transform: translateY(-1px);
    }

    .control-btn.primary:hover {
      color: #fff;
      filter: brightness(1.04);
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel) 56%, transparent);
    }

    .seg-btn {
      border: 0;
      border-radius: 9px;
      padding: 7px 10px;
      background: transparent;
      font-size: 10px;
      font-weight: 770;
    }

    .seg-btn.active {
      color: var(--ink);
      background: var(--teal-soft);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--teal) 12%, transparent);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: color-mix(in srgb, var(--panel) 58%, transparent);
      color: var(--muted);
      font-size: 10px;
      font-weight: 720;
    }

    input[type="range"] {
      width: 150px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .legend {
      display: flex;
      gap: 11px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 10%, transparent);
    }

    .dot.teal { background: var(--teal); color: var(--teal); }
    .dot.violet { background: var(--violet); color: var(--violet); }
    .dot.gold { background: var(--gold); color: var(--gold); }
    .dot.red { background: var(--red); color: var(--red); }

    svg text {
      fill: var(--ink);
      font-family: var(--sans);
      pointer-events: none;
    }

    .math-text {
      font-family: var(--serif);
      font-style: italic;
    }

    .label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .small-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 680;
    }

    .big-label {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
    }

    .axis {
      stroke: var(--slate);
      stroke-width: 1.7;
    }

    .guide {
      stroke: var(--line);
      stroke-width: 1.1;
      stroke-dasharray: 5 6;
    }

    .arrow {
      stroke: var(--slate);
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }

    .arrow-teal {
      stroke: var(--teal);
      stroke-width: 2.7;
      fill: none;
      marker-end: url(#arrowTeal);
    }

    .arrow-violet {
      stroke: var(--violet);
      stroke-width: 2.7;
      fill: none;
      marker-end: url(#arrowViolet);
    }

    .matrix-cell {
      fill: color-mix(in srgb, var(--panel) 84%, transparent);
      stroke: var(--line);
      stroke-width: 1;
      transition: .18s ease;
    }

    .matrix-cell.teal {
      fill: var(--teal-soft);
      stroke: color-mix(in srgb, var(--teal) 62%, var(--line));
    }

    .matrix-cell.violet {
      fill: var(--violet-soft);
      stroke: color-mix(in srgb, var(--violet) 62%, var(--line));
    }

    .matrix-cell.gold {
      fill: var(--gold-soft);
      stroke: color-mix(in srgb, var(--gold) 62%, var(--line));
    }

    .matrix-cell.red {
      fill: var(--red-soft);
      stroke: color-mix(in srgb, var(--red) 62%, var(--line));
    }

    .matrix-cell.active {
      stroke-width: 2.4;
      filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--gold) 22%, transparent));
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(1.04);
    }

    .cell-value {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .clickable { cursor: pointer; }

    .clickable:hover {
      filter: brightness(1.035);
      stroke-width: 2;
    }

    .set-outline {
      fill: color-mix(in srgb, var(--panel) 36%, transparent);
      stroke-width: 2.4;
      transition: .2s ease;
    }

    .teal-stroke { stroke: var(--teal); }
    .violet-stroke { stroke: var(--violet); }

    .draggable {
      cursor: grab;
      touch-action: none;
    }

    .draggable:active { cursor: grabbing; }

    .token {
      filter: drop-shadow(0 5px 9px rgba(0,0,0,.12));
    }

    .pulse {
      animation: pulse 1.45s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .float {
      animation: float 3.4s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .draw-in {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawLine .75s ease forwards;
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn .38s ease forwards;
    }

    .scale-in {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: scaleIn .42s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .flash {
      animation: flash .72s ease;
    }

    @keyframes pulse {
      0%,100% { opacity: .55; transform: scale(.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes flash {
      0%,100% { filter: none; }
      50% { filter: drop-shadow(0 0 14px var(--gold)); }
    }

    @media (max-width: 1000px) {
      .topbar {
        grid-template-columns: 1fr auto;
      }

      .search-wrap {
        grid-column: 1 / -1;
        order: 3;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: sticky;
        top: 116px;
        z-index: 40;
        height: auto;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        background: color-mix(in srgb, var(--panel) 86%, transparent);
        backdrop-filter: blur(18px);
      }

      .group-title { display: none; }

      .nav-btn {
        flex: 0 0 auto;
        width: auto;
        min-width: 142px;
      }

      .main { padding: 14px; }
    }

    @media (max-width: 680px) {
      .topbar { padding: 11px 12px; }
      .eyebrow { display: none; }
      h1 { font-size: 18px; }

      .concept-head {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .concept-formula {
        width: 100%;
        max-width: none;
      }

      .main {
        grid-template-rows: auto auto minmax(455px, 1fr) auto;
      }

      #stage,
      .stage-card {
        min-height: 455px;
      }

      .controlbar {
        grid-template-columns: 1fr;
      }

      .control-right { justify-content: flex-start; }
      input[type="range"] { width: 110px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Interactive graphical mathematics</p>
        <h1>Sets, Vectors &amp; Matrix Operations</h1>
      </div>

      <label class="search-wrap" aria-label="Search concepts">
        <input id="searchInput" type="search" placeholder="Search a definition or operation…" />
        <span class="search-icon">⌕</span>
      </label>

      <div class="top-actions">
        <button class="icon-btn" id="resetBtn" title="Reset current visual" aria-label="Reset current visual">↺</button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Concept navigation"></aside>

      <main class="main">
        <section class="concept-head">
          <div>
            <p class="concept-kicker" id="conceptKicker"></p>
            <h2 class="concept-title" id="conceptTitle"></h2>
          </div>
          <div class="concept-formula" id="conceptFormula"></div>
        </section>

        <div class="microcopy" id="microcopy"></div>

        <section class="stage-card">
          <div class="stage-badge" id="stageBadge">interactive diagram</div>
          <div class="step-indicator" id="stepIndicator">ready</div>
          <svg id="stage" viewBox="0 0 1000 570" role="img" aria-label="Interactive mathematical visualization"></svg>
          <div class="hover-note" id="hoverNote"></div>
        </section>

        <section class="controlbar">
          <div class="control-left" id="controls"></div>
          <div class="control-right">
            <div class="legend">
              <span class="legend-item"><span class="dot teal"></span> input / first object</span>
              <span class="legend-item"><span class="dot violet"></span> second object</span>
              <span class="legend-item"><span class="dot gold"></span> result</span>
              <span class="legend-item"><span class="dot red"></span> incompatibility</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const svg = document.getElementById("stage");
      const sidebar = document.getElementById("sidebar");
      const controls = document.getElementById("controls");
      const hoverNote = document.getElementById("hoverNote");
      const stageCard = document.querySelector(".stage-card");
      const stepIndicator = document.getElementById("stepIndicator");
      const NS = "http://www.w3.org/2000/svg";

      const groups = [
        {
          title: "Sets",
          items: [
            ["union", "∪", "Union"],
            ["intersection", "∩", "Intersection"],
            ["disjoint", "∅", "Disjoint sets"],
            ["relative-complement", "−", "Relative complement"],
            ["complement", "c", "Complement"],
            ["cartesian", "×", "Cartesian product"]
          ]
        },
        {
          title: "Euclidean spaces",
          items: [
            ["Rn", "ℝⁿ", "Euclidean space"],
            ["bounded", "M", "Bounded set"]
          ]
        },
        {
          title: "Matrices & vectors",
          items: [
            ["matrix", "A", "Matrix"],
            ["column-vector", "x", "Column vector"],
            ["row-vector", "x′", "Row vector"]
          ]
        },
        {
          title: "Operations",
          items: [
            ["addition", "+", "Matrix addition"],
            ["scalar", "λ", "Scalar multiplication"],
            ["zero", "0", "Zero and opposite"],
            ["product", "AB", "Matrix product"],
            ["laws", "≡", "Algebraic laws"],
            ["noncommute", "≠", "Noncommutativity"],
            ["premultiply", "⇤", "Pre / postmultiply"]
          ]
        }
      ];

      const concepts = {
        union: {
          group: "Sets",
          title: "Union",
          formula: "A\\cup B=\\{x:x\\in A\\ \\text{or}\\ x\\in B\\}",
          badge: "drag B to change the overlap",
          micro: "Everything covered by at least one set is selected.",
          draw: () => drawSetOperation("union")
        },
        intersection: {
          group: "Sets",
          title: "Intersection",
          formula: "A\\cap B=\\{x:x\\in A\\ \\text{and}\\ x\\in B\\}",
          badge: "drag B to change the common region",
          micro: "Only points simultaneously inside A and B remain.",
          draw: () => drawSetOperation("intersection")
        },
        disjoint: {
          group: "Sets",
          title: "Disjoint sets",
          formula: "A\\cap B=\\varnothing",
          badge: "drag B until the sets separate",
          micro: "The intersection is empty exactly when the two regions do not overlap.",
          draw: () => drawSetOperation("disjoint")
        },
        "relative-complement": {
          group: "Sets",
          title: "Relative complement",
          formula: "B-A=\\{x:x\\in B,\\ x\\notin A\\}",
          badge: "keep B and cut away A",
          micro: "The selected region belongs to B but not to A.",
          draw: () => drawSetOperation("relative")
        },
        complement: {
          group: "Sets",
          title: "Complement",
          formula: "A^{c}=S-A",
          badge: "drag A inside the universe S",
          micro: "Everything in the universe S that is outside A belongs to Aᶜ.",
          draw: drawComplement
        },
        cartesian: {
          group: "Sets",
          title: "Cartesian product",
          formula: "A\\times B=\\{(a,b):a\\in A,\\ b\\in B\\}",
          badge: "click a pair in the grid",
          micro: "Each ordered pair chooses one element from A and one from B.",
          draw: drawCartesian
        },
        Rn: {
          group: "Euclidean spaces",
          title: "Euclidean space",
          formula: "\\mathbb{R}^{n}=\\underbrace{\\mathbb{R}\\times\\cdots\\times\\mathbb{R}}_{n\\text{ times}}",
          badge: "drag the point",
          micro: "A coordinate tuple is visualized as one geometric point.",
          draw: drawRn
        },
        bounded: {
          group: "Euclidean spaces",
          title: "Bounded set",
          formula: "\\exists M>0:\\ |x|\\le M\\quad\\forall x\\in S",
          badge: "change M or regenerate S",
          micro: "A bounded set fits inside a finite interval [−M,M].",
          draw: drawBounded
        },
        matrix: {
          group: "Matrices & vectors",
          title: "Matrix",
          formula: "A=(a_{ij})\\in\\mathbb{R}^{m\\times n}",
          badge: "hover or click any entry",
          micro: "The first index identifies the row; the second identifies the column.",
          draw: drawMatrixDefinition
        },
        "column-vector": {
          group: "Matrices & vectors",
          title: "Column vector",
          formula: "x\\in\\mathbb{R}^{m\\times 1}\\cong\\mathbb{R}^{m}",
          badge: "drag the geometric vector",
          micro: "A vertical list of components represents one point or directed displacement.",
          draw: drawColumnVector
        },
        "row-vector": {
          group: "Matrices & vectors",
          title: "Row vector",
          formula: "x'\\in\\mathbb{R}^{1\\times n}",
          badge: "click a component",
          micro: "A row vector has one row and n columns.",
          draw: drawRowVector
        },
        addition: {
          group: "Operations",
          title: "Matrix addition",
          formula: "A+B=(a_{ij}+b_{ij})",
          badge: "click a result cell or press play",
          micro: "Only entries occupying the same position are added.",
          draw: drawAddition
        },
        scalar: {
          group: "Operations",
          title: "Scalar multiplication",
          formula: "\\lambda A=(\\lambda a_{ij})",
          badge: "move the λ slider",
          micro: "The same scalar stretches, shrinks, flips, or annihilates every entry.",
          draw: drawScalar
        },
        zero: {
          group: "Operations",
          title: "Zero matrix and opposite",
          formula: "A+(-A)=0",
          badge: "animate cancellation",
          micro: "Each entry meets its additive opposite and becomes zero.",
          draw: drawZero
        },
        product: {
          group: "Operations",
          title: "Matrix multiplication",
          formula: "(AB)_{ik}=\\sum_{j=1}^{n}a_{ij}b_{jk}",
          badge: "click an output cell or animate the dot product",
          micro: "Each output entry is a row of A dotted with a column of B.",
          draw: drawProduct
        },
        laws: {
          group: "Operations",
          title: "Algebraic laws",
          formula: "(AB)C=A(BC),\\qquad A(B+C)=AB+AC",
          badge: "switch laws and animate the paths",
          micro: "Different valid calculation paths lead to the same matrix.",
          draw: drawLaws
        },
        noncommute: {
          group: "Operations",
          title: "Noncommutativity",
          formula: "AB\\ne BA\\quad\\text{in general}",
          badge: "swap order and compare",
          micro: "Changing the order changes the transformation, the dimensions, or both.",
          draw: drawNoncommute
        },
        premultiply: {
          group: "Operations",
          title: "Premultiplication & postmultiplication",
          formula: "BA\\quad\\text{versus}\\quad AC",
          badge: "toggle left and right action",
          micro: "Left multiplication acts on rows/output coordinates; right multiplication acts on columns/input coordinates.",
          draw: drawPrePost
        }
      };

      let active = "union";
      let localState = {};
      let timers = [];

      buildSidebar();
      installDefs();
      selectConcept(active);

      document.getElementById("searchInput").addEventListener("input", event => {
        const q = event.target.value.trim().toLowerCase();
        document.querySelectorAll(".nav-btn").forEach(btn => {
          btn.classList.toggle("hidden", q && !btn.dataset.search.includes(q));
        });
      });

      function buildSidebar() {
        sidebar.innerHTML = "";
        groups.forEach(group => {
          const h = document.createElement("div");
          h.className = "group-title";
          h.textContent = group.title;
          sidebar.appendChild(h);

          group.items.forEach(([id, icon, label]) => {
            const btn = document.createElement("button");
            btn.className = "nav-btn";
            btn.dataset.id = id;
            btn.dataset.search = `${group.title} ${label} ${id}`.toLowerCase();
            btn.innerHTML = `
              <span class="nav-icon">${icon}</span>
              <span class="nav-label">${label}</span>
              <span class="nav-arrow">›</span>
            `;
            btn.addEventListener("click", () => selectConcept(id));
            sidebar.appendChild(btn);
          });
        });
      }

      function selectConcept(id) {
        stopTimers();
        active = id;
        localState = {};
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));

        const c = concepts[id];
        document.getElementById("conceptKicker").textContent = c.group;
        document.getElementById("conceptTitle").textContent = c.title;
        document.getElementById("stageBadge").textContent = c.badge;
        document.getElementById("microcopy").textContent = c.micro;
        stepIndicator.textContent = "ready";

        const formulaBox = document.getElementById("conceptFormula");
        formulaBox.innerHTML = "";
        renderKatex(c.formula, formulaBox, false);

        clearStage();
        controls.innerHTML = "";
        c.draw();
      }

      function clearStage() {
        [...svg.children].forEach(child => {
          if (child.tagName.toLowerCase() !== "defs") child.remove();
        });
        hideTooltip();
      }

      function resetCurrent() {
        selectConcept(active);
      }

      document.getElementById("resetBtn").addEventListener("click", resetCurrent);

      const root = document.documentElement;
      const saved = localStorage.getItem("visual-atlas-theme-v2");
      root.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

      document.getElementById("themeBtn").addEventListener("click", () => {
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("visual-atlas-theme-v2", root.dataset.theme);
      });

      function stopTimers() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      function later(fn, delay) {
        const id = setTimeout(fn, delay);
        timers.push(id);
        return id;
      }

      function installDefs() {
        const defs = el("defs");

        [
          ["arrow", "var(--slate)"],
          ["arrowTeal", "var(--teal)"],
          ["arrowViolet", "var(--violet)"],
          ["arrowGold", "var(--gold)"]
        ].forEach(([id, fill]) => {
          const marker = el("marker", {
            id,
            viewBox: "0 -5 10 10",
            refX: 8,
            refY: 0,
            markerWidth: 6,
            markerHeight: 6,
            orient: "auto"
          });
          marker.appendChild(el("path", { d: "M0,-4 L9,0 L0,4 Z", fill }));
          defs.appendChild(marker);
        });

        svg.appendChild(defs);
      }

      function el(tag, attrs = {}, textValue = null) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
        if (textValue !== null) node.textContent = textValue;
        return node;
      }

      function append(node) {
        svg.appendChild(node);
        return node;
      }

      function text(x, y, value, cls = "label", anchor = "middle", parent = svg) {
        const t = el("text", {
          x, y, class: cls,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, value);
        parent.appendChild(t);
        return t;
      }

      function line(x1, y1, x2, y2, cls = "arrow", parent = svg) {
        const l = el("line", { x1, y1, x2, y2, class: cls });
        parent.appendChild(l);
        return l;
      }

      function rect(x, y, w, h, attrs = {}, parent = svg) {
        const r = el("rect", { x, y, width: w, height: h, rx: 14, ...attrs });
        parent.appendChild(r);
        return r;
      }

      function circle(cx, cy, r, attrs = {}, parent = svg) {
        const c = el("circle", { cx, cy, r, ...attrs });
        parent.appendChild(c);
        return c;
      }

      function renderKatex(formula, target, displayMode = false) {
        if (window.katex) {
          katex.render(formula, target, { throwOnError: false, displayMode });
        } else {
          target.textContent = formula;
        }
      }

      function showTooltip(evt, content) {
        const r = stageCard.getBoundingClientRect();
        hoverNote.innerHTML = content;
        hoverNote.style.left = `${Math.min(r.width - 270, Math.max(12, evt.clientX - r.left + 12))}px`;
        hoverNote.style.top = `${Math.min(r.height - 80, Math.max(12, evt.clientY - r.top + 12))}px`;
        hoverNote.classList.add("show");
      }

      function hideTooltip() {
        hoverNote.classList.remove("show");
      }

      function makeButton(label, fn, className = "") {
        const b = document.createElement("button");
        b.className = `control-btn ${className}`.trim();
        b.textContent = label;
        b.addEventListener("click", fn);
        controls.appendChild(b);
        return b;
      }

      function makeSegment(options, initial, onChange) {
        const wrap = document.createElement("div");
        wrap.className = "segmented";

        options.forEach(opt => {
          const b = document.createElement("button");
          b.className = "seg-btn" + (opt.value === initial ? " active" : "");
          b.textContent = opt.label;
          b.addEventListener("click", () => {
            wrap.querySelectorAll(".seg-btn").forEach(x => x.classList.remove("active"));
            b.classList.add("active");
            onChange(opt.value);
          });
          wrap.appendChild(b);
        });

        controls.appendChild(wrap);
        return wrap;
      }

      function makeSlider(label, min, max, step, value, onInput) {
        const wrap = document.createElement("label");
        wrap.className = "slider-wrap";

        const span = document.createElement("span");
        span.textContent = label;

        const input = document.createElement("input");
        input.type = "range";
        input.min = min;
        input.max = max;
        input.step = step;
        input.value = value;

        const out = document.createElement("span");
        out.textContent = value;

        input.addEventListener("input", () => {
          out.textContent = input.value;
          onInput(Number(input.value));
        });

        wrap.append(span, input, out);
        controls.appendChild(wrap);
        return input;
      }

      function makeDrag(target, onMove) {
        let dragging = false;

        target.classList.add("draggable");

        target.addEventListener("pointerdown", evt => {
          dragging = true;
          target.setPointerCapture(evt.pointerId);
          evt.preventDefault();
        });

        target.addEventListener("pointermove", evt => {
          if (!dragging) return;
          const p = svgPoint(evt);
          onMove(p.x, p.y);
        });

        const end = evt => {
          dragging = false;
          try { target.releasePointerCapture(evt.pointerId); } catch {}
        };

        target.addEventListener("pointerup", end);
        target.addEventListener("pointercancel", end);
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function setAttr(node, attrs) {
        Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v));
      }

      function clamp(v,min,max) {
        return Math.max(min, Math.min(max,v));
      }

      function textOrReplace(id,x,y,value,cls="big-label") {
        let t = svg.querySelector(`#${id}`);
        if (!t) {
          t = text(x,y,value,cls);
          t.id = id;
        } else {
          t.textContent = value;
        }
        return t;
      }

      function drawSetOperation(mode) {
        localState.bx = localState.bx ?? (mode === "disjoint" ? 745 : 590);
        localState.by = localState.by ?? 285;
        const A = {x:405,y:285,r:150};
        const B = {x:localState.bx,y:localState.by,r:150};

        const g = append(el("g", { class: "fade-in" }));
        const clipAId = `clipA-${Date.now()}`;
        const clipA = el("clipPath", { id: clipAId });
        clipA.appendChild(el("circle", { cx:A.x, cy:A.y, r:A.r }));
        svg.querySelector("defs").appendChild(clipA);

        if (mode === "union") {
          circle(A.x,A.y,A.r,{
            fill:"color-mix(in srgb, var(--teal) 28%, transparent)",
            class:"set-outline teal-stroke"
          },g);
          circle(B.x,B.y,B.r,{
            fill:"color-mix(in srgb, var(--violet) 28%, transparent)",
            class:"set-outline violet-stroke draggable"
          },g);
        } else if (mode === "intersection") {
          circle(A.x,A.y,A.r,{class:"set-outline teal-stroke"},g);
          circle(B.x,B.y,B.r,{class:"set-outline violet-stroke draggable"},g);
          circle(B.x,B.y,B.r,{
            fill:"var(--gold)",
            opacity:".56",
            "clip-path":`url(#${clipAId})`
          },g);
        } else if (mode === "relative") {
          circle(A.x,A.y,A.r,{class:"set-outline teal-stroke"},g);
          circle(B.x,B.y,B.r,{
            fill:"color-mix(in srgb, var(--gold) 42%, transparent)",
            class:"set-outline violet-stroke draggable"
          },g);
          circle(B.x,B.y,B.r,{
            fill:"var(--panel)",
            opacity:".97",
            "clip-path":`url(#${clipAId})`
          },g);
          circle(A.x,A.y,A.r,{fill:"none",class:"set-outline teal-stroke"},g);
          circle(B.x,B.y,B.r,{fill:"none",class:"set-outline violet-stroke draggable"},g);
        } else {
          circle(A.x,A.y,A.r,{
            fill:"color-mix(in srgb, var(--teal) 20%, transparent)",
            class:"set-outline teal-stroke"
          },g);
          circle(B.x,B.y,B.r,{
            fill:"color-mix(in srgb, var(--violet) 20%, transparent)",
            class:"set-outline violet-stroke draggable"
          },g);
        }

        text(A.x-72,A.y-96,"A","big-label","middle",g);
        const labelB = text(B.x+72,B.y-96,"B","big-label","middle",g);

        const dragTargets = [...g.querySelectorAll(".draggable")];
        dragTargets.forEach(target => makeDrag(target, (x,y) => {
          localState.bx = clamp(x,180,820);
          localState.by = clamp(y,170,390);
          clearStage();
          controls.innerHTML = "";
          drawSetOperation(mode);
        }));

        const distance = Math.hypot(B.x-A.x,B.y-A.y);
        const relation =
          distance > A.r+B.r ? "no overlap" :
          distance < Math.abs(A.r-B.r) ? "one set inside the other" :
          "partial overlap";

        text(500,485,relation,"big-label");
        text(500,525,
          mode === "union" ? "Shading follows every point covered by A or B." :
          mode === "intersection" ? "The gold lens is the shared region A ∩ B." :
          mode === "relative" ? "Gold remains only where B lies outside A." :
          distance >= A.r+B.r ? "A ∩ B = ∅" : "Move B farther away until A ∩ B = ∅",
          "label"
        );

        stepIndicator.textContent = relation;
        makeButton("Center overlap", () => {
          localState.bx = 590; localState.by = 285;
          clearStage(); controls.innerHTML = ""; drawSetOperation(mode);
        });
        makeButton("Separate sets", () => {
          localState.bx = 745; localState.by = 285;
          clearStage(); controls.innerHTML = ""; drawSetOperation(mode);
        });
      }

      function drawComplement() {
        localState.ax = localState.ax ?? 500;
        localState.ay = localState.ay ?? 285;

        rect(190,80,620,400,{
          fill:"color-mix(in srgb, var(--gold) 29%, transparent)",
          stroke:"var(--slate)",
          "stroke-width":2
        });

        const A = circle(localState.ax,localState.ay,125,{
          fill:"var(--panel)",
          stroke:"var(--teal)",
          "stroke-width":2.6,
          class:"draggable"
        });

        text(225,115,"S","big-label","start");
        text(localState.ax,localState.ay,"A","big-label");
        text(500,515,"The gold region is Aᶜ = S − A","label");

        makeDrag(A,(x,y)=>{
          localState.ax = clamp(x,325,675);
          localState.ay = clamp(y,205,355);
          clearStage(); controls.innerHTML = ""; drawComplement();
        });

        stepIndicator.textContent = "outside A, inside S";
      }

      function drawCartesian() {
        const A = ["a₁","a₂","a₃"];
        const B = ["b₁","b₂","b₃","b₄"];
        localState.pair = localState.pair || [0,0];

        text(150,95,"A","big-label");
        text(850,95,"B","big-label");

        const aBoxes = [];
        const bBoxes = [];

        A.forEach((a,i)=>{
          const r=rect(95,145+i*95,110,54,{class:"matrix-cell teal clickable"});
          text(150,172+i*95,a,"cell-value");
          aBoxes.push(r);
        });

        B.forEach((b,j)=>{
          const r=rect(795,120+j*80,110,54,{class:"matrix-cell violet clickable"});
          text(850,147+j*80,b,"cell-value");
          bBoxes.push(r);
        });

        const gridX=340,gridY=125,cw=80,ch=80;
        B.forEach((b,j)=>text(gridX+34+j*cw,95,b,"small-label"));
        A.forEach((a,i)=>text(gridX-28,gridY+31+i*ch,a,"small-label"));

        const cells=[];
        A.forEach((a,i)=>{
          B.forEach((b,j)=>{
            const r=rect(gridX+j*cw,gridY+i*ch,70,62,{
              class:"matrix-cell gold clickable"
            });
            text(gridX+35+j*cw,gridY+31+i*ch,`(${a},${b})`,"small-label");
            cells.push({r,i,j});
            r.addEventListener("click",()=>{
              localState.pair=[i,j];
              clearStage();controls.innerHTML="";drawCartesian();
            });
            r.addEventListener("mousemove",e=>showTooltip(e,`First coordinate: <strong>${a}</strong><br>Second coordinate: <strong>${b}</strong>`));
            r.addEventListener("mouseleave",hideTooltip);
          });
        });

        const [i,j]=localState.pair;
        aBoxes[i].classList.add("active");
        bBoxes[j].classList.add("active");
        const selected=cells.find(c=>c.i===i&&c.j===j);
        selected.r.classList.add("active");

        line(205,172+i*95,gridX+j*cw,gridY+31+i*ch,"arrow-teal").classList.add("draw-in");
        line(795,147+j*80,gridX+j*cw+70,gridY+31+i*ch,"arrow-violet").classList.add("draw-in");
        text(500,510,`Selected pair: (${A[i]}, ${B[j]})`,"big-label");

        stepIndicator.textContent = `${i+1}, ${j+1}`;
        makeButton("Next pair",()=>{
          const next=(i*B.length+j+1)%(A.length*B.length);
          localState.pair=[Math.floor(next/B.length),next%B.length];
          clearStage();controls.innerHTML="";drawCartesian();
        },"primary");
      }

      function drawRn() {
        localState.dimension = localState.dimension || 2;
        makeSegment([
          {label:"ℝ²",value:2},
          {label:"ℝ³",value:3}
        ],localState.dimension,value=>{
          localState.dimension=value;
          clearStage();controls.innerHTML="";drawRn();
        });

        if(localState.dimension===2) drawR2();
        else drawR3();
      }

      function drawR2() {
        localState.px = localState.px ?? 660;
        localState.py = localState.py ?? 215;

        line(150,380,850,380,"axis");
        line(500,500,500,80,"axis");
        text(865,380,"x₁","label","start");
        text(500,60,"x₂","label");

        const px=clamp(localState.px,180,820);
        const py=clamp(localState.py,110,470);
        line(500,py,px,py,"guide");
        line(px,380,px,py,"guide");
        line(500,380,px,py,"arrow-teal").classList.add("draw-in");
        const p=circle(px,py,10,{fill:"var(--gold)",class:"draggable pulse"});
        text(px+18,py-20,`(${coordX(px)}, ${coordY(py)})`,"label","start");
        text(500,520,"Drag the gold point; the tuple changes continuously.","label");

        makeDrag(p,(x,y)=>{
          localState.px=clamp(x,180,820);
          localState.py=clamp(y,110,470);
          clearStage();controls.innerHTML="";drawRn();
        });

        stepIndicator.textContent=`(${coordX(px)}, ${coordY(py)})`;
      }

      function coordX(px){ return ((px-500)/80).toFixed(1).replace(".0",""); }
      function coordY(py){ return ((380-py)/80).toFixed(1).replace(".0",""); }

      function drawR3() {
        localState.p3x = localState.p3x ?? 675;
        localState.p3y = localState.p3y ?? 215;
        const O={x:465,y:385};

      function drawMatrix(data,x,y,options={}) {
        const rows=data.length;
        const cols=data[0].length;
        const cw=options.cw||74;
        const ch=options.ch||58;
        const klass=options.klass||"";
        const cells=[];
        const g=append(el("g",{class:options.animate===false?"":"fade-in"}));

        data.forEach((row,i)=>{
          row.forEach((value,j)=>{
            const cell=el("rect",{
              x:x+j*cw,
              y:y+i*ch,
              width:cw-6,
              height:ch-6,
              rx:10,
              class:`matrix-cell ${klass} ${options.clickable?"clickable":""}`
            });
            g.appendChild(cell);

            const t=el("text",{
              x:x+j*cw+(cw-6)/2,
              y:y+i*ch+(ch-6)/2,
              class:"cell-value"
            },value);
            g.appendChild(t);

            cells.push({cell,text:t,row:i,col:j,x:x+j*cw,y:y+i*ch});
          });
        });

        const h=rows*ch-6;
        const w=cols*cw-6;

        g.appendChild(el("path",{
          d:`M${x-16},${y} q-10,0 -10,10 v${h-20} q0,10 10,10`,
          fill:"none",stroke:"var(--ink)","stroke-width":2
        }));

        g.appendChild(el("path",{
          d:`M${x+w+16},${y} q10,0 10,10 v${h-20} q0,10 -10,10`,
          fill:"none",stroke:"var(--ink)","stroke-width":2
        }));

        return {g,cells,w,h,cw,ch,rows,cols,x,y};
      }

        text(735,120,"AB₂×₂","big-label");

        const [ri,cj]=localState.cell;
        highlightProductCell(mA,mB,mC,A,B,C,ri,cj,localState.term);

        mC.cells.forEach(c=>{
          c.cell.addEventListener("click",()=>{
            localState.cell=[c.row,c.col];
            localState.term=-1;
            clearStage();controls.innerHTML="";drawProduct();
          });
        });

        makeButton("Animate dot product",()=>playProductTerms(A,B),"primary");
        makeButton("Next output cell",()=>{
          const next=(ri*2+cj+1)%4;
          localState.cell=[Math.floor(next/2),next%2];
          localState.term=-1;
          clearStage();controls.innerHTML="";drawProduct();
        });

        stepIndicator.textContent=localState.term<0?`output (${ri+1},${cj+1})`:`term ${localState.term+1} / 3`;
      }

      function highlightProductCell(mA,mB,mC,A,B,C,i,k,term) {
        mA.cells.forEach(c=>{
          if(c.row===i)c.cell.classList.add("teal");
        });
        mB.cells.forEach(c=>{
          if(c.col===k)c.cell.classList.add("violet");
        });

        const out=mC.cells.find(c=>c.row===i&&c.col===k);
        out.cell.classList.add("active","gold");

        if(term>=0){
          const a=mA.cells.find(c=>c.row===i&&c.col===term);
          const b=mB.cells.find(c=>c.row===term&&c.col===k);
          a.cell.classList.add("active");
          b.cell.classList.add("active");
        }

        const terms=A[i].map((v,j)=>`${v}·${B[j][k]}`);
        const expression=term<0
          ? `${terms.join(" + ")} = ${C[i][k]}`
          : `${terms.slice(0,term+1).join(" + ")}${term<2?" + …":""}`;

        text(500,440,expression,"big-label");
        text(500,497,"The shared index j runs across the row and down the column.","label");
      }

      function playProductTerms(A,B) {
        stopTimers();
        [0,1,2].forEach((term,index)=>{
          later(()=>{
            localState.term=term;
            clearStage();controls.innerHTML="";drawProduct();
            stepIndicator.textContent=`term ${term+1} / 3`;
          },index*850);
        });
        later(()=>{
          localState.term=-1;
          clearStage();controls.innerHTML="";drawProduct();
          stepIndicator.textContent="sum complete";
        },2700);
      }

      function multiply(A,B) {
        return A.map(row=>B[0].map((_,k)=>row.reduce((s,v,j)=>s+v*B[j][k],0)));
      }

          line(245,265,415,265,"arrow-violet").classList.add("draw-in");

          text(500,405,"B acts from the left.","big-label");
          text(500,465,"The row/output dimension changes from m to p.","label");
          stepIndicator.textContent="left action";
        } else {
          nodeBox(95,215,150,100,"Aₘ×ₙ","teal");
          nodeBox(415,215,150,100,"Cₙ×q","violet");
          nodeBox(735,215,165,100,"ACₘ×q","gold");
          line(245,265,415,265,"arrow-teal").classList.add("draw-in");
          line(565,265,735,265,"arrow-violet").classList.add("draw-in");
          text(500,405,"C acts from the right.","big-label");
          text(500,465,"The column/input dimension changes from n to q.","label");
          stepIndicator.textContent="right action";
        }
      }

      function formatNum(v) {
        const rounded=Math.round(v*100)/100;
        return Number.isInteger(rounded)?String(rounded):String(rounded);
      }
    });
  </script>
