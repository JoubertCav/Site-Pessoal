<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambiente formal e timing — Brock–Mirman</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root{
      --bg:#f3f2ed;
      --panel:#fffefa;
      --soft:#f7f6f1;
      --text:#17212b;
      --muted:#68727e;
      --line:#deded6;
      --blue:#2563eb;
      --teal:#0f9f95;
      --violet:#7c3aed;
      --rose:#d95672;
      --amber:#b66c0a;
      --green:#18794e;
      --shadow:0 12px 32px rgba(25,32,42,.07);
      --radius:18px;
      --sidebar:318px;
    }

    body.dark{
      --bg:#0e151b;
      --panel:#151e27;
      --soft:#1a2630;
      --text:#eef3f6;
      --muted:#a9b5bf;
      --line:#30404c;
      --blue:#79a9ff;
      --teal:#55d5c9;
      --violet:#b49aff;
      --rose:#ff8da4;
      --amber:#f1bb62;
      --green:#69d59d;
      --shadow:0 16px 38px rgba(0,0,0,.27);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.47;
      transition:background .2s,color .2s;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}

    .app{
      max-width:1520px;
      margin:auto;
      padding:18px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:45px;
      height:45px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border-radius:14px;
      color:#fff;
      font-weight:900;
      background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    h1{
      margin:0;
      font-size:clamp(1.25rem,2vw,1.95rem);
      line-height:1.08;
    }

    .subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.91rem;
    }

    .header-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:1px solid var(--line);
      border-radius:11px;
      padding:8px 11px;
      background:var(--soft);
      color:var(--text);
      font-weight:740;
    }

    .btn:hover{border-color:var(--blue)}
    .btn.primary{
      border-color:transparent;
      background:var(--blue);
      color:#fff;
    }

    .topic-nav{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:9px;
      margin:14px 0 16px;
    }

    .topic-btn{
      min-height:69px;
      padding:10px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
      color:var(--text);
      text-align:left;
      box-shadow:var(--shadow);
      transition:transform .16s,border-color .16s,background .16s;
    }

    .topic-btn:hover{
      transform:translateY(-1px);
      border-color:var(--blue);
    }

    .topic-btn.active{
      color:#fff;
      border-color:transparent;
      background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    .topic-btn strong{
      display:block;
      font-size:.89rem;
    }

    .topic-btn span{
      display:block;
      margin-top:2px;
      font-size:.72rem;
      opacity:.8;
    }

    .layout{
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    aside{
      position:sticky;
      top:18px;
      max-height:calc(100vh - 36px);
      overflow:auto;
      padding:16px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .sidebar-title{
      margin:0 0 3px;
      font-size:1rem;
    }

    .sidebar-subtitle{
      margin:0 0 14px;
      color:var(--muted);
      font-size:.81rem;
    }

    .control{
      padding:0 0 13px;
      margin:0 0 13px;
      border-bottom:1px solid var(--line);
    }

    .control:last-child{
      margin-bottom:0;
      border-bottom:0;
    }

    .control-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:baseline;
      font-size:.87rem;
      font-weight:760;
    }

    .control output{
      color:var(--blue);
      font-variant-numeric:tabular-nums;
    }

    .control small{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:.75rem;
    }

    input[type=range]{
      width:100%;
      margin-top:9px;
      accent-color:var(--blue);
    }

    select{
      width:100%;
      margin-top:8px;
      padding:9px 10px;
      color:var(--text);
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:10px;
    }

    .preset-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:8px;
    }

    .preset{
      padding:7px 8px;
      border:1px solid var(--line);
      border-radius:9px;
      color:var(--text);
      background:var(--soft);
      font-size:.75rem;
      font-weight:700;
    }

    .preset:hover{
      color:var(--teal);
      border-color:var(--teal);
    }

    main{
      display:grid;
      gap:16px;
      min-width:0;
    }

    .card{
      min-width:0;
      padding:18px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }

    .eyebrow{
      margin-bottom:4px;
      color:var(--teal);
      font-size:.69rem;
      font-weight:850;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h2{
      margin:0;
      font-size:1.1rem;
    }

    h3{
      margin:0;
      font-size:.96rem;
    }

    p{margin:9px 0}
    .muted{color:var(--muted)}

    .hero{
      display:grid;
      grid-template-columns:minmax(0,1.28fr) minmax(280px,.72fr);
      gap:16px;
    }

    .formula-box,
    .math-line,
    .equation{
      position:relative;
      isolation:isolate;
      overflow:auto;
      border:1px solid color-mix(in srgb,var(--line) 72%,var(--blue));
      background:
        radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--blue) 8%,transparent),transparent 42%),
        linear-gradient(145deg,var(--soft),color-mix(in srgb,var(--panel) 82%,var(--soft)));
      box-shadow:
        inset 0 1px 0 color-mix(in srgb,#fff 55%,transparent),
        0 8px 24px rgba(24,33,43,.035);
    }

    .formula-box::before,
    .math-line::before{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:0;
      height:2px;
      border-radius:0 0 999px 999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--teal),transparent);
      opacity:.65;
    }

    .formula-box{
      display:grid;
      place-items:center;
      min-height:126px;
      margin-top:13px;
      padding:22px 20px;
      border-radius:14px;
      font-size:clamp(1rem,1.8vw,1.38rem);
    }

    .math-line{
      margin:10px 0;
      padding:16px 18px;
      border-radius:11px;
      color:var(--text);
    }

    .equation{
      min-height:70px;
      display:grid;
      place-items:center;
      padding:14px;
      border-radius:12px;
      text-align:center;
    }

    .formula-box .katex-display,
    .math-line .katex-display,
    .equation .katex-display{
      width:100%;
      margin:0;
      overflow-x:auto;
      overflow-y:hidden;
      padding:2px 0;
    }

    .formula-box .katex{font-size:1.14em}
    .math-line .katex{font-size:1.02em}
    .equation .katex{font-size:1em}
    [data-display="false"] .katex{
      color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1em;
    }

    .insight{
      padding:13px;
      border-left:4px solid var(--teal);
      border-radius:11px;
      background:var(--soft);
      font-size:.86rem;
    }

    .insight + .insight{margin-top:9px}
    .insight.warn{border-left-color:var(--amber)}
    .insight.bad{border-left-color:var(--rose)}

    .metrics{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .metric{
      padding:13px;
      border:1px solid var(--line);
      border-radius:13px;
      background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 72%,var(--panel)));
      box-shadow:var(--shadow);
    }

    .metric-label{
      color:var(--muted);
      font-size:.71rem;
      font-weight:760;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .metric-value{
      margin-top:4px;
      color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1.16rem;
      font-weight:850;
      font-variant-numeric:tabular-nums;
      overflow-wrap:anywhere;
    }

    .chart-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .chart-card{
      overflow:hidden;
      padding-bottom:12px;
    }

    .chart{
      width:100%;
      height:355px;
      overflow:hidden;
      border:1px solid color-mix(in srgb,var(--line) 82%,var(--blue));
      border-radius:15px;
      background:
        radial-gradient(circle at 12% 4%,color-mix(in srgb,var(--blue) 7%,transparent),transparent 36%),
        linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,var(--soft)),var(--panel));
    }

    .chart.tall{height:410px}

    .chart-note{
      display:flex;
      align-items:flex-start;
      gap:7px;
      margin:8px 0 0;
      padding:0 2px;
      color:var(--muted);
      font-size:.76rem;
      line-height:1.42;
    }

    .chart-note::before{
      content:"";
      width:7px;
      height:7px;
      flex:0 0 auto;
      margin-top:.37em;
      border-radius:50%;
      background:var(--teal);
    }

    .topic-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:13px;
    }

    .topic-box{
      padding:13px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--soft);
    }

    .topic-box strong{
      display:block;
      color:var(--blue);
      font-size:.82rem;
    }

    .topic-box p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:.8rem;
    }

    .equation-strip{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:9px;
      margin-top:13px;
    }

    details{
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--soft);
    }

    details + details{margin-top:9px}

    details[open]{
      border-color:color-mix(in srgb,var(--line) 65%,var(--blue));
      box-shadow:0 8px 20px rgba(25,32,42,.035);
    }

    summary{
      padding:12px 14px;
      cursor:pointer;
      font-weight:780;
    }

    summary::marker{color:var(--blue)}

    .details-body{
      padding:0 14px 14px;
      color:var(--muted);
      font-size:.87rem;
    }

    .timeline{
      display:grid;
      grid-template-columns:repeat(7,minmax(112px,1fr));
      align-items:center;
      gap:8px;
      margin-top:14px;
      overflow:auto;
      padding:5px 2px 10px;
    }

    .time-node{
      min-height:92px;
      display:grid;
      place-items:center;
      padding:11px;
      border:1px solid var(--line);
      border-radius:13px;
      background:var(--soft);
      text-align:center;
      transition:transform .2s,border-color .2s,box-shadow .2s;
    }

    .time-node.active{
      transform:translateY(-3px);
      border-color:var(--blue);
      box-shadow:0 10px 24px color-mix(in srgb,var(--blue) 13%,transparent);
    }

    .time-node strong{
      display:block;
      color:var(--blue);
      font-size:.79rem;
    }

    .time-node span{
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:.72rem;
    }

    .time-arrow{
      color:var(--muted);
      font-weight:900;
      text-align:center;
    }

    .transport{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:6px 9px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--soft);
      font-size:.76rem;
      font-weight:780;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
    }

    .dot.bad{background:var(--rose)}

    .compare-table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      font-size:.82rem;
    }

    .compare-table th,
    .compare-table td{
      padding:9px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
    }

    .compare-table th{
      color:var(--muted);
      font-size:.71rem;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .hidden{display:none!important}

    footer{
      padding:8px 4px 2px;
      color:var(--muted);
      text-align:center;
      font-size:.8rem;
    }

    @media(max-width:1180px){
      .topic-nav{grid-template-columns:repeat(3,1fr)}
      .layout{grid-template-columns:280px minmax(0,1fr)}
      .hero,.chart-grid{grid-template-columns:1fr}
      .topic-grid,.equation-strip{grid-template-columns:1fr}
      .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(max-width:780px){
      .app{padding:10px}
      header{
        align-items:flex-start;
        flex-direction:column;
      }
      .topic-nav{grid-template-columns:1fr 1fr}
      .layout{grid-template-columns:1fr}
      aside{
        position:static;
        max-height:none;
      }
    }

    @media(max-width:500px){
      .topic-nav,.metrics{grid-template-columns:1fr}
      .preset-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">t</div>
      <div>
        <h1>Ambiente formal e timing</h1>
        <p class="subtitle">Tempo discreto, preferências descontadas, tecnologia, viabilidade e sequência das decisões</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="themeBtn">◐ Tema</button>
      <button class="btn" id="resetBtn">Reiniciar tópico</button>
    </div>
  </header>

  <nav class="topic-nav" aria-label="Escolha do laboratório">
    <button class="topic-btn active" data-mode="time">
      <strong>Tempo e horizonte</strong>
      <span>Datas discretas, horizonte finito ou infinito e estacionariedade</span>
    </button>
    <button class="topic-btn" data-mode="preferences">
      <strong>Preferências descontadas</strong>
      <span>Pesos, consumo positivo e soma intertemporal</span>
    </button>
    <button class="topic-btn" data-mode="technology">
      <strong>Tecnologia</strong>
      <span>Monotonicidade, concavidade, Inada e limite sustentável</span>
    </button>
    <button class="topic-btn" data-mode="timing">
      <strong>Viabilidade e timing</strong>
      <span>Capital herdado, produção, alocação e capital seguinte</span>
    </button>
    <button class="topic-btn" data-mode="plans">
      <strong>Planos viáveis</strong>
      <span>Conjunto Π(k₀), compacidade por estágio e cota uniforme</span>
    </button>
  </nav>

  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];

  const defaults = {
    time:{beta:.95,horizonType:"infinite",T:20,current:5},
    preferences:{beta:.95,T:35,c0:1.4,pattern:"constant",g:.02},
    technology:{A:1,alpha:.36,kMax:12,kRef:2.5},
    timing:{A:1,alpha:.36,delta:1,k:2,share:.35,horizon:18,speed:700,step:0,playing:false,timer:null},
    plans:{A:1,alpha:.36,k0:.4,horizon:22,paths:9,minShare:.12,maxShare:.88,seed:7}
  };

  const state = {
    mode:"time",
    time:{...defaults.time},
    preferences:{...defaults.preferences},
    technology:{...defaults.technology},
    timing:{...defaults.timing},
    plans:{...defaults.plans}
  };

  const KATEX_OPTIONS={
    throwOnError:false,
    strict:"ignore",
    trust:false
  };

  const plotConfig={
    responsive:true,
    displaylogo:false,
    scrollZoom:true,
    toImageButtonOptions:{format:"png",filename:"ambiente_formal",scale:2},
    modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d","toggleSpikelines"]
  };

  function fmt(value,digits=3){
    if(!Number.isFinite(value)) return "—";
    if(Math.abs(value)>=1e5 || (Math.abs(value)>0 && Math.abs(value)<1e-4)){
      return value.toExponential(2).replace(".",",");
    }
    return value.toLocaleString("pt-BR",{
      maximumFractionDigits:digits,
      minimumFractionDigits:0
    });
  }

  function pct(value,digits=1){
    return `${fmt(100*value,digits)}%`;
  }

  function linspace(a,b,n){
    return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  }

  function tex(element,expression,display=true){
    if(!element) return;
    const prepared=display ? `\\displaystyle ${expression}` : expression;
    if(window.katex){
      katex.render(prepared,element,{...KATEX_OPTIONS,displayMode:display});
    }else{
      element.textContent=expression;
    }
  }

  function renderAllMath(root=document){
    if(!window.katex) return;
    $$("[data-tex]",root).forEach(element=>{
      const display=element.dataset.display!=="false";
      const expression=display ? `\\displaystyle ${element.dataset.tex}` : element.dataset.tex;
      katex.render(expression,element,{...KATEX_OPTIONS,displayMode:display});
    });
  }

  function chartTheme(){
    const dark=document.body.classList.contains("dark");
    return {
      dark,
      text:dark?"#a9b5bf":"#68727e",
      strong:dark?"#eef3f6":"#17212b",
      grid:dark?"rgba(74,94,108,.32)":"rgba(190,193,188,.42)",
      axis:dark?"#40515f":"#c8c9c2",
      panel:dark?"#151e27":"#fffefa",
      blue:dark?"#79a9ff":"#2563eb",
      teal:dark?"#55d5c9":"#0f9f95",
      violet:dark?"#b49aff":"#7c3aed",
      rose:dark?"#ff8da4":"#d95672",
      amber:dark?"#f1bb62":"#b66c0a",
      green:dark?"#69d59d":"#18794e"
    };
  }

  function rgba(hex,alpha){
    const value=hex.replace("#","");
    const full=value.length===3?value.split("").map(c=>c+c).join(""):value;
    const n=parseInt(full,16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
  }

  function plotLayout(xTitle,yTitle,extra={}){
    const theme=chartTheme();
    const axis={
      showline:true,
      linewidth:1,
      linecolor:theme.axis,
      ticks:"outside",
      ticklen:5,
      tickcolor:theme.axis,
      tickfont:{size:11,color:theme.text},
      gridcolor:theme.grid,
      griddash:"dot",
      zeroline:true,
      zerolinecolor:theme.axis,
      automargin:true,
      title:{font:{size:12,color:theme.text},standoff:12}
    };

    return {
      margin:{l:68,r:30,t:28,b:68},
      paper_bgcolor:"rgba(0,0,0,0)",
      plot_bgcolor:"rgba(0,0,0,0)",
      font:{family:"Inter, system-ui, sans-serif",color:theme.text,size:12},
      colorway:[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green],
      xaxis:{...axis,title:{text:xTitle,font:{size:12,color:theme.text},standoff:12}},
      yaxis:{...axis,title:{text:yTitle,font:{size:12,color:theme.text},standoff:12}},
      hovermode:"x unified",
      hoverlabel:{
        bgcolor:theme.panel,
        bordercolor:theme.axis,
        font:{family:"Inter, system-ui, sans-serif",size:12,color:theme.strong}
      },
      legend:{
        orientation:"h",
        y:-.25,
        x:0,
        xanchor:"left",
        font:{size:11,color:theme.text},
        bgcolor:"rgba(0,0,0,0)"
      },
      transition:{duration:300,easing:"cubic-in-out"},
      dragmode:"pan",
      ...extra
    };
  }

  function polishTraces(traces){
    const theme=chartTheme();
    const colors=[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green];

    return traces.map((trace,index)=>{
      const color=trace.line?.color || trace.marker?.color || colors[index%colors.length];
      const polished={...trace};
      const isScatter=(trace.type||"scatter")==="scatter";
      const mode=trace.mode||"lines";

      if(isScatter && mode.includes("lines")){
        polished.line={
          width:index===0?3.3:2.4,
          shape:"spline",
          smoothing:.5,
          ...trace.line,
          color
        };
      }

      if(isScatter && mode.includes("markers")){
        polished.marker={
          size:trace.marker?.size||5,
          color,
          line:{width:1.3,color:theme.panel},
          ...trace.marker
        };
      }

      if(trace.fill){
        polished.fillcolor=trace.fillcolor||rgba(color,.10);
      }

      polished.hovertemplate=trace.hovertemplate||
        `<b>${trace.name||"Série"}</b><br>x: %{x:.4g}<br>y: %{y:.4g}<extra></extra>`;

      return polished;
    });
  }

  function prettyPlot(id,traces,layout){
    return Plotly.react(id,polishTraces(traces),layout,plotConfig);
  }

  function slider(id,label,value,min,max,step,help,symbol=""){

        <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">
        <small>${help}</small>

  function metric(label,id){
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value" id="${id}">—</div></div>`;
  }

  function bindRange(id,object,key,callback){
    const input=$("#"+id);
    if(!input) return;

    const run=()=>{
      object[key]=Number(input.value);
      const out=$("#"+id+"Out");
      if(out) out.textContent=fmt(object[key],key==="T"||key==="horizon"||key==="paths"||key==="current"||key==="seed"?0:3);
      callback();
    };

    input.addEventListener("input",run);
    input.addEventListener("change",run);
  }

  function updateTime(){
    const s=state.time;
    const finite=s.horizonType==="finite";

    const weights=dates.map(t=>Math.pow(s.beta,t));

    weights.forEach(weight=>{
      total+=weight;
      cumulative.push(total);
    });

    $("#timeHeroTitle").textContent=finite
      ?"Tempo discreto com data terminal"
      :"Tempo discreto e horizonte infinito";

    tex(
      $("#timeFormula"),

        ? String.raw`t=0,1,\ldots,T`
        : String.raw`t=0,1,2,\ldots`
    );

    $("#timeHeroText").textContent=finite
      ?"A economia termina em T. O tempo remanescente altera o problema enfrentado em cada data."
      :"Não existe data terminal. Com primitivas estacionárias, a descrição do ambiente é a mesma em todas as datas.";

    $("#terminalInsight").innerHTML=finite
      ?"<strong>Data terminal:</strong> a proximidade de T torna o problema explicitamente dependente do tempo."

        line:{color:rgba(theme.rose,.48),width:1.3,dash:"dot"}
      }]
    }));

    const limit=1/(1-s.beta);

    prettyPlot("timeMassChart",[
      {
        x:dates,
        y:cumulative,
        type:"scatter",
        mode:"lines+markers",
        name:"Soma parcial",
        fill:"tozeroy",

  function preferenceSequence(){
    const s=state.preferences;
    const values=[];

    for(let t=0;t<=s.T;t++){
      let c=s.c0;

      if(s.pattern==="growth"){
        c=s.c0*Math.pow(1+s.g,t);
      }

      if(s.pattern==="decline"){
        c=s.c0*Math.pow(Math.max(.001,1-s.g),t);
      }

      if(s.pattern==="oscillation"){
        const amplitude=Math.min(.78,s.g*8);
        c=s.c0*(1+amplitude*Math.sin(2*Math.PI*t/10));
      }

      values.push(Math.max(1e-8,c));
    }

    return values;
  }

  function updatePreferences(){
    const s=state.preferences;
    const dates=Array.from({length:s.T+1},(_,i)=>i);
    const consumption=preferenceSequence();
    const weights=dates.map(t=>Math.pow(s.beta,t));
    const contribution=consumption.map((c,t)=>weights[t]*Math.log(c));
    const cumulative=[];
    let sum=0;

    contribution.forEach(value=>{
      sum+=value;
      cumulative.push(sum);
    });

    $("#prefUT").textContent=fmt(cumulative.at(-1),4);
    $("#prefTail").textContent=fmt(weights.at(-1),6);
    $("#prefMinC").textContent=fmt(Math.min(...consumption),4);

    const largestIndex=contribution
      .map(Math.abs)
      .reduce((best,value,index,array)=>value>array[best]?index:best,0);

    $("#prefLargest").textContent=`t = ${largestIndex}`;

    const theme=chartTheme();

    prettyPlot("prefConsumptionChart",[
      {

    ],plotLayout("Data, t","Consumo, cₜ"));

    prettyPlot("prefContributionChart",[
      {

    ],plotLayout("Última data incluída","Utilidade parcial"));

  function production(k,A,alpha){
    return A*Math.pow(k,alpha);
  }

  function mpk(k,A,alpha){
    return alpha*A*Math.pow(k,alpha-1);
  }

  function secondDerivative(k,A,alpha){
    return alpha*(alpha-1)*A*Math.pow(k,alpha-2);
  }

  function sustainableCapital(A,alpha){
    return Math.pow(A,1/(1-alpha));
  }

  function timingResources(){
    const s=state.timing;
    const output=production(s.k,s.A,s.alpha);
    const residual=(1-s.delta)*s.k;
    const total=output+residual;
    const nextK=s.share*total;
    const consumption=(1-s.share)*total;
    return {output,residual,total,nextK,consumption};
  }

  function updateTimingTimeline(){
    const s=state.timing;
    const data=timingResources();
    const steps=[
      {
        title:"1. Estado herdado",
        text:`kₜ = ${fmt(s.k,3)}`
      },
      {
        title:"2. Produção",
        text:`yₜ = ${fmt(data.output,3)}`
      },
      {
        title:"3. Alocação",
        text:`cₜ = ${fmt(data.consumption,3)}`
      },
      {
        title:"4. Próximo estado",
        text:`kₜ₊₁ = ${fmt(data.nextK,3)}`
      }
    ];

    $("#decisionTimeline").innerHTML=steps.map((step,index)=>{
      const arrow=index<steps.length-1?'<div class="time-arrow">→</div>':"";
      return `
        <div class="time-node ${index===s.step?"active":""}">
          <div>
            <strong>${step.title}</strong>
            <span>${step.text}</span>
          </div>
        </div>${arrow}`;
    }).join("");

    $("#timingStepBadge").textContent=`etapa ${s.step+1} de 4`;
  }

  function toggleTimingAnimation(){
    const s=state.timing;

    if(s.playing){
      stopTimingAnimation();
      return;
    }

    s.playing=true;
    $("#timingPlayBtn").textContent="⏸ Pausar";

    const tick=()=>{
      if(!s.playing) return;
      s.step=(s.step+1)%4;
      updateTimingTimeline();
      s.timer=setTimeout(tick,s.speed);
    };

    tick();
  }

  function stopTimingAnimation(){
    const s=state.timing;
    if(!s) return;
    s.playing=false;
    clearTimeout(s.timer);
    s.timer=null;
    const button=$("#timingPlayBtn");
    if(button) button.textContent="▶ Reproduzir";
  }

  function updateTiming(){
    const s=state.timing;
    const data=timingResources();

    tex(
      $("#timingResourceFormula"),
      s.delta===1
        ? String.raw`c_t+k_{t+1}\leq Ak_t^\alpha`
        : String.raw`c_t+k_{t+1}\leq Ak_t^\alpha+(1-\delta)k_t`
    );

    $("#timingOutput").textContent=fmt(data.output,4);
    $("#timingResidual").textContent=fmt(data.residual,4);
    $("#timingConsumption").textContent=fmt(data.consumption,4);
    $("#timingNextK").textContent=fmt(data.nextK,4);

    updateTimingTimeline();

    const theme=chartTheme();
    const frontierK=linspace(0,data.total,180);
    const frontierC=frontierK.map(value=>data.total-value);

    prettyPlot("timingFeasibleChart",[
      {
        x:frontierK,
        y:frontierC,
        type:"scatter",
        mode:"lines",
        name:"Fronteira",
        fill:"tozeroy",
        fillcolor:rgba(theme.blue,.10),
        line:{color:theme.blue}
      },
      {
        x:[data.nextK],
        y:[data.consumption],
        type:"scatter",
        mode:"markers",
        name:"Alocação ilustrativa",
        marker:{size:12,color:theme.rose},
        hovertemplate:"<b>Alocação</b><br>kₜ₊₁ = %{x:.4g}<br>cₜ = %{y:.4g}<extra></extra>"
      }
    ],plotLayout("Capital seguinte, kₜ₊₁","Consumo, cₜ",{
      hovermode:"closest",
      xaxis:{...plotLayout("","").xaxis,range:[0,data.total*1.05]},
      yaxis:{...plotLayout("","").yaxis,range:[0,data.total*1.05]},
      annotations:[{
        x:data.total*.5,
        y:data.total*.18,
        text:"conjunto viável",
        showarrow:false,
        font:{color:theme.blue,size:12}
      }]
    }));

    prettyPlot("timingAllocationChart",[
      {
        x:["Origem dos recursos","Usos escolhidos"],
        y:[data.output,data.consumption],
        type:"bar",
        name:"Produção / consumo",
        marker:{color:theme.blue},
        hovertemplate:"<b>%{x}</b><br>%{y:.4g}<extra></extra>"
      },
      {
        x:["Origem dos recursos","Usos escolhidos"],
        y:[data.residual,data.nextK],
        type:"bar",
        name:"Capital residual / capital seguinte",
        marker:{color:theme.teal},
        hovertemplate:"<b>%{x}</b><br>%{y:.4g}<extra></extra>"
      }
    ],plotLayout("Decomposição","Quantidade",{
      barmode:"stack",
      hovermode:"closest",
      bargap:.42
    }));

    const periods=Array.from({length:s.horizon+1},(_,i)=>i);
    const capital=[s.k];
    const consumption=[];

    for(let t=0;t<s.horizon;t++){
      const resources=production(capital[t],s.A,s.alpha)+(1-s.delta)*capital[t];
      consumption.push((1-s.share)*resources);
      capital.push(s.share*resources);
    }

    const lastResources=production(capital.at(-1),s.A,s.alpha)+(1-s.delta)*capital.at(-1);
    consumption.push((1-s.share)*lastResources);

    prettyPlot("timingPathChart",[
      {
        x:periods,
        y:capital,
        type:"scatter",
        mode:"lines+markers",
        name:"Capital",
        marker:{size:4,color:theme.blue},
        line:{color:theme.blue}
      },
      {
        x:periods,
        y:consumption,
        type:"scatter",
        mode:"lines+markers",
        name:"Consumo",
        marker:{size:4,color:theme.violet},
        line:{color:theme.violet}
      }
    ],plotLayout("Data, t","Nível"));
  }

  /* ============================================================
     5. PLANOS VIÁVEIS
  ============================================================ */

  function renderPlans(){
    const s=state.plans;

    $("#sidebar").innerHTML=String.raw`
      <h2 class="sidebar-title">Planos viáveis</h2>
      <p class="sidebar-subtitle">Gere trajetórias que respeitam a restrição em todas as datas e compare-as com a cota uniforme.</p>

      ${slider("plansA","Produtividade",s.A,.4,2.2,.05,"Determina produto e capital sustentável.","A")}
      ${slider("plansAlpha","Elasticidade",s.alpha,.08,.92,.01,"Com α < 1, a cota sustentável é finita.","\\alpha")}
      ${slider("plansK0","Capital inicial",s.k0,.02,10,.02,"Estado exógeno a partir do qual Π(k₀) é definido.","k_0")}
      ${slider("plansHorizon","Horizonte exibido",s.horizon,6,45,1,"Cada trajetória representa uma truncagem gráfica.","T")}
      ${slider("plansPaths","Número de trajetórias",s.paths,3,18,1,"Amostras ilustrativas do conjunto viável.","N")}
      ${slider("plansMinShare","Fração mínima investida",s.minShare,.02,.7,.01,"Limite inferior das regras aleatórias.","s_{\min}")}
      ${slider("plansMaxShare","Fração máxima investida",s.maxShare,.3,.98,.01,"Limite superior das regras aleatórias.","s_{\max}")}
      ${slider("plansSeed","Semente",s.seed,1,50,1,"Muda a amostra sem alterar o conjunto teórico.","")}

      <div class="control">
        <div class="control-head"><span>Presets</span></div>
        <div class="preset-grid">
          <button class="preset" data-plans-preset="below">k₀ abaixo da cota</button>
          <button class="preset" data-plans-preset="above">k₀ acima da cota</button>
          <button class="preset" data-plans-preset="wide">Escolhas dispersas</button>
          <button class="preset" data-plans-preset="narrow">Escolhas próximas</button>
        </div>
      </div>`;

    $("#content").innerHTML=String.raw`
      <section class="hero">
        <article class="card">
          <div class="eyebrow">Definição</div>
          <h2>Conjunto de planos viáveis a partir de k₀</h2>
          <div class="formula-box" data-tex="\Pi(k_0)=\left\{\{c_t,k_{t+1}\}_{t=0}^{\infty}: c_t\geq0,\ k_{t+1}\geq0,\ c_t+k_{t+1}\leq Ak_t^\alpha\right\}"></div>
          <p class="muted">Cada elemento de Π(k₀) é uma sequência inteira, não apenas uma escolha de um período.</p>
        </article>

        <article class="card">
          <div class="eyebrow">Duas propriedades</div>
          <div class="insight"><strong>Por estágio:</strong> dado kₜ, o conjunto de pares (cₜ,kₜ₊₁) é fechado e limitado.</div>
          <div class="insight"><strong>Ao longo do tempo:</strong> toda trajetória possui uma cota uniforme de capital.</div>
          <div class="insight warn"><strong>Importância:</strong> essas propriedades sustentam resultados de existência posteriores.</div>
        </article>
      </section>

      <section class="metrics">
        ${metric("Capital sustentável","plansKHat")}
        ${metric("Cota uniforme","plansBound")}
        ${metric("Maior capital simulado","plansMaxK")}
        ${metric("Maior violação","plansViolation")}
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Amostra de Π(k₀)</div>
          <h2>Trajetórias viáveis de capital</h2>
          <div id="plansPathsChart" class="chart tall"></div>
          <p class="chart-note">As linhas são planos viáveis distintos; a faixa superior é a cota teórica.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Envelope máximo</div>
          <h2>Trajetória de investimento total</h2>
          <div id="plansEnvelopeChart" class="chart tall"></div>
          <p class="chart-note">Como kₜ₊₁ ≤ F(kₜ), a trajetória de investimento total fornece um envelope natural.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Correspondência factível</div>
          <h2>Intervalo possível para kₜ₊₁</h2>
          <div id="plansCorrespondenceChart" class="chart"></div>
          <p class="chart-note">Com δ = 1, o capital seguinte pertence ao intervalo fechado [0,F(kₜ)].</p>
        </article>

        <article class="card">
          <div class="eyebrow">Compacidade por estágio</div>
          <h2>Por que o máximo de um período está bem definido?</h2>
          <div class="formula-box" data-tex="\Gamma(k)=\{(c,k')\in\mathbb{R}_+^2:c+k'\leq Ak^\alpha\}"></div>
          <div class="topic-grid">
            <div class="topic-box"><strong>Fechado</strong><p>É definido por desigualdades fracas e não negatividade.</p></div>
            <div class="topic-box"><strong>Limitado</strong><p>Ambas as escolhas são menores ou iguais a Ak^α.</p></div>
            <div class="topic-box"><strong>Compacto</strong><p>Em dimensão finita, fechado e limitado implica compacidade.</p></div>
          </div>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Cota uniforme</div>
        <h2>Construção do limite para toda a trajetória</h2>
        <div class="equation-strip">
          <div class="equation" data-tex="\widehat{k}=A^{1/(1-\alpha)}"></div>
          <div class="equation" data-tex="k_{t+1}\leq Ak_t^\alpha"></div>
          <div class="equation" data-tex="k_t\leq\bar{k}:=\max\{k_0,\widehat{k}\}"></div>
        </div>
        <details open>
          <summary>Se k₀ está abaixo de k̂</summary>
          <div class="details-body">A função F é crescente e F(k̂)=k̂. Logo, kₜ≤k̂ implica kₜ₊₁≤F(kₜ)≤F(k̂)=k̂.</div>
        </details>
        <details>
          <summary>Se k₀ está acima de k̂</summary>
          <div class="details-body">Para k&gt;k̂, vale F(k)&lt;k. Assim, mesmo a trajetória de investimento total cai; qualquer outra trajetória investe menos e também permanece abaixo de k₀.</div>
        </details>
        <div class="insight bad" style="margin-top:12px"><strong>Nuance:</strong> compacidade por estágio não é o mesmo que compacidade automática do espaço infinito de sequências. A análise dinâmica exige especificar a topologia e usar resultados apropriados.</div>
      </section>

      <footer>As trajetórias simuladas ilustram o conjunto viável; nenhuma delas é rotulada como ótima.</footer>`;

    renderAllMath();

    bindRange("plansA",s,"A",updatePlans);
    bindRange("plansAlpha",s,"alpha",updatePlans);
    bindRange("plansK0",s,"k0",updatePlans);
    bindRange("plansHorizon",s,"horizon",updatePlans);
    bindRange("plansPaths",s,"paths",updatePlans);
    bindRange("plansMinShare",s,"minShare",()=>{
      s.minShare=Math.min(s.minShare,s.maxShare-.01);
      updatePlans();
    });
    bindRange("plansMaxShare",s,"maxShare",()=>{
      s.maxShare=Math.max(s.maxShare,s.minShare+.01);
      updatePlans();
    });
    bindRange("plansSeed",s,"seed",updatePlans);

    $$("[data-plans-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.plansPreset;
        const kHat=sustainableCapital(s.A,s.alpha);

        if(preset==="below") Object.assign(s,{k0:.25*kHat,minShare:.12,maxShare:.88,seed:7});
        if(preset==="above") Object.assign(s,{k0:2.2*kHat,minShare:.12,maxShare:.88,seed:7});
        if(preset==="wide") Object.assign(s,{minShare:.03,maxShare:.97,seed:13});
        if(preset==="narrow") Object.assign(s,{minShare:.42,maxShare:.58,seed:19});

        renderPlans();
      });
    });

    updatePlans();
  }

  function seededRandom(seed){
    let value=seed%2147483647;
    if(value<=0) value+=2147483646;

    return ()=>{
      value=value*16807%2147483647;
      return (value-1)/2147483646;
    };
  }

  function generateFeasiblePaths(){
    const s=state.plans;
    const random=seededRandom(Math.round(s.seed));
    const all=[];

    for(let pathIndex=0;pathIndex<Math.round(s.paths);pathIndex++){
      const capital=[s.k0];
      const shares=[];
      const consumption=[];

      for(let t=0;t<s.horizon;t++){
        const raw=s.minShare+(s.maxShare-s.minShare)*random();
        const smooth=t===0?raw:.65*shares.at(-1)+.35*raw;
        const share=Math.min(.999,Math.max(.001,smooth));
        const resources=production(capital[t],s.A,s.alpha);
        shares.push(share);
        consumption.push((1-share)*resources);
        capital.push(share*resources);
      }

      all.push({capital,shares,consumption});
    }

    return all;
  }

  function updatePlans(){
    const s=state.plans;
    const kHat=sustainableCapital(s.A,s.alpha);
    const bound=Math.max(s.k0,kHat);
    const paths=generateFeasiblePaths();
    const periods=Array.from({length:s.horizon+1},(_,i)=>i);
    const maxSim=Math.max(...paths.flatMap(path=>path.capital));

    let maxViolation=0;
    paths.forEach(path=>{
      for(let t=0;t<path.capital.length-1;t++){
        const violation=path.capital[t+1]-production(path.capital[t],s.A,s.alpha);
        maxViolation=Math.max(maxViolation,violation);
      }
    });

    $("#plansKHat").textContent=fmt(kHat,4);
    $("#plansBound").textContent=fmt(bound,4);
    $("#plansMaxK").textContent=fmt(maxSim,4);
    $("#plansViolation").textContent=fmt(maxViolation,8);

    const theme=chartTheme();
    const pathTraces=paths.map((path,index)=>({
      x:periods,
      y:path.capital,
      type:"scatter",
      mode:"lines",
      name:`Plano ${index+1}`,
      line:{
        width:index===0?3:1.6,
        color:index===0?theme.blue:rgba(theme.blue,.23)
      },
      showlegend:index===0,
      hovertemplate:`<b>Plano ${index+1}</b><br>t = %{x}<br>kₜ = %{y:.4g}<extra></extra>`
    }));

    pathTraces.push({
      x:[0,s.horizon],
      y:[bound,bound],
      type:"scatter",
      mode:"lines",
      name:"Cota uniforme",
      line:{color:theme.rose,dash:"dash",width:2.2}
    });

    prettyPlot("plansPathsChart",pathTraces,plotLayout("Data, t","Capital, kₜ",{
      annotations:[{
        x:s.horizon,
        y:bound,
        text:"k̄",
        showarrow:false,
        xanchor:"right",
        yshift:10,
        font:{color:theme.rose,size:12}
      }]
    }));

    const envelope=[s.k0];
    for(let t=0;t<s.horizon;t++){
      envelope.push(production(envelope[t],s.A,s.alpha));
    }

    const highestPath=paths.reduce((best,path)=>{
      return Math.max(...path.capital)>Math.max(...best.capital)?path:best;
    },paths[0]);

    prettyPlot("plansEnvelopeChart",[
      {
        x:periods,
        y:envelope,
        type:"scatter",
        mode:"lines+markers",
        name:"Investimento total",
        fill:"tozeroy",
        fillcolor:rgba(theme.teal,.07),
        marker:{size:4,color:theme.teal},
        line:{color:theme.teal}
      },
      {
        x:periods,
        y:highestPath.capital,
        type:"scatter",
        mode:"lines+markers",
        name:"Maior plano amostrado",
        marker:{size:4,color:theme.blue},
        line:{color:theme.blue}
      },
      {
        x:[0,s.horizon],
        y:[kHat,kHat],
        type:"scatter",
        mode:"lines",
        name:"k̂",
        line:{color:theme.violet,dash:"dot"}
      }
    ],plotLayout("Data, t","Capital"));

    const kGrid=linspace(0,Math.max(bound*1.15,.5),260);
    const maxNext=kGrid.map(k=>production(k,s.A,s.alpha));

    prettyPlot("plansCorrespondenceChart",[
      {
        x:kGrid,
        y:maxNext,
        type:"scatter",
        mode:"lines",
        name:"Limite superior F(k)",
        fill:"tozeroy",
        fillcolor:rgba(theme.blue,.10),
        line:{color:theme.blue}
      },
      {
        x:[s.k0],
        y:[production(s.k0,s.A,s.alpha)],
        type:"scatter",
        mode:"markers",
        name:"F(k₀)",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Estado atual, k","Máximo capital seguinte",{
      annotations:[{
        x:kGrid[Math.floor(kGrid.length*.58)],
        y:maxNext[Math.floor(maxNext.length*.58)]*.35,
        text:"0 ≤ k′ ≤ F(k)",
        showarrow:false,
        font:{color:theme.blue,size:12}
      }]
    }));
  }

  function resetCurrent(){
    stopTimingAnimation();
    state[state.mode]={...defaults[state.mode]};
    renderMode();
  }

  $$(".topic-btn").forEach(button=>{
    button.addEventListener("click",()=>setMode(button.dataset.mode));
  });

  $("#themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    renderMode();
  });

  $("#resetBtn").addEventListener("click",resetCurrent);

  window.addEventListener("resize",()=>{
    $$(".chart").forEach(element=>{
      if(window.Plotly) Plotly.Plots.resize(element);
    });
  });

  document.addEventListener("DOMContentLoaded",renderMode);
  window.addEventListener("load",renderMode);
})();
</script>
</body>
</html>
