<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interpretação econômica da equação de Euler</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>

  <style>
    :root{
      --bg:#f3f2ed;--panel:#fffefa;--soft:#f7f6f1;--text:#17212b;--muted:#68727e;
      --line:#deded6;--blue:#2563eb;--teal:#0f9f95;--violet:#7c3aed;--rose:#d95672;
      --amber:#b66c0a;--green:#18794e;--shadow:0 12px 32px rgba(25,32,42,.07);
      --radius:18px;--sidebar:318px;
    }

    body.dark{
      --bg:#0e151b;--panel:#151e27;--soft:#1a2630;--text:#eef3f6;--muted:#a9b5bf;
      --line:#30404c;--blue:#79a9ff;--teal:#55d5c9;--violet:#b49aff;--rose:#ff8da4;
      --amber:#f1bb62;--green:#69d59d;--shadow:0 16px 38px rgba(0,0,0,.27);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.47;transition:background .2s,color .2s;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{max-width:1520px;margin:auto;padding:18px}

    header{
      display:flex;justify-content:space-between;align-items:center;gap:16px;
      padding:16px 18px;border:1px solid var(--line);border-radius:20px;
      background:var(--panel);box-shadow:var(--shadow);
    }

    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{
      width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto;border-radius:14px;
      color:#fff;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    h1{margin:0;font-size:clamp(1.25rem,2vw,1.95rem);line-height:1.08}
    .subtitle{margin:4px 0 0;color:var(--muted);font-size:.91rem}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}

    .btn{
      border:1px solid var(--line);border-radius:11px;padding:8px 11px;
      background:var(--soft);color:var(--text);font-weight:740;
    }

    .btn:hover{border-color:var(--blue)}
    .btn.primary{border-color:transparent;background:var(--blue);color:#fff}

    .topic-nav{
      display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0 16px;
    }

    .topic-btn{
      min-height:72px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;
      background:var(--panel);color:var(--text);text-align:left;box-shadow:var(--shadow);
      transition:transform .16s,border-color .16s,background .16s;
    }

    .topic-btn:hover{transform:translateY(-1px);border-color:var(--blue)}
    .topic-btn.active{
      color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--teal));
    }

    .topic-btn strong{display:block;font-size:.88rem}
    .topic-btn span{display:block;margin-top:2px;font-size:.71rem;opacity:.8}

    .layout{
      display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);gap:16px;align-items:start;
    }

    aside{
      position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;
      padding:16px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);box-shadow:var(--shadow);
    }

    .sidebar-title{margin:0 0 3px;font-size:1rem}
    .sidebar-subtitle{margin:0 0 14px;color:var(--muted);font-size:.81rem}

    .control{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid var(--line)}
    .control:last-child{margin-bottom:0;border-bottom:0}

    .control-head{
      display:flex;justify-content:space-between;gap:10px;align-items:baseline;
      font-size:.87rem;font-weight:760;
    }

    .control output{color:var(--blue);font-variant-numeric:tabular-nums}
    .control small{display:block;margin-top:4px;color:var(--muted);font-size:.75rem}
    .control-head [data-tex]{display:inline-flex;align-items:baseline;min-width:.75em;vertical-align:baseline}
    .control-head [data-tex] .katex{color:var(--blue);font-size:1.03em}
    input[type=range]{width:100%;margin-top:9px;accent-color:var(--blue)}

    select{
      width:100%;margin-top:8px;padding:9px 10px;color:var(--text);
      background:var(--soft);border:1px solid var(--line);border-radius:10px;
    }

    .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
    .preset{
      padding:7px 8px;border:1px solid var(--line);border-radius:9px;
      color:var(--text);background:var(--soft);font-size:.75rem;font-weight:700;
    }
    .preset:hover{color:var(--teal);border-color:var(--teal)}

    main{display:grid;gap:16px;min-width:0}

    .card{
      min-width:0;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);box-shadow:var(--shadow);
    }

    .eyebrow{
      margin-bottom:4px;color:var(--teal);font-size:.69rem;font-weight:850;
      letter-spacing:.12em;text-transform:uppercase;
    }

    h2{margin:0;font-size:1.1rem}
    h3{margin:0;font-size:.96rem}
    p{margin:9px 0}
    .muted{color:var(--muted)}

    .hero{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(280px,.72fr);gap:16px}

    .formula-box,.math-line,.equation{
      position:relative;isolation:isolate;overflow:auto;
      border:1px solid color-mix(in srgb,var(--line) 72%,var(--blue));
      background:
        radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--blue) 8%,transparent),transparent 42%),
        linear-gradient(145deg,var(--soft),color-mix(in srgb,var(--panel) 82%,var(--soft)));
      box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 55%,transparent),0 8px 24px rgba(24,33,43,.035);
    }

    .formula-box::before,.math-line::before{
      content:"";position:absolute;left:18px;right:18px;top:0;height:2px;
      border-radius:0 0 999px 999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--teal),transparent);opacity:.65;
    }

    .formula-box{
      display:grid;place-items:center;min-height:138px;margin-top:13px;padding:22px 20px;
      border-radius:14px;font-size:clamp(.94rem,1.62vw,1.28rem);
    }

    .math-line{margin:10px 0;padding:16px 18px;border-radius:11px;color:var(--text)}
    .equation{
      min-height:72px;display:grid;place-items:center;padding:14px;border-radius:12px;text-align:center;
    }

    .formula-box .katex-display,.math-line .katex-display,.equation .katex-display{
      width:100%;margin:0;overflow-x:auto;overflow-y:hidden;padding:2px 0;
    }

    .formula-box .katex{font-size:1.09em}
    .math-line .katex{font-size:1.02em}
    .equation .katex{font-size:1em}
    [data-display="false"] .katex{
      color:color-mix(in srgb,var(--text) 88%,var(--blue));font-size:1em;
    }

    .math-render-error{
      color:var(--rose);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:.9rem;white-space:pre-wrap;
    }

    .insight{
      padding:13px;border-left:4px solid var(--teal);border-radius:11px;
      background:var(--soft);font-size:.86rem;
    }
    .insight + .insight{margin-top:9px}
    .insight.warn{border-left-color:var(--amber)}
    .insight.bad{border-left-color:var(--rose)}

    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .metric{
      padding:13px;border:1px solid var(--line);border-radius:13px;
      background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--soft) 72%,var(--panel)));
      box-shadow:var(--shadow);
    }
    .metric-label{
      color:var(--muted);font-size:.71rem;font-weight:760;letter-spacing:.04em;text-transform:uppercase;
    }
    .metric-value{
      margin-top:4px;color:color-mix(in srgb,var(--text) 88%,var(--blue));
      font-size:1.16rem;font-weight:850;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
    }

    .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .chart-card{overflow:hidden;padding-bottom:12px}
    .chart{
      width:100%;height:360px;overflow:hidden;
      border:1px solid color-mix(in srgb,var(--line) 82%,var(--blue));border-radius:15px;
      background:
        radial-gradient(circle at 12% 4%,color-mix(in srgb,var(--blue) 7%,transparent),transparent 36%),
        linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,var(--soft)),var(--panel));
    }
    .chart.tall{height:420px}

    .chart-note{
      display:flex;align-items:flex-start;gap:7px;margin:8px 0 0;padding:0 2px;
      color:var(--muted);font-size:.76rem;line-height:1.42;
    }

    .chart-note::before{
      content:"";width:7px;height:7px;flex:0 0 auto;margin-top:.37em;
      border-radius:50%;background:var(--teal);
    }

    .topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}
    .topic-box{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--soft)}
    .topic-box strong{display:block;color:var(--blue);font-size:.82rem}
    .topic-box p{margin:6px 0 0;color:var(--muted);font-size:.8rem}

    .equation-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}

    .balance{
      display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:14px;
    }

    .margin-card{
      position:relative;min-height:190px;padding:18px;border:1px solid var(--line);
      border-radius:15px;background:var(--soft);overflow:hidden;
    }

    .margin-card::after{
      content:"";position:absolute;inset:auto 0 0;height:5px;background:var(--blue);
    }

    .margin-card.benefit::after{background:var(--teal)}
    .margin-card strong{display:block;color:var(--blue);font-size:.82rem}
    .margin-card.benefit strong{color:var(--teal)}
    .margin-card .big{
      margin-top:14px;font-size:1.65rem;font-weight:900;font-variant-numeric:tabular-nums;
    }
    .margin-card p{color:var(--muted);font-size:.8rem}
    .balance-sign{
      display:grid;place-items:center;padding:0 6px;font-size:2rem;font-weight:900;color:var(--muted);
    }

    .chain{
      display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:9px;align-items:center;margin-top:14px;
      overflow:auto;padding-bottom:6px;
    }

    .chain-node{
      min-height:120px;padding:14px;border:1px solid var(--line);border-radius:14px;
      background:var(--soft);display:grid;align-content:center;text-align:center;
    }

    .chain-node strong{display:block;color:var(--blue);font-size:.78rem}
    .chain-node p{margin:6px 0 0;color:var(--muted);font-size:.75rem}
    .chain-arrow{color:var(--teal);font-size:1.6rem;font-weight:900;text-align:center}

    .status{
      display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 12px;
      border:1px solid var(--line);border-radius:12px;background:var(--soft);
      font-size:.82rem;font-weight:730;
    }

    .status-dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:var(--green)}
    .status.bad .status-dot{background:var(--rose)}

    .compare-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.82rem}
    .compare-table th,.compare-table td{
      padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;
    }
    .compare-table th{
      color:var(--muted);font-size:.71rem;text-transform:uppercase;letter-spacing:.05em;
    }

    .hidden{display:none!important}
    footer{padding:8px 4px 2px;color:var(--muted);text-align:center;font-size:.8rem}

    @media(max-width:1180px){
      .topic-nav{grid-template-columns:repeat(3,1fr)}
      .layout{grid-template-columns:280px minmax(0,1fr)}
      .hero,.chart-grid{grid-template-columns:1fr}
      .topic-grid,.equation-strip{grid-template-columns:1fr}
      .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(max-width:800px){
      .app{padding:10px}
      header{align-items:flex-start;flex-direction:column}
      .topic-nav{grid-template-columns:1fr 1fr}
      .layout{grid-template-columns:1fr}
      aside{position:static;max-height:none}
      .balance{grid-template-columns:1fr}
      .balance-sign{transform:rotate(90deg)}
    }

    @media(max-width:500px){
      .topic-nav,.metrics{grid-template-columns:1fr}
      .preset-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">↔</div>
      <div>
        <h1>Interpretação econômica da equação de Euler</h1>
        <p class="subtitle">Trade-off intertemporal, custo marginal de poupar, benefício marginal de investir e suavização</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="themeBtn">◐ Tema</button>
      <button class="btn" id="resetBtn">Reiniciar tópico</button>
    </div>
  </header>

  <nav class="topic-nav" aria-label="Escolha do laboratório">
    <button class="topic-btn active" data-mode="arbitrage">
      <strong>Arbitragem intertemporal</strong>
      <span>Custo presente, benefício futuro e diagnóstico marginal</span>
    </button>
    <button class="topic-btn" data-mode="saving">
      <strong>Custo marginal de poupar</strong>
      <span>Perda de utilidade ao reduzir consumo hoje</span>
    </button>
    <button class="topic-btn" data-mode="investing">
      <strong>Benefício marginal de investir</strong>
      <span>Produto adicional, utilidade futura e desconto</span>
    </button>
    <button class="topic-btn" data-mode="vector">
      <strong>Perturbação vetorial</strong>
      <span>Direção factível e derivada direcional da utilidade</span>
    </button>
    <button class="topic-btn" data-mode="smoothing">
      <strong>Suavização do consumo</strong>
      <span>Crescimento, retorno, paciência e curvatura</span>
    </button>
  </nav>

  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="content"></main>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $=(selector,root=document)=>root.querySelector(selector);
  const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];

  const defaults={
    arbitrage:{beta:.95,A:1,alpha:.36,ct:.9,ctp1:1.05,kp:.45},
    saving:{ct:.9,epsilon:.08,maxEpsilon:.35},
    investing:{beta:.95,A:1,alpha:.36,ctp1:1.05,kp:.45,epsilon:.08},
    vector:{beta:.95,A:1,alpha:.36,ct:.9,ctp1:1.05,kp:.45,epsilon:.08},
    smoothing:{beta:.95,A:1,alpha:.36,sigma:1,delta:1,wedge:0,kp:.45,ct:.9}
  };

  const state={
    mode:"arbitrage",
    arbitrage:{...defaults.arbitrage},
    saving:{...defaults.saving},
    investing:{...defaults.investing},
    vector:{...defaults.vector},
    smoothing:{...defaults.smoothing}
  };

  const KOPT={throwOnError:false,strict:"ignore",trust:false};

  const MATH=Object.freeze({
    beta:String.raw`\beta`,
    A:String.raw`A`,
    alpha:String.raw`\alpha`,
    ct:String.raw`c_t`,
    ctp1:String.raw`c_{t+1}`,
    kp:String.raw`k_{t+1}`,
    epsilon:String.raw`\varepsilon`,
    sigma:String.raw`\sigma`,
    delta:String.raw`\delta`,
    tau:String.raw`\tau`
  });

  const plotConfig={
    responsive:true,displaylogo:false,scrollZoom:true,
    toImageButtonOptions:{format:"png",filename:"interpretacao_economica_euler",scale:2},
    modeBarButtonsToRemove:["lasso2d","select2d","autoScale2d","toggleSpikelines"]
  };

  function fmt(value,digits=3){
    if(!Number.isFinite(value)) return "—";
    if(Math.abs(value)>=1e5 || (Math.abs(value)>0 && Math.abs(value)<1e-4)){
      return value.toExponential(2).replace(".",",");
    }
    return value.toLocaleString("pt-BR",{maximumFractionDigits:digits,minimumFractionDigits:0});
  }

  function linspace(a,b,n){
    return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
  }

  function renderKatex(element,expression,display=true){
    if(!element) return;
    const source=String(expression??"");

    if(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(source)){
      console.error("Expressão KaTeX contém caractere de controle:",source);
      element.textContent=source;
      element.classList.add("math-render-error");
      return;
    }

    const prepared=display?String.raw`\displaystyle ${source}`:source;

    if(!window.katex){
      element.textContent=source;
      return;
    }

    try{
      katex.render(prepared,element,{...KOPT,displayMode:display,errorColor:"#d95672"});
      element.classList.remove("math-render-error");
    }catch(error){
      console.error("Erro KaTeX:",source,error);
      element.textContent=source;
      element.classList.add("math-render-error");
    }
  }

  function tex(element,expression,display=true){
    renderKatex(element,expression,display);
  }

  function renderAllMath(root=document){
    if(!window.katex) return;
    $$("[data-tex]",root).forEach(element=>{
      renderKatex(element,element.dataset.tex,element.dataset.display!=="false");
    });
  }

  function chartTheme(){
    const dark=document.body.classList.contains("dark");
    return {
      dark,
      text:dark?"#a9b5bf":"#68727e",
      strong:dark?"#eef3f6":"#17212b",
      grid:dark?"rgba(74,94,108,.32)":"rgba(190,193,188,.42)",
      axis:dark?"#40515f":"#c8c9c2",
      panel:dark?"#151e27":"#fffefa",
      blue:dark?"#79a9ff":"#2563eb",
      teal:dark?"#55d5c9":"#0f9f95",
      violet:dark?"#b49aff":"#7c3aed",
      rose:dark?"#ff8da4":"#d95672",
      amber:dark?"#f1bb62":"#b66c0a",
      green:dark?"#69d59d":"#18794e"
    };
  }

  function rgba(hex,alpha){
    const value=hex.replace("#","");
    const full=value.length===3?value.split("").map(char=>char+char).join(""):value;
    const number=parseInt(full,16);
    return `rgba(${(number>>16)&255},${(number>>8)&255},${number&255},${alpha})`;
  }

  function plotLayout(xTitle,yTitle,extra={}){
    const theme=chartTheme();
    const axis={
      showline:true,linewidth:1,linecolor:theme.axis,ticks:"outside",ticklen:5,tickcolor:theme.axis,
      tickfont:{size:11,color:theme.text},gridcolor:theme.grid,griddash:"dot",zeroline:true,
      zerolinecolor:theme.axis,automargin:true,title:{font:{size:12,color:theme.text},standoff:12}
    };

    return {
      margin:{l:68,r:30,t:28,b:68},
      paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",
      font:{family:"Inter, system-ui, sans-serif",color:theme.text,size:12},
      colorway:[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green],
      xaxis:{...axis,title:{text:xTitle,font:{size:12,color:theme.text},standoff:12}},
      yaxis:{...axis,title:{text:yTitle,font:{size:12,color:theme.text},standoff:12}},
      hovermode:"x unified",
      hoverlabel:{bgcolor:theme.panel,bordercolor:theme.axis,font:{family:"Inter, system-ui, sans-serif",size:12,color:theme.strong}},
      legend:{orientation:"h",y:-.25,x:0,xanchor:"left",font:{size:11,color:theme.text},bgcolor:"rgba(0,0,0,0)"},
      transition:{duration:280,easing:"cubic-in-out"},dragmode:"pan",
      ...extra
    };
  }

  function polishTraces(traces){
    const theme=chartTheme();
    const colors=[theme.blue,theme.violet,theme.teal,theme.rose,theme.amber,theme.green];

    return traces.map((trace,index)=>{
      const color=trace.line?.color||trace.marker?.color||colors[index%colors.length];
      const polished={...trace};
      const isScatter=(trace.type||"scatter")==="scatter";
      const mode=trace.mode||"lines";

      if(isScatter&&mode.includes("lines")){
        polished.line={width:index===0?3.3:2.4,shape:"spline",smoothing:.5,...trace.line,color};
      }

      if(isScatter&&mode.includes("markers")){
        polished.marker={size:trace.marker?.size||5,color,line:{width:1.3,color:theme.panel},...trace.marker};
      }

      if(trace.fill){
        polished.fillcolor=trace.fillcolor||rgba(color,.10);
      }

      polished.hovertemplate=trace.hovertemplate||
        `<b>${trace.name||"Série"}</b><br>x: %{x:.4g}<br>y: %{y:.4g}<extra></extra>`;

      return polished;
    });
  }

  function prettyPlot(id,traces,layout){
    return Plotly.react(id,polishTraces(traces),layout,plotConfig);
  }

  function slider(id,label,value,min,max,step,help,symbol=""){
    return String.raw`
      <div class="control">
        <div class="control-head">
          <span>${label}${symbol?` <span data-tex="${symbol}" data-display="false"></span>`:""}</span>
          <output id="${id}Out">${fmt(value,3)}</output>
        </div>
        <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}">
        <small>${help}</small>
      </div>`;
  }

  function metric(label,id){
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value" id="${id}">—</div></div>`;
  }

  function bindRange(id,object,key,callback){
    const input=$("#"+id);
    if(!input) return;

    const run=()=>{
      object[key]=Number(input.value);
      const output=$("#"+id+"Out");
      if(output) output.textContent=fmt(object[key],3);
      callback();
    };

    input.addEventListener("input",run);
    input.addEventListener("change",run);
  }

  function utility(c,sigma=1){
    const safe=Math.max(c,1e-10);
    return Math.abs(sigma-1)<1e-9?Math.log(safe):(Math.pow(safe,1-sigma)-1)/(1-sigma);
  }

  function marginalUtility(c,sigma=1){
    return Math.pow(Math.max(c,1e-10),-sigma);
  }

  function production(k,A,alpha){
    return A*Math.pow(Math.max(k,0),alpha);
  }

  function mpk(k,A,alpha){
    return alpha*A*Math.pow(Math.max(k,1e-10),alpha-1);
  }

  function updateArbitrage(){
    const s=state.arbitrage;
    const cost=1/s.ct;
    const benefit=s.beta*(1/s.ctp1)*mpk(s.kp,s.A,s.alpha);
    const net=benefit-cost;
    const implied=s.ct*s.beta*mpk(s.kp,s.A,s.alpha);
    const tolerance=.015*Math.max(1,Math.abs(cost),Math.abs(benefit));
    const balanced=Math.abs(net)<=tolerance;

    $("#arbCost").textContent=fmt(cost,5);
    $("#arbBenefit").textContent=fmt(benefit,5);
    $("#arbNet").textContent=fmt(net,6);
    $("#arbImplied").textContent=fmt(implied,4);
    $("#arbCostBig").textContent=fmt(cost,4);
    $("#arbBenefitBig").textContent=fmt(benefit,4);

    let sign="=";
    let text="As margens estão aproximadamente equilibradas.";

    if(net>tolerance){
      sign="<";
      text="O benefício marginal excede o custo: há incentivo para poupar e investir mais.";
    }else if(net<-tolerance){
      sign=">";
      text="O custo marginal excede o benefício: há incentivo para consumir mais hoje.";
    }

    $("#arbSign").textContent=sign;
    $("#arbStatus").classList.toggle("bad",!balanced);
    $("#arbStatusText").textContent=text;

    const theme=chartTheme();

    prettyPlot("arbBarsChart",[
      {
        x:["Custo de poupar","Benefício de investir"],
        y:[cost,benefit],
        type:"bar",
        name:"Margens",
        marker:{color:[theme.rose,theme.teal]},
        text:[fmt(cost,3),fmt(benefit,3)],
        textposition:"outside",
        cliponaxis:false
      }
    ],plotLayout("Margem","Utilidade marginal",{
      hovermode:"closest",bargap:.5
    }));

    const kGrid=linspace(.02,2.5,300);
    const benefitGrid=kGrid.map(k=>s.beta*(1/s.ctp1)*mpk(k,s.A,s.alpha));

    prettyPlot("arbReturnChart",[
      {
        x:kGrid,y:benefitGrid,type:"scatter",mode:"lines",name:"Benefício marginal",
        fill:"tozeroy",fillcolor:rgba(theme.teal,.07),line:{color:theme.teal}
      },
      {
        x:[.02,2.5],y:[cost,cost],type:"scatter",mode:"lines",name:"Custo marginal",
        line:{color:theme.rose,dash:"dash"}
      },
      {
        x:[s.kp],y:[benefit],type:"scatter",mode:"markers",name:"kₜ₊₁ atual",
        marker:{size:11,color:theme.blue}
      }
    ],plotLayout("Capital futuro, kₜ₊₁","Margem"));
  }

  function updateSaving(){
    const s=state.saving;
    s.epsilon=Math.min(s.epsilon,.92*s.ct);
    const mu=1/s.ct;
    const exact=Math.log(s.ct-s.epsilon)-Math.log(s.ct);
    const linear=-mu*s.epsilon;
    const error=exact-linear;

    $("#savMU").textContent=fmt(mu,5);
    $("#savExact").textContent=fmt(exact,6);
    $("#savLinear").textContent=fmt(linear,6);
    $("#savError").textContent=fmt(error,6);

    const theme=chartTheme();
    const cMin=Math.max(.03,s.ct-s.maxEpsilon*1.1);
    const cMax=s.ct+s.maxEpsilon*.45;
    const cGrid=linspace(cMin,cMax,280);
    const uGrid=cGrid.map(c=>Math.log(c));
    const tangent=cGrid.map(c=>Math.log(s.ct)+mu*(c-s.ct));

    prettyPlot("savUtilityChart",[
      {
        x:cGrid,y:uGrid,type:"scatter",mode:"lines",name:"ln c",
        line:{color:theme.blue}
      },
      {
        x:cGrid,y:tangent,type:"scatter",mode:"lines",name:"Tangente em cₜ",
        line:{color:theme.teal,dash:"dash"}
      },
      {
        x:[s.ct,s.ct-s.epsilon],
        y:[Math.log(s.ct),Math.log(s.ct-s.epsilon)],
        type:"scatter",mode:"markers",name:"Antes e depois",
        marker:{size:10,color:[theme.blue,theme.rose]}
      }
    ],plotLayout("Consumo atual, c","Utilidade"));

    const epsMax=Math.min(s.maxEpsilon,.92*s.ct);
    const epsGrid=linspace(0,epsMax,260);
    const exactLoss=epsGrid.map(eps=>Math.log(s.ct-eps)-Math.log(s.ct));
    const linearLoss=epsGrid.map(eps=>-mu*eps);

    prettyPlot("savLossChart",[
      {
        x:epsGrid,y:exactLoss,type:"scatter",mode:"lines",name:"Perda exata",
        fill:"tozeroy",fillcolor:rgba(theme.rose,.06),line:{color:theme.rose}
      },
      {
        x:epsGrid,y:linearLoss,type:"scatter",mode:"lines",name:"Aproximação marginal",
        line:{color:theme.teal,dash:"dash"}
      },
      {
        x:[s.epsilon],y:[exact],type:"scatter",mode:"markers",name:"ε atual",
        marker:{size:11,color:theme.blue}
      }
    ],plotLayout("Poupança adicional, ε","Variação da utilidade presente"));
  }

  function updateInvesting(){
    const s=state.investing;
    const productMarginal=mpk(s.kp,s.A,s.alpha);
    const deltaF=production(s.kp+s.epsilon,s.A,s.alpha)-production(s.kp,s.A,s.alpha);
    const exact=s.beta*(Math.log(s.ctp1+deltaF)-Math.log(s.ctp1));
    const linear=s.beta*(1/s.ctp1)*productMarginal*s.epsilon;

    $("#invMPK").textContent=fmt(productMarginal,5);
    $("#invDeltaF").textContent=fmt(deltaF,6);
    $("#invExact").textContent=fmt(exact,6);
    $("#invLinear").textContent=fmt(linear,6);

    const theme=chartTheme();
    const kMax=Math.max(2.5,s.kp+s.epsilon*2);
    const kGrid=linspace(.001,kMax,280);
    const fGrid=kGrid.map(k=>production(k,s.A,s.alpha));
    const tangent=kGrid.map(k=>production(s.kp,s.A,s.alpha)+productMarginal*(k-s.kp));

    prettyPlot("invProductionChart",[
      {
        x:kGrid,y:fGrid,type:"scatter",mode:"lines",name:"F(k)",
        fill:"tozeroy",fillcolor:rgba(theme.blue,.06),line:{color:theme.blue}
      },
      {
        x:kGrid,y:tangent,type:"scatter",mode:"lines",name:"Tangente",
        line:{color:theme.teal,dash:"dash"}
      },
      {
        x:[s.kp,s.kp+s.epsilon],
        y:[production(s.kp,s.A,s.alpha),production(s.kp+s.epsilon,s.A,s.alpha)],
        type:"scatter",mode:"markers",name:"Antes e depois",
        marker:{size:10,color:[theme.blue,theme.rose]}
      }
    ],plotLayout("Capital futuro, k","Produto"));

    const epsMax=Math.max(.35,s.epsilon*1.6);
    const epsGrid=linspace(0,epsMax,260);
    const exactGrid=epsGrid.map(eps=>{
      const dF=production(s.kp+eps,s.A,s.alpha)-production(s.kp,s.A,s.alpha);
      return s.beta*(Math.log(s.ctp1+dF)-Math.log(s.ctp1));
    });
    const linearGrid=epsGrid.map(eps=>s.beta*(1/s.ctp1)*productMarginal*eps);

    prettyPlot("invBenefitChart",[
      {
        x:epsGrid,y:exactGrid,type:"scatter",mode:"lines",name:"Benefício exato",
        fill:"tozeroy",fillcolor:rgba(theme.teal,.07),line:{color:theme.teal}
      },
      {
        x:epsGrid,y:linearGrid,type:"scatter",mode:"lines",name:"Aproximação marginal",
        line:{color:theme.violet,dash:"dash"}
      },
      {
        x:[s.epsilon],y:[exact],type:"scatter",mode:"markers",name:"ε atual",
        marker:{size:11,color:theme.rose}
      }
    ],plotLayout("Investimento adicional, ε","Benefício em valor presente"));
  }

  /* ============================================================
     4. PERTURBAÇÃO VETORIAL
  ============================================================ */

  function renderVector(){
    const s=state.vector;

    $("#sidebar").innerHTML=String.raw`
      <h2 class="sidebar-title">Perturbação vetorial</h2>
      <p class="sidebar-subtitle">Mova-se ao longo da fronteira factível e leia a Euler como derivada direcional nula.</p>

      ${slider("vecBeta","Fator de desconto",s.beta,.5,.995,.005,"Pondera a continuação.",MATH.beta)}
      ${slider("vecA","Produtividade",s.A,.4,2.2,.05,"Determina o retorno marginal.",MATH.A)}
      ${slider("vecAlpha","Elasticidade",s.alpha,.08,.92,.01,"Controla a curvatura tecnológica.",MATH.alpha)}
      ${slider("vecCt","Consumo atual",s.ct,.12,2.5,.02,"Coordenada vertical do ponto.",MATH.ct)}
      ${slider("vecCtp1","Consumo futuro",s.ctp1,.08,2.5,.02,"Determina o valor da continuação.",MATH.ctp1)}
      ${slider("vecKp","Capital futuro",s.kp,.05,2.5,.02,"Coordenada horizontal do ponto.",MATH.kp)}
      ${slider("vecEps","Tamanho do deslocamento",s.epsilon,.005,.25,.005,"Comprimento do vetor factível.",MATH.epsilon)}

      <div class="control">
        <div class="control-head"><span>Presets</span></div>
        <div class="preset-grid">
          <button class="preset" data-vec-preset="balance">Fechar Euler</button>
          <button class="preset" data-vec-preset="positive">Derivada positiva</button>
          <button class="preset" data-vec-preset="negative">Derivada negativa</button>
          <button class="preset" data-vec-preset="small">ε pequeno</button>
        </div>
      </div>`;

    $("#content").innerHTML=String.raw`
      <section class="hero">
        <article class="card">
          <div class="eyebrow">Direção factível</div>
          <h2>Poupar uma unidade é mover-se em uma direção específica</h2>
          <div class="formula-box" data-tex="\mathbf d=\begin{pmatrix}-1\\[2pt]1\end{pmatrix},\qquad (dc_t,dk_{t+1})=\varepsilon\mathbf d"></div>
          <p class="muted">A direção reduz consumo corrente e eleva capital futuro pela mesma quantidade.</p>
        </article>

        <article class="card">
          <div class="eyebrow">Derivada direcional</div>
          <div class="insight"><strong>Negativa:</strong> deslocar recursos para o futuro reduz bem-estar.</div>
          <div class="insight"><strong>Positiva:</strong> deslocar recursos para o futuro eleva bem-estar.</div>
          <div class="insight warn"><strong>Zero:</strong> a trajetória satisfaz a arbitragem marginal de Euler.</div>
        </article>
      </section>

      <section class="metrics">
        ${metric("Componente presente","vecPresent")}
        ${metric("Componente futura","vecFuture")}
        ${metric("Derivada direcional","vecDirectional")}
        ${metric("Variação exata","vecExact")}
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Plano das escolhas</div>
          <h2>Fronteira factível e vetor de poupança</h2>
          <div id="vecChoiceChart" class="chart tall"></div>
          <p class="chart-note">O vetor move o ponto para baixo e à direita ao longo da fronteira cₜ + kₜ₊₁ = Rₜ.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Decomposição vetorial</div>
          <h2>Gradiente presente + continuação futura</h2>
          <div id="vecGradientChart" class="chart tall"></div>
          <p class="chart-note">A projeção do gradiente total sobre d é a derivada direcional que aparece na Euler.</p>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">Interconexão com Euler</div>
        <h2>A equação como condição de ortogonalidade</h2>
        <div class="formula-box" data-tex="D_{\mathbf d}W_t=\nabla W_t\cdot\mathbf d=-u'(c_t)+\beta u'(c_{t+1})F'(k_{t+1})"></div>
        <div class="equation-strip">
          <div class="equation" data-tex="D_{\mathbf d}W_t>0\Rightarrow\text{poupar mais}"></div>
          <div class="equation" data-tex="D_{\mathbf d}W_t=0\Rightarrow\text{Euler}"></div>
          <div class="equation" data-tex="D_{\mathbf d}W_t<0\Rightarrow\text{consumir mais}"></div>
        </div>
        <div class="insight bad" style="margin-top:12px"><strong>Leitura geométrica:</strong> no ótimo interior, o gradiente do valor total não possui componente na direção factível de realocação entre consumo e capital.</div>
      </section>

      <footer>A Euler é a condição de que uma pequena transferência factível entre datas não tenha ganho de primeira ordem.</footer>`;

    renderAllMath();

    bindRange("vecBeta",s,"beta",updateVector);
    bindRange("vecA",s,"A",updateVector);
    bindRange("vecAlpha",s,"alpha",updateVector);
    bindRange("vecCt",s,"ct",updateVector);
    bindRange("vecCtp1",s,"ctp1",updateVector);
    bindRange("vecKp",s,"kp",updateVector);
    bindRange("vecEps",s,"epsilon",updateVector);

    $$("[data-vec-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.vecPreset;
        const growth=s.beta*mpk(s.kp,s.A,s.alpha);

        if(preset==="balance"){
          s.ctp1=Math.max(.08,s.ct*growth);
        }

        if(preset==="positive"){
          s.ctp1=Math.max(.08,.65*s.ct*growth);
        }

        if(preset==="negative"){
          s.ctp1=Math.max(.08,1.45*s.ct*growth);
        }

        if(preset==="small"){
          s.epsilon=.02;
        }

        renderVector();
      });
    });

    updateVector();
  }

  function updateVector(){
    const s=state.vector;
    const present=-1/s.ct;
    const future=s.beta*(1/s.ctp1)*mpk(s.kp,s.A,s.alpha);
    const directional=present+future;

    const newCt=Math.max(.02,s.ct-s.epsilon);
    const deltaF=production(s.kp+s.epsilon,s.A,s.alpha)-production(s.kp,s.A,s.alpha);
    const exact=(Math.log(newCt)-Math.log(s.ct))+
      s.beta*(Math.log(s.ctp1+deltaF)-Math.log(s.ctp1));

    $("#vecPresent").textContent=fmt(present,5);
    $("#vecFuture").textContent=fmt(future,5);
    $("#vecDirectional").textContent=fmt(directional,6);
    $("#vecExact").textContent=fmt(exact,6);

    const theme=chartTheme();
    const resources=s.ct+s.kp;
    const xFront=linspace(0,resources,220);
    const yFront=xFront.map(k=>resources-k);

    prettyPlot("vecChoiceChart",[
      {
        x:xFront,y:yFront,type:"scatter",mode:"lines",name:"Fronteira factível",
        fill:"tozeroy",fillcolor:rgba(theme.blue,.06),line:{color:theme.blue}
      },
      {
        x:[s.kp,s.kp+s.epsilon],
        y:[s.ct,newCt],
        type:"scatter",mode:"lines+markers",name:"Perturbação εd",
        line:{color:theme.rose,width:4},
        marker:{size:10,color:[theme.blue,theme.rose]}
      }
    ],plotLayout("Capital futuro, kₜ₊₁","Consumo atual, cₜ",{
      hovermode:"closest",
      xaxis:{...plotLayout("","").xaxis,range:[0,resources*1.08]},
      yaxis:{...plotLayout("","").yaxis,range:[0,resources*1.08]},
      annotations:[{
        x:s.kp+s.epsilon,
        y:newCt,
        text:"εd",
        showarrow:true,
        ax:28,
        ay:-28,
        arrowcolor:theme.rose,
        font:{color:theme.rose,size:12}
      }]
    }));

    const gradX=0;
    const gradY=1/s.ct;
    const contX=future;
    const contY=0;
    const totalX=contX;
    const totalY=gradY;
    const scale=Math.max(1,Math.abs(totalX),Math.abs(totalY));

    prettyPlot("vecGradientChart",[
      {
        x:[0,gradX],y:[0,gradY],type:"scatter",mode:"lines+markers",name:"Gradiente presente",
        line:{color:theme.blue,width:4},marker:{size:8,color:theme.blue}
      },
      {
        x:[0,contX],y:[0,contY],type:"scatter",mode:"lines+markers",name:"Continuação futura",
        line:{color:theme.teal,width:4},marker:{size:8,color:theme.teal}
      },
      {
        x:[0,totalX],y:[0,totalY],type:"scatter",mode:"lines+markers",name:"Gradiente total",
        line:{color:theme.violet,width:4},marker:{size:9,color:theme.violet}
      },
      {
        x:[0,1],y:[0,-1],type:"scatter",mode:"lines+markers",name:"Direção d",
        line:{color:theme.rose,dash:"dash",width:3},marker:{size:8,color:theme.rose}
      }
    ],plotLayout("Componente em kₜ₊₁","Componente em cₜ",{
      hovermode:"closest",
      xaxis:{...plotLayout("","").xaxis,range:[-1.25,Math.max(1.25,totalX*1.25)]},
      yaxis:{...plotLayout("","").yaxis,range:[-1.25,Math.max(1.25,totalY*1.25)]},
      annotations:[{
        x:1,y:-1,text:"d",showarrow:false,xshift:10,yshift:-8,font:{color:theme.rose,size:12}
      }]
    }));
  }

  /* ============================================================
     5. SUAVIZAÇÃO
  ============================================================ */

  function renderSmoothing(){
    const s=state.smoothing;

    $("#sidebar").innerHTML=String.raw`
      <h2 class="sidebar-title">Suavização do consumo</h2>
      <p class="sidebar-subtitle">Veja como paciência, retorno e curvatura determinam o crescimento do consumo.</p>

      ${slider("smoBeta","Fator de desconto",s.beta,.5,.995,.005,"Maior β favorece consumo futuro.",MATH.beta)}
      ${slider("smoA","Produtividade",s.A,.4,2.2,.05,"Eleva o retorno do capital.",MATH.A)}
      ${slider("smoAlpha","Elasticidade",s.alpha,.08,.92,.01,"Controla o produto marginal.",MATH.alpha)}
      ${slider("smoSigma","Curvatura CRRA",s.sigma,.4,3,.05,"Maior σ reduz a resposta do consumo ao retorno.",MATH.sigma)}
      ${slider("smoDelta","Depreciação",s.delta,0,1,.01,"Capital sobrevivente entra no retorno bruto.",MATH.delta)}
      ${slider("smoWedge","Wedge no retorno",s.wedge,0,.6,.01,"Reduz a parcela apropriável do produto marginal.",MATH.tau)}
      ${slider("smoKp","Capital futuro",s.kp,.02,2.5,.02,"Determina o retorno bruto.",MATH.kp)}
      ${slider("smoCt","Consumo atual",s.ct,.08,2.5,.02,"Base do consumo futuro implícito.",MATH.ct)}

      <div class="control">
        <div class="control-head"><span>Presets</span></div>
        <div class="preset-grid">
          <button class="preset" data-smo-preset="log">Log</button>
          <button class="preset" data-smo-preset="smooth">Mais avesso</button>
          <button class="preset" data-smo-preset="patient">Mais paciente</button>
          <button class="preset" data-smo-preset="steady">Estado estacionário</button>
        </div>
      </div>`;

    $("#content").innerHTML=String.raw`
      <section class="hero">
        <article class="card">
          <div class="eyebrow">Suavização ótima</div>
          <h2>Suavizar não significa necessariamente igualar consumo</h2>
          <div class="formula-box" id="smoFormula"></div>
          <p class="muted">O consumo cresce ou cai conforme o retorno descontado seja maior ou menor que um.</p>
        </article>

        <article class="card">
          <div class="eyebrow">Leitura econômica</div>
          <div class="insight"><strong>βR &gt; 1:</strong> o futuro é suficientemente atraente e o consumo tende a crescer.</div>
          <div class="insight"><strong>βR &lt; 1:</strong> o presente é relativamente mais valioso e o consumo tende a cair.</div>
          <div class="insight warn"><strong>σ elevado:</strong> o agente resiste mais a diferenças de consumo entre datas.</div>
        </article>
      </section>

      <section class="metrics">
        ${metric("Retorno bruto","smoReturn")}
        ${metric("Retorno descontado βR","smoDiscounted")}
        ${metric("Crescimento cₜ₊₁/cₜ","smoGrowth")}
        ${metric("Consumo futuro implícito","smoFuture")}
      </section>

      <section class="chart-grid">
        <article class="card chart-card">
          <div class="eyebrow">Resposta ao retorno</div>
          <h2>Crescimento para diferentes curvaturas</h2>
          <div id="smoGrowthChart" class="chart tall"></div>
          <p class="chart-note">A linha unitária separa consumo crescente de consumo decrescente.</p>
        </article>

        <article class="card chart-card">
          <div class="eyebrow">Padrão temporal</div>
          <h2>Consumo presente e futuro implícito</h2>
          <div id="smoPairChart" class="chart tall"></div>
          <p class="chart-note">A distância entre as barras reflete retorno, paciência e elasticidade intertemporal.</p>
        </article>
      </section>

      <section class="card">
        <div class="eyebrow">O verdadeiro conteúdo da suavização</div>
        <h2>Margens, não níveis, são equalizadas</h2>
        <div class="equation-strip">
          <div class="equation" data-tex="u'(c_t)=\beta u'(c_{t+1})R_{t+1}"></div>
          <div class="equation" data-tex="\frac{c_{t+1}}{c_t}=(\beta R_{t+1})^{1/\sigma}"></div>
          <div class="equation" data-tex="\operatorname{EIS}=1/\sigma"></div>
        </div>

        <table class="compare-table">
          <thead><tr><th>Mudança</th><th>Efeito sobre cₜ₊₁/cₜ</th><th>Intuição</th></tr></thead>
          <tbody>
            <tr><td>β aumenta</td><td>Aumenta</td><td>O agente dá mais peso ao futuro.</td></tr>
            <tr><td>R aumenta</td><td>Aumenta</td><td>Poupar hoje compra mais consumo amanhã.</td></tr>
            <tr><td>σ aumenta</td><td>Aproxima-se de 1</td><td>Há maior resistência a deslocar consumo entre datas.</td></tr>
            <tr><td>τ aumenta</td><td>Diminui</td><td>O retorno apropriável do investimento cai.</td></tr>
          </tbody>
        </table>

        <div class="insight bad" style="margin-top:12px"><strong>Armadilha:</strong> suavização não quer dizer cₜ = cₜ₊₁ em qualquer trajetória. Igualdade de consumo ocorre quando o retorno descontado relevante é exatamente um.</div>
      </section>

      <footer>A Euler suaviza utilidades marginais ajustadas pelo retorno, não necessariamente os níveis de consumo.</footer>`;

    renderAllMath();

    bindRange("smoBeta",s,"beta",updateSmoothing);
    bindRange("smoA",s,"A",updateSmoothing);
    bindRange("smoAlpha",s,"alpha",updateSmoothing);
    bindRange("smoSigma",s,"sigma",()=>{
      if(Math.abs(s.sigma-1)<.026){
        s.sigma=1;
        $("#smoSigma").value="1";
        $("#smoSigmaOut").textContent="1";
      }
      updateSmoothing();
    });
    bindRange("smoDelta",s,"delta",()=>{
      if(s.delta>.995){
        s.delta=1;
        $("#smoDelta").value="1";
        $("#smoDeltaOut").textContent="1";
      }
      updateSmoothing();
    });
    bindRange("smoWedge",s,"wedge",updateSmoothing);
    bindRange("smoKp",s,"kp",updateSmoothing);
    bindRange("smoCt",s,"ct",updateSmoothing);

    $$("[data-smo-preset]").forEach(button=>{
      button.addEventListener("click",()=>{
        const preset=button.dataset.smoPreset;
        if(preset==="log") Object.assign(s,{sigma:1,delta:1,wedge:0});
        if(preset==="smooth") Object.assign(s,{sigma:2.5});
        if(preset==="patient") Object.assign(s,{beta:.99});
        if(preset==="steady"){
          const denom=1-s.beta*(1-s.delta);
          const scale=(1-s.wedge)*s.alpha*s.beta*s.A;
          if(denom>0&&scale>0){
            s.kp=Math.pow(scale/denom,1/(1-s.alpha));
          }
        }
        renderSmoothing();
      });
    });

    updateSmoothing();
  }

  function updateSmoothing(){
    const s=state.smoothing;
    const gross=(1-s.wedge)*mpk(s.kp,s.A,s.alpha)+(1-s.delta);
    const discounted=s.beta*gross;
    const growth=Math.pow(Math.max(discounted,1e-12),1/s.sigma);
    const future=s.ct*growth;

    $("#smoReturn").textContent=fmt(gross,5);
    $("#smoDiscounted").textContent=fmt(discounted,5);
    $("#smoGrowth").textContent=fmt(growth,5);
    $("#smoFuture").textContent=fmt(future,4);

    const formula=Math.abs(s.sigma-1)<1e-9
      ?String.raw`\frac{c_{t+1}}{c_t}=\beta R_{t+1}`
      :String.raw`\frac{c_{t+1}}{c_t}=(\beta R_{t+1})^{1/\sigma}`;

    tex($("#smoFormula"),formula);

    const theme=chartTheme();
    const discountedGrid=linspace(.45,1.75,280);
    const sigmas=[.6,1,2.5];
    const colors=[theme.teal,theme.blue,theme.violet];

    const traces=sigmas.map((sigma,index)=>({
      x:discountedGrid,
      y:discountedGrid.map(value=>Math.pow(value,1/sigma)),
      type:"scatter",
      mode:"lines",
      name:`σ = ${fmt(sigma,1)}`,
      line:{color:colors[index]}
    }));

    traces.push({
      x:[discounted],y:[growth],type:"scatter",mode:"markers",name:"Configuração atual",
      marker:{size:11,color:theme.rose}
    });

    prettyPlot("smoGrowthChart",traces,plotLayout("Retorno descontado, βR","Crescimento, cₜ₊₁/cₜ",{
      shapes:[
        {type:"line",x0:.45,x1:1.75,y0:1,y1:1,line:{color:rgba(theme.rose,.45),dash:"dot"}},
        {type:"line",x0:1,x1:1,y0:0,y1:2,line:{color:rgba(theme.rose,.45),dash:"dot"}}
      ]
    }));

    prettyPlot("smoPairChart",[
      {
        x:["Consumo atual","Consumo futuro implícito"],
        y:[s.ct,future],
        type:"bar",
        name:"Consumo",
        marker:{color:[theme.blue,theme.teal]},
        text:[fmt(s.ct,3),fmt(future,3)],
        textposition:"outside",
        cliponaxis:false
      }
    ],plotLayout("Data","Consumo",{
      hovermode:"closest",bargap:.5
    }));
  }

  function resetCurrent(){
    state[state.mode]={...defaults[state.mode]};
    renderMode();
  }

  $$(".topic-btn").forEach(button=>{
    button.addEventListener("click",()=>setMode(button.dataset.mode));
  });

  $("#themeBtn").addEventListener("click",()=>{
    document.body.classList.toggle("dark");
    renderMode();
  });

  $("#resetBtn").addEventListener("click",resetCurrent);

  window.addEventListener("resize",()=>{
    $$(".chart").forEach(element=>{
      if(window.Plotly) Plotly.Plots.resize(element);
    });
  });

  document.addEventListener("DOMContentLoaded",renderMode);
  window.addEventListener("load",renderMode);
})();
</script>
</body>
